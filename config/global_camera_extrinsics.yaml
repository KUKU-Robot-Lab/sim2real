# 글로벌 D435i 카메라 extrinsics + 컵 CAD 프레임 정합
#
# cup_pose_relay.py 가 읽는다. Isaac ROS FoundationPose 출력(카메라 optical
# 프레임의 컵 CAD 프레임 pose)을 robot base 프레임의 sim body 프레임 pose로
# 변환해 /cup_pose 로 발행하기 위한 두 고정 변환:
#
#   T_base_body = T_base_cam ∘ T_cam_cad(FoundationPose 출력) ∘ T_cad_body
#
# 쿼터니언은 전부 wxyz 순서.

# ── T_base_cam: robot base ← camera_color_optical_frame ────────────────────
# FoundationPose 출력 프레임 = 입력 컬러 이미지의 optical 프레임
# (RealSense: camera_color_optical_frame, x우/y하/z전방).
# TODO(calibration): 실물 글로벌 카메라 장착 후 1회 캘리브레이션으로 교체.
#                    아래 값은 PLACEHOLDER — 이 상태로 실기 구동 금지.
camera:
  frame: camera_color_optical_frame
  position: [0.0, 0.0, 0.0]
  orientation_wxyz: [1.0, 0.0, 0.0, 0.0]

# ── T_cad_body: 컵 CAD 메시 프레임 → sim body 프레임 ───────────────────────
# FoundationPose에 넣는 CAD 메시의 원점/축이 sim의 컵 body 프레임
# (원점=컵 바닥 중심, +z=위, rim=+z 0.100)과 다르면 여기서 보정.
# scripts/cad_body_alignment.py 도출, cup.obj Y-up→body Z-up (perception/assets/Cup/cup.obj
# AABB min=[-0.0463,-0.0773,-0.0440] max=[0.0437,0.1003,0.0460] 기준, 2026-07-22).
# ⚠️ CAVEAT(정정 필요 가능): hdgp pour_v1/pour_sensor의 cup_big geometry 주석
# ("usd 기준: bottom=-0.077m, rim=+0.100m", pour_right_env_cfg.py)이 cup.obj의
# raw Y-AABB(-0.0773~0.1003)와 거의 정확히 일치 — 이는 sim body origin이
# "바닥 중심"이 아니라 "CAD 원점 그대로(무보정)"일 가능성을 시사한다(회전만 적용,
# position=[0,0,0]). 아래 값은 브리프 명시대로 "원점=바닥중심" 규약을 그대로
# 구현한 스크립트 출력이며, 이 CAVEAT은 미해결 상태로 후속 확인 필요.
cad_to_body:
  position: [0.001348, 0.000999, 0.077295]
  orientation_wxyz: [0.707107, 0.707107, 0.0, 0.0]

# /cup_pose 헤더에 기록할 base 프레임 이름 (소비자는 값만 사용, 정보성)
base_frame: base_link
