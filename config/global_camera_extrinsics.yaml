# 글로벌 D435i 카메라 extrinsics + 컵 CAD 프레임 정합
#
# cup_pose_relay.py 가 읽는다. Isaac ROS FoundationPose 출력(카메라 optical
# 프레임의 컵 CAD 프레임 pose)을 robot base 프레임의 sim body 프레임 pose로
# 변환해 /cup_pose 로 발행하기 위한 두 고정 변환:
#
#   T_base_body = T_base_cam ∘ T_cam_cad(FoundationPose 출력) ∘ T_cad_body
#
# 쿼터니언은 전부 wxyz 순서.

# ── T_base_cam: robot base ← camera_color_optical_frame ────────────────────
# FoundationPose 출력 프레임 = 입력 컬러 이미지의 optical 프레임
# (RealSense: camera_color_optical_frame, x우/y하/z전방).
# 캘리브(2026-08-02, head 카메라 ChArUco): 7x5 DICT_6X6, square 0.030/marker 0.022.
# 보드 CAD 고정 배치(base): 중앙 (0.420,-0.050,0.200), yaw=0, 긴변 +y, 인쇄면 위.
# T_base_cam = T_base_board(CAD) ∘ inv(T_cam_board) — 카메라위치 가정/yaw역산 불필요.
# 검출 24/24 corners, 재투영 0.274px. 교차검증: tilt 290 독립교정과 카메라위치 ~1cm 일치.
# ★교정 목 자세(head_v1.yaml, unwrapped 인코더 deg): pan=-90 / tilt=280.
#   이 extrinsics는 이 목 자세에서만 유효 — 배포 시 head_position_hold_node 로 동일 자세 재현.
#   회전 운영엔 hand-eye(T_neck_cam)+목 엔코더/FK 필요(별도).
#   재캘리브: 보드 CAD 위치 배치 + 목 pan=-90/tilt=280 고정 →
#   find_head_tilt.py(또는 다중프레임 캡처) → charuco_calib.py → recompute_from_cad.py --write.
camera:
  frame: camera_color_optical_frame
  position: [0.0638473958, 0.0405343559, 0.827139699]
  orientation_wxyz: [-0.137367707, 0.697932932, -0.688537236, 0.14119565]

# ── T_cad_body: 컵 CAD 메시 프레임 → sim body 프레임 ───────────────────────
# FoundationPose에 넣는 CAD 메시의 원점/축이 sim의 컵 body 프레임과 다르면
# 여기서 보정. sim body 프레임은 "바닥 중심"이 아니라 mesh 원점 그대로다
# (+z=위, bottom=-0.077m, rim=+0.100m).
# cad_body_alignment.py 도출: cup.obj Y-up→sim body Z-up 회전만.
# 원점=mesh 원점(hdgp pour_v5/pour_right_env_cfg.py:198 bottom=-0.077/rim=+0.100 ==
# cup.obj Y-AABB 근거).
cad_to_body:
  position: [0.0, 0.0, 0.0]
  orientation_wxyz: [0.707107, 0.707107, 0.0, 0.0]

# /cup_pose 헤더에 기록할 base 프레임 이름 (소비자는 값만 사용, 정보성)
base_frame: base_link
