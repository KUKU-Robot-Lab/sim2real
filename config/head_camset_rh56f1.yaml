# head(목) camset 자세 — RH56F1 로봇(5090), shaker · 파랑 · 분홍을 놓는 영역이 한 화면에 드는 자세 (2026-10-28)
#
# 10.28 사용자(sim_e2e 경유): "pan 세팅" = 세 물체가 한 화면에 모두 들어오는 목 자세. sim_e2e 후보(home 에서 pan 오른쪽 20° ·
#   위 5°)를 실기에서 sim 시야에 맞췄다(처짐 · FK 근사 오차를 가르지 않고 시야로) → 멈춘 자리 pan 1825 · tilt 2815 틱
#   (home 2033 · 2864 에서 오른쪽 208 · 위 49 틱). 카메라 외부 파라미터는 그 자리에서 쟀다:
#   config/global_camera_extrinsics_arm4090_r20u5.yaml(head_pose 1825 · 2815). 사진: handoff/2026-10-28_camset/
#   real_r20u5_regions.png(물체 놓는 영역) · camset_compare_real.png(sim/실기).
# ★goal_bias_tick: 이 머리는 목표 레지스터보다 pan 19 · tilt 3 틱 큰 자리에 선다 — 펌웨어 궤적 끝(Position Trajectory)부터
#   목표와 다르다(10.28 실측 1805→1824 · 1815→1834 · 1806→1825 · 2807→2810 · 2812→2815). 그만큼 빼서 쓰면(목표 1806 · 2812)
#   아래 deg 자리에 선다. 목 드라이버(head_joint_publisher)는 deg 기준 ±0.3° 로 판정하고 1.0° 안만 다시 맞추므로 보정이 없으면
#   pan 1.67° 차로 실패한다.
# 미션(scripts/ops/make_rh56f1_missions.py STATIONS["5090"])이 이 파일을 목 드라이버의 기준 자세로 쓴다. 외부 파라미터를 다시 재서
#   head_pose 가 바뀌면 deg 도 같이 맞춘다(tests/s2r_console/test_rh56f1_mission.py 가 둘이 같은지 본다).
#   포트 · 게인 · 프로파일은 config/head_home_rh56f1.yaml(home 자세)과 같다.
port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763P8T-if00-port0
baud: 1000000

motors:
  pan:
    id: 1
    deg: -19.56          # 틱 1825(offset +1024 적용 후) = 외부 파라미터 r20u5 head_pose pan
    goal_bias_tick: -19  # 목표 1806 을 쓰면 1825 에 선다
  tilt:
    id: 2
    deg: 67.473          # 틱 2815(offset −1024 적용 후) = 외부 파라미터 r20u5 head_pose tilt
    goal_bias_tick: -3   # 목표 2812 를 쓰면 2815 에 선다

position_i_gain: 400

# 순서 규약은 config/head_home.yaml 과 같다: 토크off → 모드 → 게인 → 프로파일 → 토크on → 목표
operating_mode: 3
profile_acceleration: 20
profile_velocity: 50
