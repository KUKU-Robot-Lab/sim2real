# 물체 레지스트리 — FP++ 인지 서브시스템의 진실원천 (2026-09-03).
# 이름 = sim 물체 이름(cup_pose_stub.json 의 "물체"). FP++ 노드 yaml 은 여기서 생성한다.
# ★FP++ 메시는 sim 자산 메시와 같은 물체여야 한다 (shaker 09.03 교훈: 조립본 CAD 는 z 파묻힘).
camera_extrinsics: config/global_camera_extrinsics.yaml   # camera: 블록만 공유, cad_to_body 는 아래 항목이 이긴다
objects:
  shaker_closed:
    real: "파란 열린 shaker (무광, 뚜껑 없음)"
    fpp:
      mesh_path: assets/meshes/shaker_cad.obj     # ★2026-09-07 사용자 지정 CAD
      # hdgp/assets/simulation_setting/shaker/meshes/visual/shaker.obj 사본.
      # 크기는 sim 자산과 같은 물체다(175 mm × ⌀88 mm) — 09.03 에 문제였던 238 mm 조립본이 아니다.
      # ⚠단일 회색(102,102,102)이라 외관 신호가 없다. 색을 가진 shaker_sim.ply 로 되돌리려면
      #   mesh_path 를 assets/meshes/shaker_sim.ply 로, cad_to_body.position 을 [0,0,0] 으로.
      mesh_scale_to_meters: 1.0
      cup_class_id: 41
      detection_pick: blue
      yolo_confidence: 0.35
    cad_to_body:
      # CAD 원점은 물체 **중심**(바닥+87.5 mm), sim body 원점은 바닥+92.1 mm →
      # body 원점은 CAD 프레임에서 +z 로 4.6 mm 위. 축 방향은 둘 다 Z-up 이라 회전은 항등.
      position: [0.0, 0.0, 0.0046]
      orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
    sim:
      usd: hdgp/assets/cup/shaker_closed_rl.usd
      origin_above_bottom_m: 0.0921
    aabb: [[-0.044, -0.044, -0.0921], [0.044, 0.044, 0.0829]]    # 물체 프레임, 뷰어 3D 박스용
    symmetry_axis: [0.0, 0.0, 1.0]     # 원통 대칭축(CAD 프레임) — 축 둘레 twist 를 버린다
  cup_big_s100:
    real: "빨간 컵"
    fpp:
      mesh_path: assets/meshes/cup.obj
      mesh_scale_to_meters: 1.0
      cup_class_id: 41
      detection_pick: red
      yolo_confidence: 0.15
    cad_to_body:
      position: [0.0, 0.0, 0.0]
      orientation_wxyz: [0.707107, -0.707107, 0.0, 0.0]  # cup.obj Y-up → sim Z-up = rot_x(−90°): body z → CAD +y
                                                         # ★구값 +90° 는 body z 를 CAD −y 로 보내 자세가 거꾸로였다(09.03 실측)
    sim:
      usd: hdgp/assets/cup/cup_big_rl.usd
      origin_above_bottom_m: 0.0773
    aabb: [[-0.0463, -0.0773, -0.044], [0.0437, 0.1003, 0.046]]   # CAD(Y-up) 프레임 AABB
    symmetry_axis: [0.0, 1.0, 0.0]     # cup.obj 는 Y-up 이라 대칭축이 CAD y
aliases:
  cup_big_s080: cup_big_s100     # sim 스케일 변형 — 실물은 하나
  cup_big_s120: cup_big_s100
