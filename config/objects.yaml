# 물체 레지스트리 — FP++ 인지 서브시스템의 진실원천 (2026-09-03).
# 이름 = sim 물체 이름(cup_pose_stub.json 의 "물체"). FP++ 노드 yaml 은 여기서 생성한다.
# ★FP++ 메시는 sim 자산 메시와 같은 물체여야 한다 (shaker 09.03 교훈: 조립본 CAD 는 z 파묻힘).
camera_extrinsics: config/global_camera_extrinsics.yaml   # camera: 블록만 공유, cad_to_body 는 아래 항목이 이긴다
objects:
  shaker_closed:
    real: "파란 열린 shaker (무광, 뚜껑 없음)"
    fpp:
      mesh_path: assets/meshes/shaker_cad.obj     # ★2026-09-07 사용자 지정 CAD
      # hdgp/assets/simulation_setting/shaker/meshes/visual/shaker.obj 사본.
      # 크기는 sim 자산과 같은 물체다(175 mm × ⌀88 mm) — 09.03 에 문제였던 238 mm 조립본이 아니다.
      # ⚠단일 회색(102,102,102)이라 외관 신호가 없다. 색을 가진 shaker_sim.ply 로 되돌리려면
      #   mesh_path 를 assets/meshes/shaker_sim.ply 로, cad_to_body.position 을 [0,0,0] 으로.
      mesh_scale_to_meters: 1.0
      cup_class_id: 41
      detection_pick: blue
      yolo_confidence: 0.35
    cad_to_body:
      # CAD 원점은 물체 **중심**(바닥+87.5 mm), sim body 원점은 바닥+92.1 mm →
      # body 원점은 CAD 프레임에서 +z 로 4.6 mm 위. 축 방향은 둘 다 Z-up 이라 회전은 항등.
      position: [0.0, 0.0, 0.0046]
      orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
    sim:
      usd: hdgp/assets/cup/shaker_closed_rl.usd
      origin_above_bottom_m: 0.0921
    aabb: [[-0.044, -0.044, -0.0921], [0.044, 0.044, 0.0829]]    # 물체 프레임, 뷰어 3D 박스용
    symmetry_axis: [0.0, 0.0, 1.0]     # 원통 대칭축(CAD 프레임) — 축 둘레 twist 를 버린다
  cup_big_s100:
    real: "빨간 컵"
    fpp:
      mesh_path: assets/meshes/cup.obj
      mesh_scale_to_meters: 1.0
      cup_class_id: 41
      detection_pick: red
      yolo_confidence: 0.15
    cad_to_body:
      position: [0.0, 0.0, 0.0]
      orientation_wxyz: [0.707107, -0.707107, 0.0, 0.0]  # cup.obj Y-up → sim Z-up = rot_x(−90°): body z → CAD +y
                                                         # ★구값 +90° 는 body z 를 CAD −y 로 보내 자세가 거꾸로였다(09.03 실측)
    sim:
      usd: hdgp/assets/cup/cup_big_rl.usd
      origin_above_bottom_m: 0.0773
    aabb: [[-0.0463, -0.0773, -0.044], [0.0437, 0.1003, 0.046]]   # CAD(Y-up) 프레임 AABB
    symmetry_axis: [0.0, 1.0, 0.0]     # cup.obj 는 Y-up 이라 대칭축이 CAD y
  aglt_cup_s065:
    real: "흰 aglt 컵 — shaker_closed_thick × 0.65 출력물(arm4090, 위 ⌀57 · 아래 ⌀38 · 높이 113.75 mm)"
    # 10.01 사용자: rh_aglt 학습 컵(hdgp rh_aglt_env_cfg CUP_USD shaker_closed_thick_rl.usd · cup_scale 0.65)의 실물.
    #   cup_big(90 × 178 mm) · shaker_closed(175 mm) 메시로 따라가면 z −36 mm · 기울기 10° 로 틀어졌다.
    fpp:
      mesh_path: assets/meshes/shaker_cad.obj     # shaker 외형(⌀88 × 175 mm) — × 0.65 가 실물 프로파일과 0.2 mm 안
      mesh_scale_to_meters: 0.65
      cup_class_id: 41
      detection_pick: bright                      # 흰색 — 검은 상판 위에서 가장 밝은 컵
      yolo_confidence: 0.25
    cad_to_body:
      # shaker_closed 의 0.0046(CAD 중심 → sim body 원점)을 × 0.65. 축은 둘 다 Z-up.
      position: [0.0, 0.0, 0.00299]
      orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
    sim:
      usd: hdgp/assets/cup/shaker_closed_thick_rl.usd
      origin_above_bottom_m: 0.05987             # 0.0921 × 0.65 (rh_aglt CUP_UNIT.bottom_z × cup_scale)
    aabb: [[-0.0286, -0.0286, -0.05987], [0.0286, 0.0286, 0.05389]]
    symmetry_axis: [0.0, 0.0, 1.0]
  cyl60:
    real: "노란 원통 cyl60(⌀60 × 170 mm, 벽 2.5 mm) — rh_aglt cyl60 정책 · 붓기 인계 컵(arm4090) · 10.08 부터 오른쪽 컵(왼쪽은 cyl60_blue)"
    # 10.04 T2R Grasping: aglt_r_cyl60g · aglt_l_cyl60gmir ep2600 으로 s2r(사용자 승인). sim 자산 hdgp/assets/cyl_60mm/cyl_60mm_rl.usd,
    #   원점 = 원통 중심(바닥 위 0.085). YOLO 는 이 원통을 cup(41)으로 약하게 잡는다(10.03 눕힌 원통 0.13) — 문턱을 낮게,
    #   검은 상판 위 노란색이라 가장 밝은 것을 고른다(검은 컵홀더는 어둡다).
    fpp:
      mesh_path: assets/s2r_meshes/cyl60.obj     # sim2real assets/meshes(fpp_up.sh 가 붙인다) — m 단위
      mesh_scale_to_meters: 1.0
      cup_class_id: 41
      detection_pick: bright
      yolo_confidence: 0.1
      group: cups                                # 10.08 색 다른 cyl60 셋을 컨테이너 fpp_cups 하나에서 한 번 찍는다
      color: yellow
    cad_to_body:
      position: [0.0, 0.0, 0.0]          # 메쉬 원점 = sim body 원점(중심), 축 같음
      orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
    sim:
      usd: hdgp/assets/cyl_60mm/cyl_60mm_rl.usd
      origin_above_bottom_m: 0.085
    aabb: [[-0.030, -0.030, -0.085], [0.030, 0.030, 0.085]]
    symmetry_axis: [0.0, 0.0, 1.0]
    # 10.04 arm4090 첫 확인: 바깥은 위아래 같은 원통이라 FP++ 가 뒤집어 잡았다(축 기울기 179°, 위치 · 높이는 맞음 — 원점 = 중심).
    #   aglt 시작 검사(서 있는 컵, 기울기 15° 이하)가 거부한다 → 출력 축을 위로 맞춘다. 테이블 위 서 있는 컵에만 맞는 가정이다
    #   (90° 넘게 기운 컵 · 붓는 중은 FP++ 가 아니라 손바닥 FK 로 본다).
    symmetry_flip: true
  cyl60_blue:
    real: "파란 원통 cyl60(⌀60 × 170 mm) — 10.08 사용자: 왼쪽 파랑 · 오른쪽 노랑(cyl60). 모양 · 메쉬 · 원점은 cyl60 과 같다"
    # 10.08 처음엔 물체마다 컨테이너(파랑 = detection_pick blue · 노랑 = bright) → 같은 날 묶음 fpp_cups 하나로(fpp.group ·
    #   color = 마스크 hue 비율, scripts/fpp_color_pick.py). 같은 색 컵 둘이면 못 가른다.
    fpp:
      mesh_path: assets/s2r_meshes/cyl60.obj
      mesh_scale_to_meters: 1.0
      cup_class_id: 41
      detection_pick: blue
      yolo_confidence: 0.1
      group: cups
      color: blue
    cad_to_body:
      position: [0.0, 0.0, 0.0]
      orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
    sim:
      usd: hdgp/assets/cyl_60mm/cyl_60mm_rl.usd
      origin_above_bottom_m: 0.085
    aabb: [[-0.030, -0.030, -0.085], [0.030, 0.030, 0.085]]
    symmetry_axis: [0.0, 0.0, 1.0]
    symmetry_flip: true                  # cyl60 과 같은 이유 — 위아래 같은 원통을 FP++ 가 뒤집어 잡는다
  cyl60_pink:
    real: "핑크 원통 cyl60(⌀60 × 170 mm) — 10.08 사용자: 파랑 · 핑크 · 노랑 셋. 모양 · 메쉬 · 원점은 cyl60 과 같다"
    fpp:
      mesh_path: assets/s2r_meshes/cyl60.obj
      mesh_scale_to_meters: 1.0
      cup_class_id: 41
      detection_pick: red                # 물체별 컨테이너로 띄울 때만 쓴다(핑크 = 빨강이 가장 센 쪽). 묶음은 color
      yolo_confidence: 0.1
      group: cups
      color: pink                        # 10.08 실측 hue 158(OpenCV) · 채도 128
    cad_to_body:
      position: [0.0, 0.0, 0.0]
      orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
    sim:
      usd: hdgp/assets/cyl_60mm/cyl_60mm_rl.usd
      origin_above_bottom_m: 0.085
    aabb: [[-0.030, -0.030, -0.085], [0.030, 0.030, 0.085]]
    symmetry_axis: [0.0, 0.0, 1.0]
    symmetry_flip: true
  source240_orange:
    real: "주황 source240 병(PLA, 높이 240 · 몸통 Ø60 · 목 Ø30) — 10.09 사용자: 왼쪽 주황 · 오른쪽 핑크. rh_aglt 우 src21c 학습 물체"
    # 묶음 bottles(컨테이너 fpp_bottles 하나, 한 번 찍기). YOLO 는 병을 bottle(39)로 잡는다 — cup(41) 이 아니다.
    #   원점 = 바닥 위 85 mm(hdgp make_source_rl_asset.py · env source240_pla 와 같음). 메쉬도 그 원점으로 옮겨 두었다.
    fpp:
      mesh_path: assets/s2r_meshes/source240.obj
      mesh_scale_to_meters: 1.0
      cup_class_id: 39
      detection_pick: bright
      yolo_confidence: 0.1
      group: bottles
      color: orange
    cad_to_body:
      position: [0.0, 0.0, 0.0]
      orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
    sim:
      usd: hdgp/assets/source_cup/source_240_rl.usd
      origin_above_bottom_m: 0.085
    aabb: [[-0.030, -0.030, -0.085], [0.030, 0.030, 0.155]]
    symmetry_axis: [0.0, 0.0, 1.0]     # 축대칭 · 위아래는 다르다(목) — 뒤집기 보정 안 함
  source240_pink:
    real: "핑크 source240 병(PLA, 높이 240 · 몸통 Ø60 · 목 Ø30) — 10.09 사용자: 왼쪽 주황 · 오른쪽 핑크. rh_aglt 우 src21c 학습 물체"
    # 묶음 bottles(컨테이너 fpp_bottles 하나, 한 번 찍기). YOLO 는 병을 bottle(39)로 잡는다 — cup(41) 이 아니다.
    #   원점 = 바닥 위 85 mm(hdgp make_source_rl_asset.py · env source240_pla 와 같음). 메쉬도 그 원점으로 옮겨 두었다.
    fpp:
      mesh_path: assets/s2r_meshes/source240.obj
      mesh_scale_to_meters: 1.0
      cup_class_id: 39
      detection_pick: red
      yolo_confidence: 0.1
      group: bottles
      color: pink
    cad_to_body:
      position: [0.0, 0.0, 0.0]
      orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
    sim:
      usd: hdgp/assets/source_cup/source_240_rl.usd
      origin_above_bottom_m: 0.085
    aabb: [[-0.030, -0.030, -0.085], [0.030, 0.030, 0.155]]
    symmetry_axis: [0.0, 0.0, 1.0]     # 축대칭 · 위아래는 다르다(목) — 뒤집기 보정 안 함
  cup_holder:
    real: "검은 컵홀더 — hdgp/assets/cup_holder 형상 출력물(링 ⌀80/⌀70 · 테이블 끝 클램프), 테이블 왼쪽부터 0 · 1 · 2"
    # 10.03 사용자: 마커 추정(scripts/calib/cup_holder_pose.py)을 FP++ 로 재확인. YOLO(yolov8m-seg)는 홀더를 cup(41)으로
    #   잡는다(10.03 arm4090 한 장: id2 0.57 · id0 0.20 · id1 0.11, 노란 원통 0.13). confidence 0.3 으로는 첫 프레임에
    #   노란 원통을 잡아 홀더 메쉬를 원통에 맞췄다(투영 332,252 px = 원통) → 검은 것을 고른다. 컨테이너 하나 = 홀더 하나라
    #   어느 홀더인지는 결과 xy 로 가린다. 홀더별로 따로 보려면 검출 쪽에 위치 고르기가 필요하다.
    fpp:
      mesh_path: assets/s2r_meshes/cup_holder.obj   # sim2real assets/meshes 를 컨테이너에 붙인 자리(fpp_up.sh) — m 단위
      mesh_scale_to_meters: 1.0
      cup_class_id: 41
      detection_pick: dark
      yolo_confidence: 0.1
    cad_to_body:
      position: [0.0, 0.0, 0.0]          # 메쉬 원점 = 홀더 원점(컵 축 위 받침 윗면), 축도 같다
      orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
    sim:
      usd: hdgp/assets/cup_holder/cup_holder_rl.usd
      origin_above_bottom_m: 0.030       # 받침 바닥 −30 mm
    aabb: [[-0.041, -0.040, -0.0501], [0.100, 0.040, 0.030]]
    # symmetry_axis 없음 — 클램프가 있어 yaw 를 버리지 않는다

aliases:
  cup_big_s080: cup_big_s100     # sim 스케일 변형 — 실물은 하나
  cup_big_s120: cup_big_s100
