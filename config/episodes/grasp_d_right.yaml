# 경로 D — right 손 source240(파란 병, FP++ source240b_blue).
# ★10.20 사용자 "grasp_b 는 그대로 두고, grasp_d 를 1-b 접근에 rcg03 으로 교체": 접근 = 1-B reach(ready_carry · aglt_new ReadyApproach
# 사전 파지, 테이블 · 자기 충돌 · 반대팔 · 관절 검사, tools/plan_reach.py --stop pregrasp) — 들어가기는 하지 않고 사전 파지 자리
# (컵 축 2.5 R · 높이 0, 0 에서 안 되면 +1 · 2 · 3 cm)에서 멈춘다 = rcg03 학습 시작 자세(aglt_start=ready, sim 사전 파지 IK · Mover 와
# 같은 값 · 같은 hdgp 코드). 그 자리에서 rcg03 정책 노드가 시작(사전 파지 자리 3 cm 검사 · 디코더는 실측 팔 · 편 손 · 목표 = 컵 + 10 cm ·
# LSTM 0 에서 대기 10 틱)해 쥐고 첫 목표 성공 또는 7 cm 위 2 s 쥠 유지에 끝난다(pd 가 붙듦).
#   옛 경로 D(ap05 접근 → 같은 노드에서 rcg03 넘김)는 뺐다: 실기 10.20 bag 두 회에서 ap05 가 멈춘 방위가 rcg03 학습 시작 방위와
#   오른손 −25° · 왼손 +15° 달랐다(손목 j6 학습 분포 3σ 밖).
# 계획 · 검사가 걸리면 reach 에서 움직이지 않고 멈춘다(refused). 정책 시간 초과 · 실패면 abort(pd 가 그 자세로 붙듦 — 복구는 rehome).
# 물체 바꾸기: 실행기 파라미터 -p policy_object:=<source240_real|source200_real|shaker_c_real> -p cup_object:=<FP++ 물체 이름>.
episode: {name: grasp_d_right, version: 2}
objects:
  CUP: {topic: /objects/source240b_blue/pose}
policies:
  rh_aglt_r: {policy: rh56f1/aglt/right_rcg03, kind: aglt, side: right}
trajectories:
  go_home: {kind: rehome, sides: [right]}
  reach: {kind: reach, sides: [right], asset: tilt/base_arc6, cups: false, object: CUP, stop: pregrasp}
failure_policy: {default: 0}  # 실패 시 자동 복구 없음. 운영자가 rehome으로 복구한다.
sequence:
  - {id: go_home_start, type: trajectory, name: go_home, expect: {pose: HOME}, checkpoint: HOME_START}
  - {id: scene, type: snapshot}
  - {id: open_hand, type: hand, action: open, sides: [right]}
  - {id: reach, type: trajectory, name: reach}
  - {id: grasp_lift, type: policy, name: rh_aglt_r, target_object: CUP, policy_object: source240_real, expect: {right_hand: CUP}}
  - {id: done, type: terminal, result: SUCCESS}
