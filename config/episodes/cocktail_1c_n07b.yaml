# 칵테일 1차 에피소드 — 안 B(★11.16 사용자 "안 B 로 세팅"): cocktail_1c_e4000 에서 파랑만 붓고 오른손 놓기를 n07 로 바꾼 판.
#   목적: e4000 은 학습 때 래치를 sim 참 컵 자세로 계산해 실기 붙인 자세(FK ⊗ T_in)에서는 래치가 안 걸린다. 같은 체인 조건
#   (붙인 자세 tin_json · 이송 rate_scale 0.5 · cup_obs_offset · 실패 정책)에서 놓기 정책만 n07 로 바꿔 정책 차이와 체인 조건을 가른다.
#   · rh_place_r = rh56f1/place/right_n07 (obs 101 · 이웃 관측 0 · 래치 GRU latch/est_r.pt · ready_carry 600 · 컵 attached 계약)
#     홀더 1 은 계약 holder_range x 에서 2.9 mm 밖이지만 홀더 허용 2 cm 안이다.
#   · rh_place_l = rh56f1/place/left_n09_e3800 (e4000 과 같다)
#   한 팔에 놓기 노드가 하나(rh_place_node_<팔>)라 같은 미션에 오른손 놓기 정책 둘을 못 띄운다 — e4000 과 따로 카드 · 미션 단계다.
#   순서: 양손 잡기 → tilt_blue → place_blue(n07) → 오른팔 홈 → place_shaker → 홈. 분홍 잡기 · 붓기 · 놓기는 뺐다.
#   분홍 컵은 e4000 처럼 상자 안 탁자에 둔다 — place_blue 까지 조건(scene 검사 · grasp_blue 들기 가드)을 e4000 과 같게 둔다.
#   objects 에 SRC_PINK 가 있으니 분홍이 안 보이거나 상자 밖이면 scene 에서 멈춘다.
#   ★place_shaker 의 왼손 T_in 은 tilt_blue 직전 값이다(e4000 은 tilt_pink 직전 값). tilt 는 양팔이 다 쥔 채 돌아 그때 왼손 T_in 도
#   재고(episode_ros tin_objs), 그 뒤 홈 · 놓기는 T_in 을 지우지 않는다. 왼팔은 tilt 끝 자세에서 셰이커를 든 채 기다린다.
episode: {name: cocktail_1c_n07b, version: 1}   # v1(11.16): e4000 v1 + 파랑만 · 오른손 놓기 right_n07
objects:
  SRC_BLUE: {topic: /objects/source240_blue/pose}
  # ★10.28 순서 B — 처음부터 탁자에 있다. ★10.29 구멍 옆 v1 상자만 받는다 · FP++ 는 분홍만 든 묶음 source240_pink(cocktail_1 머리말)
  SRC_PINK: {topic: /objects/source240_pink/pose}   # ★11.20 사용자 "이제는 그냥 없어도 될것같은 조건" — region(x 0.26~0.305 · y −0.365~−0.330) 검사 뺌. 옛 주석: ★11.04 사용자 "허용 범위를 높여 둠" — +x 5 mm · +y 1 cm(손으로 놓으면 +x·+y 모서리 0~4 mm 밖에서 scene 거부). −x(손목) · −y(불가 자세)는 그대로
  SHAKER: {topic: /objects/shaker_c_orange/pose}
holders: {HOLDER_0: 0, HOLDER_1: 1, HOLDER_2: 2}
holder_poses: config/cup_holder_poses_5090_v1.yaml
tin_fallback: deploy/policy_control/config/tilt/traj_v12_240/ref/tin_fixed_1107.json   # tilt 직전 T_in 측정 실패 때 고정값(SIM2REAL 상대, git 추적 · 원본 logs/analysis/tilt_tin_1107/out 같은 md5)
policies:
  rh_aglt_r: {policy: rh56f1/aglt/right_approach_ap05, kind: aglt, side: right, approach_grasp: {handoff: 1}, handoff: rh56f1/aglt/right_rcg04, cup_obs_offset_base_m: [-0.0136, 0.0085, 0.0]}   # ★11.10 사용자: 오른팔 j3 영점 보정(+5.2°) 뒤 — 영점이 해결한 몫([-2,-25,+2] mm, 175211 bag)을 뺀 나머지. 이전 [-0.0116, 0.0338, 0.0]   # 11.04 정지 자세 Rm(R1 접근 높이와 R2 쥐는 높이 사이), e1000 과 같은 값
  rh_aglt_l: {policy: rh56f1/aglt/left_approach_ap05, kind: aglt, side: left, approach_grasp: {handoff: 1}, handoff: rh56f1/aglt/left_rcg04, cup_obs_offset_base_m: [0.0028, 0.0283, 0.0046]}   # 11.04 정지 자세 L2(잡기 직전), logs/analysis/frame_offset_1104/measure2
  # ★11.07 붙인 자세 = tilt 직전 정지 창 실측 T_in(묶음은 tilt 직전과 28~37 mm · 컵 기울기 10° 넘게 어긋났다, logs/analysis/tilt_tin_1107)
  rh_place_r: {policy: rh56f1/place/right_n07, kind: place, side: right, attach_source: tin_json}
  rh_place_l: {policy: rh56f1/place/left_n09_e3800, kind: place, side: left, attach_source: tin_json}   # ★11.08 사용자 "왼손도 미리 넣어둬" — 붙인 자세 = tilt 직전 실측 T_in_l(셰이커, 실패면 tin_fallback T_in_l)
trajectories:
  go_home: {kind: rehome, sides: [right, left]}
  go_home_r: {kind: rehome, sides: [right]}                         # 왼손은 shaker 를 든 채
  go_home_l: {kind: rehome, sides: [left]}                          # 오른팔은 이미 홈(빈손)
  to_tilt_start_r: {kind: carry, sides: [right], asset: tilt/base_arc6, rate_scale: 0.5}   # ★11.16 사용자 "천천히가 아니라 급작스럽게" — sim 빠르기(1.3~1.8 s, 관절 최대 41°/s)의 절반
  to_tilt_start_l: {kind: carry, sides: [left], asset: tilt/base_arc6, rate_scale: 0.5}
  tilt: {kind: tilt, sides: [right, left], asset: tilt/traj_v12_240, rate_scale: 1.0, cup: "240"}   # ★11.08 사용자 "240만이라도 잘되면 됨": v12 = v11 입구 목표 + 실기 실측 T_in(tilt 직전) · 붓는 컵 source240
failure_policy: {default: 0}  # 실패 시 자동 복구 없음. 운영자가 판단한다(컵을 쥔 채 rehome 은 거부된다).
continue_on_fail: [place]     # ★11.07 사용자 "어차피 place 이후엔 실패하든 성공하든 그냥 home 자세로 가는게 맞는데" — 놓기 실패(시간 초과 포함, 손이 컵에 걸린 경우 제외)면 멈추지 않고 다음 노드로
sequence:
  - {id: go_home_start, type: trajectory, name: go_home, expect: {pose: HOME}, checkpoint: HOME_START}
  - {id: scene, type: snapshot}                                     # 파랑 · 분홍 · shaker — 분홍이 상자 밖이면 여기서 정지
  # 1) 파랑 붓기 — 분홍은 탁자에 서 있다
  # ★11.08 사용자 "일단 넣어주고": 들기 가드 G40H8(sim 1108_lift_guard G40H8_h120) — 들며 옆으로 도는 팔 · 손이 탁자 위 분홍에
  #   40 mm 안으로 오거나 컵이 8 cm 넘게 들려 쥔 채면 정책을 멈추고 직전 목표로 붙든다. 분홍 잡기 · 왼손에는 켜지 않는다
  # ★11.08 사용자 "왼손, 오른손 정책들은 기본이 독립으로 운영되는게 맞음": 잡기 → tilt 시작 자세를 팔마다 따로(lanes).
  #   먼저 끝난 팔은 다른 팔을 기다리지 않고 tilt 시작 자세로 간다. 두 줄이 다 끝나야 tilt_blue. 한 줄 실패 = 다른 줄도 정지.
  - id: grasp_to_tilt_start
    type: lanes
    expect: {pose: SETTING}
    lanes:
      - side: right
        nodes:
          - {id: grasp_blue, type: policy, name: rh_aglt_r, target_object: SRC_BLUE, policy_object: source240_real,
             lift_guard: {object: SRC_PINK, guard_mm: 40, hstop_m: 0.08}, expect: {right_hand: SRC_BLUE}}
          - {id: to_tilt_start_r1, type: trajectory, name: to_tilt_start_r}
      - side: left
        nodes:
          - {id: grasp_shaker, type: policy, name: rh_aglt_l, target_object: SHAKER, policy_object: shaker_c_real,
             expect: {left_hand: SHAKER}}
          - {id: to_tilt_start_l, type: trajectory, name: to_tilt_start_l}
  - {id: tilt_blue, type: trajectory, name: tilt, expect: {pose: SETTING, blue_poured: true}}
  - {id: place_blue, type: policy, name: rh_place_r, source_object: SRC_BLUE, target_holder: HOLDER_1, policy_object: source240_real,
     expect: {right_hand: EMPTY, left_hand: SHAKER, blue_placed: true}}
  - {id: home_r_after_blue, type: trajectory, name: go_home_r, auto: true, expect: {right_hand: EMPTY, left_hand: SHAKER}}
  # 2) 정리 — 왼손은 tilt 끝 자세에서 shaker 를 든 채 기다렸다
  - {id: place_shaker, type: policy, name: rh_place_l, source_object: SHAKER, target_holder: HOLDER_0, policy_object: shaker_c_real,
     expect: {right_hand: EMPTY, left_hand: EMPTY, shaker_placed: true}}
  - {id: home_l_after_shaker, type: trajectory, name: go_home_l, auto: true, expect: {right_hand: EMPTY, left_hand: EMPTY}}   # ★11.18 사용자: place 뒤 홈
  - {id: go_home_end, type: trajectory, name: go_home, auto: true, expect: {pose: HOME}}
  - {id: done, type: terminal, result: SUCCESS}
