# 이 파일은 scripts/ops/make_rh56f1_missions.py 가 grasp_f_left.yaml 에서 물체만 바꿔 만든다 — 손으로 고치지 말 것(--check).
# 경로 F — left 손 source240_orange(정책 물체 source240_real). 정책 · 값 · 흐름은 grasp_f_left 와 같다.
episode: {name: grasp_f_source240_orange_left, version: 1}
objects:
  CUP: {topic: /objects/source240_orange/pose}
policies:
  rh_aglt_l: {policy: rh56f1/aglt/left_approach_ap05, kind: aglt, side: left, approach_grasp: {handoff: 1}, handoff: rh56f1/aglt/left_rcg04, cup_obs_offset_base_m: [0.0028, 0.0283, 0.0046]}   # 11.07 cocktail_1c_e4000 rh_aglt_l 과 같은 값(11.04 L2 측정)
trajectories:
  go_home: {kind: rehome, sides: [left]}
failure_policy: {default: 0}  # 실패 시 자동 복구 없음. 운영자가 rehome으로 복구한다.
sequence:
  - {id: go_home_start, type: trajectory, name: go_home, expect: {pose: HOME}, checkpoint: HOME_START}
  - {id: scene, type: snapshot}
  - {id: grasp_lift, type: policy, name: rh_aglt_l, target_object: CUP, policy_object: source240_real, expect: {left_hand: CUP}}
  - {id: done, type: terminal, result: SUCCESS}
