# 경로 S — right 손 source240(파란 병, FP++ source240_blue). ★11.10 사용자 "학생 잡기 정책을 1105mA로 교체": 목표 마스크 학생 A 1105m(깊이 + 목표/이웃 마스크, arch v3, it4400)가
#   홈에서 접근 · 잡기를 한 정책으로 한다(이전 1104e 깊이 + RGB). 묶음 student.yaml: mask.target_class blue · rgb false.
#   ★목표 컵 하나만 탁자에 둔다(학습은 one_obj 장면 — 다른 컵이 보이면 이웃 마스크로 들어가 학습 밖 입력).
#   노드 = head_depth_node(깊이) + head_mask_node(.venv-yolo) + rh_aglt_student_node(.venv-student). FP++ 컵은 래치 · lift_hold 판정에만.
#   시작 전: python3 scripts/ops/check_student_mask_A.py
episode: {name: grasp_s_right, version: 1}
objects:
  CUP: {topic: /objects/source240_blue/pose}
policies:
  rh_aglt_r: {policy: rh56f1/aglt/right_approach_ap05, kind: aglt, side: right, student: rh56f1/aglt/right_student1105mA}
trajectories:
  go_home: {kind: rehome, sides: [right]}
failure_policy: {default: 0}  # 실패 시 자동 복구 없음. 운영자가 rehome으로 복구한다.
sequence:
  - {id: go_home_start, type: trajectory, name: go_home, expect: {pose: HOME}, checkpoint: HOME_START}
  - {id: scene, type: snapshot}
  - {id: grasp_lift, type: policy, name: rh_aglt_r, target_object: CUP, policy_object: source240_real, expect: {right_hand: CUP}}
  - {id: done, type: terminal, result: SUCCESS}
