# 경로 C(10.17 사용자 승인, docs/PLAN_GRASP_TILT_EVAL_2026-10-17.md) — left 손 shaker_c(주황, FP++ shaker_c_orange).
# 접근 정책(approach_l = rg3wc ep800 원본 — 10.19 사용자 결정, 손을 편 채 다가감. 10.18 의 rg3wg ep300 은 left_approach_rg3wg 로 남음) → 손바닥–컵 ≤ 6 cm · 팔 정지 0.5 s(또는 15 s)에 정책을 끈다 → 엄지 회전 고정,
# 엄지 굽힘(0.3 s 늦게) · 네 손가락을 0.6 rad/s 로 닫는다. ★10.18 강제 파지(judge=0, 사용자): 막힌(접촉) 축은 그 순간 실측에 고정, 안 닿은 축은
# 지령이 실측을 0.08 rad 넘게 앞서지 않는다(과전류 방지) → 모든 축이 막히거나 쥔 자세면 0.5 s 뒤(늦어도 4 s) 쥠 판정 없이 손바닥 방향 고정 10 cm 들기 → 3 s 유지 = 성공.
# 들기 높이 미달만 실패(abort, pd 가 그 자세로 붙듦 — 복구는 rehome). 옛 래치 판정은 approach_grasp: {judge: 1}, 미끄러지면 {pin_lead_rad: 0.03}.
# rg3wo(경로 A)가 쪽당 4/5 미만일 때 쓴다(결정 5). 값 조정: policies.rh_aglt_l.approach_grasp 에 키: 값(approach_grasp.ApproachGraspCfg).
# 물체 바꾸기: 실행기 파라미터 -p policy_object:=<source240_real|source200_real|shaker_c_real> -p cup_object:=<FP++ 물체 이름>.
# ★10.20 사용자 "1-c : ap05+grasp(가능성 있음)" — 접근 정책을 ap05(홈 출발, 사전 파지 자리 = 컵 축 2.5R · 높이 0 에서 멈춤)로 바꾼다.
#   ap05 는 손바닥–컵 6 cm 에 못 닿으므로 끝 = 사전 파지 자리 2 cm 안 · 팔 정지 0.5 s(approach_grasp stop_ready: 1), 15 s 안에 못 오면
#   실패(허공에서 닫지 않음). 그 뒤 스크립트 닫기 · 들기 · 유지는 아래 그대로. 손가락이 컵에 못 닿으면 '들어가기' 단계를 더한다(미구현).
episode: {name: grasp_c_left, version: 2}
objects:
  CUP: {topic: /objects/shaker_c_orange/pose}
policies:
  rh_aglt_l: {policy: rh56f1/aglt/left_approach_ap05, kind: aglt, side: left, approach_grasp: {stop_ready: 1}}
trajectories:
  go_home: {kind: rehome, sides: [left]}
failure_policy: {default: 0}  # 실패 시 자동 복구 없음. 운영자가 rehome으로 복구한다.
sequence:
  - {id: go_home_start, type: trajectory, name: go_home, expect: {pose: HOME}, checkpoint: HOME_START}
  - {id: scene, type: snapshot}
  - {id: grasp_lift, type: policy, name: rh_aglt_l, target_object: CUP, policy_object: shaker_c_real, expect: {left_hand: CUP}}
  - {id: done, type: terminal, result: SUCCESS}
