# 이 파일은 scripts/ops/make_rh56f1_missions.py 가 grasp_f_right.yaml 에서 물체만 바꿔 만든다 — 손으로 고치지 말 것(--check).
# 경로 F — right 손 source200_orange(정책 물체 source200_real). 정책 · 값 · 흐름은 grasp_f_right 와 같다.
episode: {name: grasp_f_source200_orange_right, version: 1}
objects:
  CUP: {topic: /objects/source200_orange/pose}
policies:
  rh_aglt_r: {policy: rh56f1/aglt/right_approach_ap05, kind: aglt, side: right, approach_grasp: {handoff: 1}, handoff: rh56f1/aglt/right_rcg04, cup_obs_offset_base_m: [-0.0136, 0.0085, 0.0]}   # ★11.11 j3 영점(+5.2°) 뒤 칵테일(55c733c)과 같은 값. 이전 [-0.0116, 0.0338, 0.0](영점 전 값 — 영점 몫 y 25 mm 를 두 번 빼 컵 옆을 잡음)   # 11.07 cocktail_1c_e4000 rh_aglt_r 과 같은 값(11.04 Rm 측정)
trajectories:
  go_home: {kind: rehome, sides: [right]}
failure_policy: {default: 0}  # 실패 시 자동 복구 없음. 운영자가 rehome으로 복구한다.
sequence:
  - {id: go_home_start, type: trajectory, name: go_home, expect: {pose: HOME}, checkpoint: HOME_START}
  - {id: scene, type: snapshot}
  - {id: grasp_lift, type: policy, name: rh_aglt_r, target_object: CUP, policy_object: source200_real, expect: {right_hand: CUP}}
  - {id: done, type: terminal, result: SUCCESS}
