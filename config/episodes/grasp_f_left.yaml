# 경로 F — left 손 shaker(주황, FP++ shaker_c_orange). ap05 → rcg04 두 정책을 한 노드에서 끊지 않고 잇는다.
# ★10.21 사용자 "ap05 + rcg_04 또한 준비 필요" — 경로 E(grasp_e_<팔>, ap05 → rcg03)와 같은 넘김 기구 · 같은 컵 · 같은 값,
#   넘겨받는 정책만 rcg04(rcg_04_nl, rcg03 이어 학습 · 보상 iter_04 · 계약은 체크포인트 · 해시만 다름).
#   근거: newton sim 결정론 격자(1020_rcg04_grid, Newton · 450 회) ap05 출발 성공 오른손 98.9 % · 왼손 98.0 %
#   (스크립트 출발 87.3 · 88.4 %). 오른손은 성공 중 5지 유지 51 %(rcg03 86 %).
# 흐름 · 실패 · 값 조정 · 물체 바꾸기는 grasp_e_left.yaml 머리말과 같다. 경로 E 는 그대로 둔다.
episode: {name: grasp_f_left, version: 1}
objects:
  CUP: {topic: /objects/shaker_c_orange/pose}
policies:
  rh_aglt_l: {policy: rh56f1/aglt/left_approach_ap05, kind: aglt, side: left, approach_grasp: {handoff: 1}, handoff: rh56f1/aglt/left_rcg04}
trajectories:
  go_home: {kind: rehome, sides: [left]}
failure_policy: {default: 0}  # 실패 시 자동 복구 없음. 운영자가 rehome으로 복구한다.
sequence:
  - {id: go_home_start, type: trajectory, name: go_home, expect: {pose: HOME}, checkpoint: HOME_START}
  - {id: scene, type: snapshot}
  - {id: grasp_lift, type: policy, name: rh_aglt_l, target_object: CUP, policy_object: shaker_c_real, expect: {left_hand: CUP}}
  - {id: done, type: terminal, result: SUCCESS}
