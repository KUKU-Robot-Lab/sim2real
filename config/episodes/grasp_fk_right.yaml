# 경로 F — right 손 source240 분홍 병(FP++ source240p_pink). grasp_f_right 와 같은 정책 · 같은 값, 물체만 바꿨다(11.08 사용자 "핑크랑 주황도 바로").
# rcg04 · ap05 는 물체 one-hot 3종(source240_real · source200_real · shaker_c_real)을 학습했다.
episode: {name: grasp_fk_right, version: 1}
objects:
  CUP: {topic: /objects/source240p_pink/pose}
policies:
  rh_aglt_r: {policy: rh56f1/aglt/right_approach_ap05, kind: aglt, side: right, approach_grasp: {handoff: 1}, handoff: rh56f1/aglt/right_rcg04, cup_obs_offset_base_m: [-0.0116, 0.0338, -0.0143]}   # 11.07 cocktail_1c_e4000 rh_aglt_r 과 같은 값(11.04 Rm 측정)
trajectories:
  go_home: {kind: rehome, sides: [right]}
failure_policy: {default: 0}  # 실패 시 자동 복구 없음. 운영자가 rehome으로 복구한다.
sequence:
  - {id: go_home_start, type: trajectory, name: go_home, expect: {pose: HOME}, checkpoint: HOME_START}
  - {id: scene, type: snapshot}
  - {id: grasp_lift, type: policy, name: rh_aglt_r, target_object: CUP, policy_object: source240_real, expect: {right_hand: CUP}}
  - {id: done, type: terminal, result: SUCCESS}
