# 왼손 shaker_c(주황, FP++ shaker_c_orange) 파지 → 들기 — rg3 한 정책(10.12 grasping 최종) 실기 첫 시험. 사용자 10.12: 잡고 들어 SETTING 에 닿으면 팔을 멈추고 끝낸다(놓기 · 홈 복귀 없음).
# 물체 바꾸기: 실행기 파라미터 -p policy_object:=<source240_real|source200_real|shaker_c_real> -p cup_object:=<FP++ 물체 이름> (둘이 같은 물체여야 한다).
# 실행: 상황판 미션 단계 episode_grasp_rg3_left · CLI tools/episode_run.py --episode config/episodes/grasp_rg3_left.yaml
episode: {name: grasp_rg3_left, version: 1}
# SETTING = aglt 고정 목표(base m). rg3 계약 목표 박스 안이다 — 컵 원점이 이 점에 닿으면 정책 노드(stop_on_target)가 끝낸다
setting: {left: [0.25, 0.12, 0.41]}
objects:
  CUP: {topic: /objects/shaker_c_orange/pose}
policies:
  rh_aglt_l: {policy: rh56f1/aglt/left_rg3s, kind: aglt, side: left}
trajectories:
  go_home: {kind: rehome, sides: [left]}
failure_policy: {default: 1}
sequence:
  - {id: go_home_start, type: trajectory, name: go_home, expect: {pose: HOME}, checkpoint: HOME_START}
  - {id: scene, type: snapshot}
  - {id: grasp_lift, type: policy, name: rh_aglt_l, target_object: CUP, policy_object: shaker_c_real, expect: {pose: SETTING, left_hand: CUP}}
  - {id: done, type: terminal, result: SUCCESS}
