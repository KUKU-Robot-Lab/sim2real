    - --out
    - '{runs}/cpu/episode_pick_place_right.csv'
    background: true
  - note: 에피소드 실행기 episode_runner_right — pick_place_right · 승인은 상황판(노드마다 이름 · 연속 실행은 episode:pick_place_right)
