- id: check
  title: 점검
- id: connect
  title: 연결
- id: prepare
  title: 준비
- id: motion
  title: 자세 이동
  motion: true
- id: policy
  title: 정책 동작
  motion: true
- id: finish
  title: 정리
- id: recognize
  title: 개별 인지 (선택)
  optional: true
- id: diagnose
  title: 진단 (선택)
  motion: true
  optional: true
lanes:
- id: rig
  title: 드라이버
- id: arm_right
  title: 오른팔 · 오른손
  side: right
  focus: policy_aglt_right
- id: arm_left
