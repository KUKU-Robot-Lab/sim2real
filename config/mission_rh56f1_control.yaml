# RH56F1 로봇(arm4090) 실기 미션 — scripts/ops/make_rh56f1_missions.py 가 만든다. 손으로 고치지 말 것(--check 가 잡는다).
name: RH56F1 양팔 실기 손 연결 · pd 점검
artifacts:
  contract: logs/policy/asset_openarm_rh56f1_bi_rl/deploy_contract.json
  robot_right: deploy/policy_control/config/robots/rh56f1_right_real.yaml
  robot_left: deploy/policy_control/config/robots/rh56f1_left_real.yaml
  pd: deploy/policy_control/config/pd_rh56f1.yaml
  pd_exec: deploy/policy_control/config/pd_rh56f1_exec.yaml
  rh56f1_map: deploy/policy_control/config/rh56f1_hand_map.yaml
  pourfj_both: deploy/policies/both_rh_pourfj_f01/pour_fj_contract.json
  robot_bi: deploy/policy_control/config/robots/rh56f1_bi_real.yaml
  rh56f1_ports: deploy/policy_control/config/rh56f1_ports.yaml
checkpoints: {}
groups:
- id: check
  title: 점검
- id: connect
  title: 연결
- id: prepare
  title: 준비
- id: motion
  title: 자세 이동
  motion: true
- id: policy
  title: 정책 동작
  motion: true
- id: finish
  title: 정리
- id: diagnose
  title: 진단 (선택)
  motion: true
  optional: true
lanes:
- id: rig
  title: 드라이버
- id: arm_right
  title: 오른팔 · 오른손
  side: right
- id: arm_left
  title: 왼팔 · 왼손
  side: left
- id: both
  title: 양팔 · 컵 · 정책
  focus: policy_pourfj
stages:
- id: preflight
  group: check
  lane: rig
  title: 테스트 · RH56F1 제어 전용 계약 재생성(양팔 pour_fj 홈 · 편 손) (읽기 전용)
  artifacts:
  - rh56f1_map
- id: cups
  group: connect
  lane: both
  needs:
  - preflight
  skippable: true
  title: 두 컵 자세 — 붓는 컵 /objects/cup_src/pose · 받는 컵 /objects/cup_rcv/pose (base)
  blocked: arm4090 인지(카메라 · FP++ 두 물체) 연결 전 — 컵 두 개의 자세를 /objects/cup_src · cup_rcv 로 내는 단계가 없다
- id: drivers
  group: connect
  lane: rig
  needs:
  - preflight
  title: 모터 전원 → CAN ×2 → 팔 브링업 → CAN 응답 확인 (토크는 들어가지만 팔은 제자리)
  needs_why: 점검 전에 띄우면 오배선 상태로 모터가 돈다
  touches_real: true
- id: hand_right
  group: connect
  lane: arm_right
  needs:
  - preflight
  skippable: true
  touches_real: true
  artifacts:
  - rh56f1_map
  - rh56f1_ports
  title: '[right] RH56F1 손 드라이버(포트 설정 rh56f1_ports.yaml · RS485 / CANFD) + 상태 노드(0.1° → rad)'
- id: hand_check_right
  group: prepare
  lane: arm_right
  needs:
  - hand_right
  skippable: true
  title: '[right] 손 점검 — 주기 · 슬롯 이름 · 레지스터 → rad · 한계 (읽기 전용)'
- id: probe_right
  group: diagnose
  lane: arm_right
  needs:
  - hand_check_right
  skippable: true
  touches_real: true
  artifacts:
  - rh56f1_map
  title: '[right] 한 축씩 방향 확인 — 한 손가락만 작게 움직였다 되돌린다(엄지 두 축은 변환표 verified 전)'
- id: pd_load_right
  group: prepare
  lane: arm_right
  needs:
  - drivers
  - hand_check_right
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - robot_right
  - pd
  needs_why: pd 는 팔(브링업)과 그 팔의 손 상태가 둘 다 있어야 입력이 들어온다
  title: '[right] pd 무발행 기동 (execute:=false) — 게인 · 입력 신선도 확인'
- id: pd_arm_right
  group: prepare
  lane: arm_right
  needs:
  - pd_load_right
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - robot_right
  - pd_exec
  needs_why: 무발행 상태에서 게인 · 입력이 맞는지 본 뒤에만 발행 권한을 준다
  title: '[right] pd 발행 모드 전환 — engage 는 하지 않는다(팔은 JTC 가 잡는다)'
- id: home_right
  group: motion
  lane: arm_right
  needs:
  - pd_arm_right
  skippable: true
  touches_real: true
  artifacts:
  - contract
  title: '[right] engage → pour_fj 시작 자세(홈) — 손은 편 손'
  blocked: RH56F1 홈 경로 계획 전 — plan_home_path 를 RH56F1 손 기하로 돌려 저장 경로를 만든 뒤(검사 없는 goto_home 직선으로 차렷에서 홈까지 가지 않는다)
- id: release_right
  group: finish
  lane: arm_right
  needs:
  - pd_arm_right
  skippable: true
  touches_real: true
  undoes:
  - pd_arm_right
  - home_right
  title: '[right] pd 해제(역블렌드 → JTC) → 이 팔의 pd 정지'
- id: hand_left
  group: connect
  lane: arm_left
  needs:
  - preflight
  skippable: true
  touches_real: true
  artifacts:
  - rh56f1_map
  - rh56f1_ports
  title: '[left] RH56F1 손 드라이버(포트 설정 rh56f1_ports.yaml · RS485 / CANFD) + 상태 노드(0.1° → rad)'
- id: hand_check_left
  group: prepare
  lane: arm_left
  needs:
  - hand_left
  skippable: true
  title: '[left] 손 점검 — 주기 · 슬롯 이름 · 레지스터 → rad · 한계 (읽기 전용)'
- id: probe_left
  group: diagnose
  lane: arm_left
  needs:
  - hand_check_left
  skippable: true
  touches_real: true
  artifacts:
  - rh56f1_map
  title: '[left] 한 축씩 방향 확인 — 한 손가락만 작게 움직였다 되돌린다(엄지 두 축은 변환표 verified 전)'
- id: pd_load_left
  group: prepare
  lane: arm_left
  needs:
  - drivers
  - hand_check_left
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - robot_left
  - pd
  needs_why: pd 는 팔(브링업)과 그 팔의 손 상태가 둘 다 있어야 입력이 들어온다
  title: '[left] pd 무발행 기동 (execute:=false) — 게인 · 입력 신선도 확인'
- id: pd_arm_left
  group: prepare
  lane: arm_left
  needs:
  - pd_load_left
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - robot_left
  - pd_exec
  needs_why: 무발행 상태에서 게인 · 입력이 맞는지 본 뒤에만 발행 권한을 준다
  title: '[left] pd 발행 모드 전환 — engage 는 하지 않는다(팔은 JTC 가 잡는다)'
- id: home_left
  group: motion
  lane: arm_left
  needs:
  - pd_arm_left
  skippable: true
  touches_real: true
  artifacts:
  - contract
  title: '[left] engage → pour_fj 시작 자세(홈) — 손은 편 손'
  blocked: RH56F1 홈 경로 계획 전 — plan_home_path 를 RH56F1 손 기하로 돌려 저장 경로를 만든 뒤(검사 없는 goto_home 직선으로 차렷에서 홈까지 가지 않는다)
- id: release_left
  group: finish
  lane: arm_left
  needs:
  - pd_arm_left
  skippable: true
  touches_real: true
  undoes:
  - pd_arm_left
  - home_left
  title: '[left] pd 해제(역블렌드 → JTC) → 이 팔의 pd 정지'
- id: policy_pourfj
  group: policy
  lane: both
  skippable: true
  touches_real: true
  needs:
  - home_right
  - home_left
  - cups
  - hand_check_right
  - hand_check_left
  needs_why: 정책은 양팔이 pour_fj 시작 자세 · 손이 편 채 · 두 컵이 선 채로만 출발해 봤다
  artifacts:
  - pourfj_both
  - robot_bi
  - contract
  title: '[양팔] pour_fj 정책(첫 화면에서 고른 것) — 정책 노드 → reset → start → 관찰 → stop (시간이 되면 스스로 끝난다)'
- id: shutdown
  group: finish
  lane: rig
  needs:
  - drivers
  touches_real: true
  title: 안전 종료 — 팔 받침 확인 → 남은 pd → 손 상태 · 드라이버 → 팔 브링업 (★팔 토크가 풀린다)
run:
  preflight:
  - note: RH56F1 변환표 · 백엔드 · 상태 노드 · 계약 · 미션 테스트(수 초)
    argv:
    - python3
    - -m
    - pytest
    - -q
    - -m
    - not gpu
    - -p
    - no:cacheprovider
    - '{repo}/tests/policy_control/test_pc_rh56f1.py'
    - '{repo}/tests/s2r_console/test_rh56f1_mission.py'
  - note: 제어 전용 계약 재생성 — 자산 openarm_rh56f1_bi_rl, 홈 = hdgp pour_fj 리셋 홈(양팔, config/homes), 손 = 편 손
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/build_deploy_contract.py'
    - --asset
    - openarm_rh56f1_bi_rl
    - --home
    - arms:config/homes/rh56f1_pour_fj.yaml
    - --out
    - '{artifact:contract}'
  drivers:
  - note: ★모터 전원(양팔) ON — 물리 스위치
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: ★CAN 설정(우 can0) — sudo, 운영자 셸에서. arm4090 의 CAN 이름이 다르면 그 이름으로
    argv:
    - bash
    - -lc
    - sudo ip link set can0 down && sudo ip link set can0 type can bitrate 1000000 dbitrate 5000000 fd on && sudo ip link set can0 up
    manual: true
  - note: ★CAN 설정(좌 can1)
    argv:
    - bash
    - -lc
    - sudo ip link set can1 down && sudo ip link set can1 type can bitrate 1000000 dbitrate 5000000 fd on && sudo ip link set can1 up
    manual: true
  - note: 팔 브링업(robot_control) — 콘솔이 띄우고 감독한다
    argv:
    - ros2
    - launch
    - openarm_bringup
    - openarm.bimanual.launch.py
    - use_fake_hardware:=false
    - right_can_interface:=can0
    - left_can_interface:=can1
    - use_rviz:=false
    background: true
  - note: ★모터 응답 확인 — can0 · can1 수신 패킷이 늘어나는가
    argv:
    - python3
    - '{repo}/scripts/setup/check_can_rx.py'
    - can0
    - can1
  shutdown:
  - note: ★양팔을 받침 위 · 안전 자세에 두었는가. 두 팔 모두 pd 해제를 끝냈는가. 다음 스텝부터 토크가 풀린다
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: 남은 정책 노드 · pd 정지
    stop:
    - policy_pourfj#1
    - pd_load_right#0
    - pd_arm_right#1
    - pd_load_left#0
    - pd_arm_left#1
  - note: 손 상태 노드 · 손 드라이버 정지 — 손가락은 마지막 자세에서 멈춘다(벤더 펌웨어가 잡는다)
    stop:
    - hand_right#2
    - hand_right#1
    - hand_left#2
    - hand_left#1
  - note: ★팔 브링업 정지 — 모든 팔 모터가 꺼진다(받침으로 내려앉는다)
    stop:
    - drivers#3
  cups: []
  policy_pourfj:
  - note: ★두 컵이 학습 배치(로봇 앞 x ≈ 0.38, y ≈ ∓0.16)에 서 있고 콘솔에 두 컵 자세가 들어오는가. 양팔 · 양손 주변이 비어 있는가. 정책은 팔을 스스로 움직이고 손가락을 쥔다 — 빈 컵만
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: 양팔 정책 노드(pour_fj_node, LSTM · CPU) — start 전에는 아무것도 보내지 않는다. 처음 30 스텝은 팔을 시작 자세에 둔다(학습 hold)
    argv:
    - '{repo}/.venv/bin/python'
    - '{repo}/deploy/policy_control/policy_control/pour_fj_node.py'
    - --ros-args
    - -p
    - contract:={artifact:pourfj_both}
    - -p
    - robot:={artifact:robot_bi}
    - -p
    - device:=cpu
    - -p
    - max_episode_s:={policy:pourfj_both.max_episode_s}
    background: true
  - note: episode reset — 두 컵 · 양팔 측정이 모두 있어야 받는다
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/trigger.py'
    - episode/reset
    execute_args:
    - --execute
  - note: ★episode start — 양팔이 시작 자세 0.15 rad 안 · 두 컵이 서 있어야 받는다
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/trigger.py'
    - episode/start
    execute_args:
    - --execute
  - note: ★관찰 — 이상하면 정지 바의 '에피소드 정지'
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: episode stop — pd 가 그 자세 · 손 쥠을 붙잡는다
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/trigger.py'
    - episode/stop
    execute_args:
    - --execute
  - note: 정책 노드 정지
    stop:
    - policy_pourfj#1
  hand_right:
  - note: ★[right] 손 포트 확인 — ls -l /dev/serial/by-id · 설정 deploy/policy_control/config/rh56f1_ports.yaml (transport rs485 | canfd · port · hand_id).
      손 전원이 켜져 있는가. 드라이버는 시작할 때 쓰기를 하지 않는다
    argv:
    - bash
    - -lc
    - ls -l /dev/serial/by-id 2>/dev/null; cat {repo}/deploy/policy_control/config/rh56f1_ports.yaml
    manual: true
  - note: '[right] RH56F1 드라이버 — 읽기만 도는 벤더 노드(명령 토픽이 오기 전에는 쓰지 않는다)'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_driver.py'
    - --side
    - right
    background: true
  - note: '[right] 상태 노드 — /hand_right/angle_actual(0.1°) → /hand_right/joint_states(rad) · 촉각 → tip_forces'
    argv:
    - python3
    - '{repo}/deploy/policy_control/policy_control/rh56f1_state_node.py'
    - --side
    - right
    - --map
    - '{artifact:rh56f1_map}'
    background: true
  hand_check_right:
  - note: '[right] 손 점검(읽기만) — 드라이버 주기 ≥ 20 Hz · 슬롯 이름 · 변환 · 한계'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_hand_check.py'
    - --side
    - right
    - --map
    - '{artifact:rh56f1_map}'
  probe_right:
  - note: ★[right] 손 주변이 비어 있는가 — 한 손가락씩 작게(최대 0.5 rad) 움직였다 되돌린다. 어느 손가락이 어느 쪽으로 움직이는지 눈으로 본다
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] index_1 0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - index_1
    - --by
    - '0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] index_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] middle_1 0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - middle_1
    - --by
    - '0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] middle_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] ring_1 0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - ring_1
    - --by
    - '0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] ring_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] pinky_1 0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - pinky_1
    - --by
    - '0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] pinky_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] thumb_2 0.15 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - thumb_2
    - --by
    - '0.15'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] thumb_2 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] thumb_1 -0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - thumb_1
    - --by
    - '-0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] thumb_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  pd_load_right:
  - note: '[right] pd 무발행 기동 — status 의 입력 신선도를 본다'
    argv:
    - ros2
    - launch
    - '{repo}/deploy/policy_control/launch/pd_controller.launch.py'
    - contract:={artifact:contract}
