  - rh56f1_map
- id: head_home
  group: motion
  lane: rig
  needs:
  - preflight
  skippable: true
  touches_real: true
  title: 머리를 카메라 캘리브 자세(외부 파라미터 head_pose)로 + I 게인 — 카메라 좌표가 이 자세에서만 맞다(머리가 조금 움직인다)
  arm_free: true
- id: head_view_check
  group: check
  lane: rig
  needs:
  - head_home
  skippable: true
  title: 시야 검사(읽기 전용, arm4090-lan) — D435i IMU 숙임 − 외부 파라미터 숙임이 허용치 (config/head_view_feedback_arm4090.yaml view_check_tol_deg) 안인가. 머리는 움직이지
    않는다. yaw 는 못 잰다
  arm_free: true
- id: head_control
  group: motion
  lane: rig
  skippable: true
  touches_real: true
  title: 목 pan · tilt 변경 — 승인한 보정 프로필과 자세로 이동 후 실측 정착 확인
  arm_free: true
- id: head_sweep
  group: motion
  lane: rig
  skippable: true
  touches_real: true
  title: 목 스윕 기록 — 손은 그대로, 목만 보정 각도를 돌며 bag(arm · hand · pd · camera) → 처음 자세로 복귀
- id: cups
  group: connect
  lane: both
  needs:
  - head_view_check
  skippable: true
  touches_real: true
  needs_why: FP++ base 좌표는 외부 파라미터를 잰 시야에서만 맞다 — 머리 틱(head_home)에 더해 카메라 숙임(IMU)이 같은지 먼저 본다
  title: FP++ 드라이버(arm4090-lan) — 인지 런처 · 자세 수신기 · base 변환 노드 · 머리 자세 맞춤. 물체는 띄우지 않는다(setting 탭 '인지 적용' 또는 에피소드가 자기 물체를 띄운다)
  arm_free: true
- id: cup_holders
  group: connect
  lane: both
  needs:
  - head_home
  skippable: true
  touches_real: true
  title: 홀더 자리 다시 재기(홀더를 옮겼을 때만) — 마커 ID 0·1·2 → config/cup_holder_poses_5090_v1.yaml 갱신 · /objects/cup_holder_{0,1,2}/pose (base). 홀더는 고정이라 에피소드는
    이 단계를 기다리지 않고 저장된 파일을 쓴다. 로봇은 움직이지 않는다. CPU 만
  arm_free: true
