# RH56F1 로봇(arm4090) 실기 미션 — scripts/ops/make_rh56f1_missions.py 가 만든다. 손으로 고치지 말 것(--check 가 잡는다).
name: RH56F1 양팔 실기 손 연결 · pd 점검
artifacts:
  contract: logs/policy/asset_openarm_rh56f1_bi_rl/deploy_contract.json
  robot_right: deploy/policy_control/config/robots/rh56f1_right_real.yaml
  robot_left: deploy/policy_control/config/robots/rh56f1_left_real.yaml
  pd: deploy/policy_control/config/pd_rh56f1.yaml
  pd_exec: deploy/policy_control/config/pd_rh56f1_exec.yaml
  rh56f1_map: deploy/policy_control/config/rh56f1_hand_map.yaml
  path_right: deploy/policy_control/paths/home_rh56f1_right.npz
  path_left: deploy/policy_control/paths/home_rh56f1_left.npz
  pourfj_both: deploy/policies/both_rh_pourfj_f01/pour_fj_contract.json
  robot_bi: deploy/policy_control/config/robots/rh56f1_bi_real.yaml
  aglt_right: deploy/policies/right_rh_aglt_cyl60g/rh_aglt_contract.json
  aglt_left: deploy/policies/left_rh_aglt_cyl60gmir/rh_aglt_contract.json
  place_right: deploy/policies/right_rh_place_i09/rh_place_contract.json
  place_left: deploy/policies/left_rh_place_i01/rh_place_contract.json
  rh56f1_ports: deploy/policy_control/config/rh56f1_ports.yaml
checkpoints: {}
groups:
- id: check
  title: 점검
- id: connect
  title: 연결
- id: prepare
  title: 준비
- id: motion
  title: 자세 이동
  motion: true
- id: policy
  title: 정책 동작
  motion: true
- id: finish
  title: 정리
- id: diagnose
  title: 진단 (선택)
  motion: true
  optional: true
lanes:
- id: rig
  title: 드라이버
- id: arm_right
  title: 오른팔 · 오른손
  side: right
  focus: policy_aglt_right
- id: arm_left
  title: 왼팔 · 왼손
  side: left
  focus: policy_aglt_left
- id: both
  title: 양팔 · 컵 · 정책
  focus: policy_pourfj
stages:
- id: preflight
  group: check
  lane: rig
  title: 테스트 · RH56F1 제어 전용 계약 재생성(양팔 pour_fj 홈 · 편 손) (읽기 전용)
  artifacts:
  - rh56f1_map
- id: head_home
  group: motion
  lane: rig
  needs:
  - preflight
  skippable: true
  touches_real: true
  title: 머리를 카메라 캘리브 자세(외부 파라미터 head_pose)로 + I 게인 — 카메라 좌표가 이 자세에서만 맞다(머리가 조금 움직인다)
- id: cups
  group: connect
  lane: both
  needs:
  - head_home
  skippable: true
  touches_real: true
  title: 컵 자세(arm4090 FP++) — RealSense · FP++ 컨테이너(cyl60) → /objects/cyl60/pose (base). GPU VRAM 수 GB
- id: cup_holders
  group: connect
  lane: both
  needs:
  - head_home
  skippable: true
  touches_real: true
  title: 컵홀더 자세(마커 ID 0·1·2) — RealSense 컬러 → /objects/cup_holder_{0,1,2}/pose (base) · /cup_holders/status. 로봇은 움직이지 않는다. CPU 만
- id: drivers
  group: connect
  lane: rig
  needs:
  - preflight
  title: 모터 전원 → CAN ×2 → 팔 브링업 → CAN 응답 확인 (토크는 들어가지만 팔은 제자리)
  needs_why: 점검 전에 띄우면 오배선 상태로 모터가 돈다
  touches_real: true
- id: hand_right
  group: connect
  lane: arm_right
  needs:
  - preflight
  skippable: true
  touches_real: true
  artifacts:
  - rh56f1_map
  - rh56f1_ports
  title: '[right] RH56F1 손 드라이버(포트 설정 rh56f1_ports.yaml · RS485 / CANFD) + 상태 노드(0.1° → rad)'
- id: hand_check_right
  group: prepare
  lane: arm_right
  needs:
  - hand_right
  skippable: true
  title: '[right] 손 점검 — 주기 · 슬롯 이름 · 레지스터 → rad · 한계 (읽기 전용)'
- id: probe_right
  group: diagnose
  lane: arm_right
  needs:
  - hand_check_right
  skippable: true
  touches_real: true
  artifacts:
  - rh56f1_map
  title: '[right] 한 축씩 방향 확인 — 한 손가락만 작게 움직였다 되돌린다(엄지 두 축은 변환표 verified 전)'
- id: pd_load_right
  group: prepare
  lane: arm_right
  needs:
  - drivers
  - hand_check_right
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - robot_right
  - pd
  needs_why: pd 는 팔(브링업)과 그 팔의 손 상태가 둘 다 있어야 입력이 들어온다
  title: '[right] pd 무발행 기동 (execute:=false) — 게인 · 입력 신선도 확인'
- id: pd_arm_right
  group: prepare
  lane: arm_right
  needs:
  - pd_load_right
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - robot_right
  - pd_exec
  needs_why: 무발행 상태에서 게인 · 입력이 맞는지 본 뒤에만 발행 권한을 준다
  title: '[right] pd 발행 모드 전환 — engage 는 하지 않는다(팔은 JTC 가 잡는다)'
- id: home_right
  group: motion
  lane: arm_right
  needs:
  - pd_arm_right
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - path_right
  title: '[right] (한 번 승인) engage → 차렷 손(주먹) → 저장 경로로 차렷 → 홈(rh_aglt 시작 자세) → 정착 → 손 초기 자세'
- id: return_right
  group: finish
  lane: arm_right
  needs:
  - home_right
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - path_right
  undoes:
  - home_right
  title: '[right] 홈 → 차렷 — 홈 정착 → 차렷 손(주먹) → 저장 경로 역재생 → pd 해제(한 번 승인, 홈 근처에서만)'
- id: release_right
  group: finish
  lane: arm_right
  needs:
  - pd_arm_right
  skippable: true
  touches_real: true
  undoes:
  - pd_arm_right
  - home_right
  title: '[right] pd 해제(역블렌드 → JTC) → 이 팔의 pd 정지'
- id: hand_left
  group: connect
  lane: arm_left
  needs:
  - preflight
  skippable: true
  touches_real: true
  artifacts:
  - rh56f1_map
  - rh56f1_ports
  title: '[left] RH56F1 손 드라이버(포트 설정 rh56f1_ports.yaml · RS485 / CANFD) + 상태 노드(0.1° → rad)'
- id: hand_check_left
  group: prepare
  lane: arm_left
  needs:
  - hand_left
  skippable: true
  title: '[left] 손 점검 — 주기 · 슬롯 이름 · 레지스터 → rad · 한계 (읽기 전용)'
- id: probe_left
  group: diagnose
  lane: arm_left
  needs:
  - hand_check_left
  skippable: true
  touches_real: true
  artifacts:
  - rh56f1_map
  title: '[left] 한 축씩 방향 확인 — 한 손가락만 작게 움직였다 되돌린다(엄지 두 축은 변환표 verified 전)'
- id: pd_load_left
  group: prepare
  lane: arm_left
  needs:
  - drivers
  - hand_check_left
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - robot_left
  - pd
  needs_why: pd 는 팔(브링업)과 그 팔의 손 상태가 둘 다 있어야 입력이 들어온다
  title: '[left] pd 무발행 기동 (execute:=false) — 게인 · 입력 신선도 확인'
- id: pd_arm_left
  group: prepare
  lane: arm_left
  needs:
  - pd_load_left
  skippable: true
  touches_real: true
  artifacts:
  - contract
  - robot_left
  - pd_exec
  needs_why: 무발행 상태에서 게인 · 입력이 맞는지 본 뒤에만 발행 권한을 준다
  title: '[left] pd 발행 모드 전환 — engage 는 하지 않는다(팔은 JTC 가 잡는다)'
- id: home_left
  group: motion
  lane: arm_left
  needs:
  - pd_arm_left
  skippable: true
  touches_real: true
  artifacts:
