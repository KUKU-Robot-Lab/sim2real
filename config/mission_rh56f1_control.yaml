  - note: ★[left] 경로 주변(로봇 옆 · 테이블 앞 가장자리 · 몸통)이 비어 있는가. 약 15 s 동안 최대 0.3 rad/s 로 움직인다 — engage → 차렷 손(주먹) → 경로 재생 → 홈 정착 → 손을 홈 손 자세로, 끊지 않고
      이어 간다
    argv:
    - bash
    - -lc
