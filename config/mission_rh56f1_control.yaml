    - --ros-args
    - -r
    - __node:=episode_runner_left
    - -p
    - episode:=config/episodes/grasp_f_source240_pink_left.yaml
    - -p
    - robot:=rh56f1
    background: true
  - note: ★에피소드 진행 — 상황판 에피소드 패널의 [다음](구분 실행) · [연속 실행]. 성공 · 정지로 끝나면 확인 (이상하면 '에피소드 실행기 정지' · 정지 바)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: 에피소드 노드들 정지
