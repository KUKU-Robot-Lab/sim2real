    - cpu
  - note: 제어 전용 계약 재생성 — 자산 openarm_rh56f1_bi_rl, 홈 = hdgp rh_aglt 시작 자세(양팔 거울, config/homes/rh56f1_aglt.yaml), 손 = 편 손. 홈이 바뀌면 저장 경로의 계약 해시가
