    - contract:={repo}/deploy/policies/rh56f1/aglt/right_cyl60g/rh_aglt_contract.json
    - -p
    - robot:={artifact:robot_right}
    - -p
    - device:=cpu
    - -p
    - stop_on_target:=true
    - -p
    - cup_topic:=/objects/source240_blue/live_pose
