  - home_left
  title: '[left] pd 해제(역블렌드 → JTC) → 이 팔의 pd 정지'
- id: policy_pourfj
  group: policy
  lane: both
  skippable: true
  touches_real: true
  blocked: 두 컵 구분 전 — 실기 인지는 컵 하나(cyl60)만 낸다. 같은 컵 둘은 FP++ 가 못 가른다(색이 다른 컵 · 자리로 가르기 중 하나가 필요)
  needs:
  - home_right
  - home_left
  - cups
  - hand_check_right
  - hand_check_left
  needs_why: 정책은 양팔이 pour_fj 시작 자세 · 손이 편 채 · 두 컵이 선 채로만 출발해 봤다. ★09.29 홈이 rh_aglt 시작 자세로 바뀌어 pour_fj 시작 자세와 다르다 — 정책 노드가 start 를 거부한다(0.15 rad).
    홈 → pour_fj 시작 경로가 필요
  artifacts:
  - pourfj_both
  - robot_bi
  - contract
  title: '[양팔] pour_fj 정책(첫 화면에서 고른 것) — 정책 노드 → reset → start → 관찰 → stop (시간이 되면 스스로 끝난다)'
- id: policy_aglt_right
  group: policy
  lane: arm_right
  skippable: true
  touches_real: true
  needs:
  - home_right
  - cups
  - hand_check_right
  needs_why: 정책은 팔이 rh_aglt 시작 자세(= 홈) · 손이 편 채 · 컵이 학습 배치에 선 채로만 출발해 봤다
  artifacts:
  - aglt_right
  - robot_right
  - contract
  title: '[right] rh_aglt 정책(첫 화면에서 고른 것) — 컵에 접근 · 쥐기 · 들기 · 목표(컵 위 14 cm, /policy_control/<팔>/goal 로 바꿀 수 있다)로 이송. 정책 노드 → reset → start → 관찰
    → stop'
- id: policy_aglt_left
