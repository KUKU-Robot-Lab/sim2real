  episode_grasp_f_source240_pink_left:
  - note: 시작 검사 — 정책이 등록부에서 쓸 수 있고 고정 홀더 자세()에 쓰는 홀더가 다 있는가 (읽기만)
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/episode_run.py'
    - --episode
    - config/episodes/grasp_f_source240_pink_left.yaml
    - --plan
    - --require-holders
  - note: 시작 검사 — 같은 이름의 정책 노드 · 실행기가 남아 있지 않은가(다른 정책 단계가 띄운 것) (읽기만)
    argv:
    - bash
    - -lc
    - '! ros2 node list 2>/dev/null | grep -E ''^/((rh_aglt_node|rh_place_node)_left|episode_runner_left)$'''
  - note: ★arm4090-lan GPU 여유가 있는가(nvidia-smi — 학습이 돌면 VRAM 이 모자랄 수 있다, 물체 컨테이너마다 약 2 GB). 없는 물체 컨테이너만 띄운다
    argv:
    - ssh
    - -o
    - BatchMode=yes
    - arm4090-lan
    - nvidia-smi --query-compute-apps=pid,used_memory --format=csv; nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader
    manual: true
  - note: FP++ 물체 확보 — source240_pink 묶음 중 없는 것만 띄운다(다른 컨테이너는 그대로). 하나라도 못 뜨면 실패. 최대 120 s
    argv:
    - python3
    - '{repo}/scripts/ops/perception_ctl.py'
    - start
    - --add
    - source240_pink
    - --wait
    - '120'
    - --require-all
  - note: '★[에피소드 grasp_f_source240_pink_left] 물체(CUP)가 학습 배치에 서 있고 FP++ 가 잡고 있는가 · 컵 자세(설정 탭 물체 좌표): 테이블 위 컵 원점 z ≈ 0.290(상판 0.205 + 원점 0.085,
      ±8 mm) · 기울기 < 3° · x 0.1~0.4 · |y| 0.1~0.3 · 오른팔 source240_blue(y < 0) · 왼팔 shaker_c_orange(y > 0) 인가(카메라를 건드렸으면 scripts/calib/table_cad_extrinsics.py
      --init config/global_camera_extrinsics_arm4090_r20u5.yaml --write --head-config config/head_camset_rh56f1.yaml). 노드를 띄운 뒤에는 상황판 에피소드 패널에서
      진행한다'
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[left] rh_aglt_l 노드(rh56f1/aglt/left_approach_ap05) — 경로 F: 접근 정책 → 사전 파지 자리(2.5 cm)에서 0.5 s 평균 0.03 m/s 이하로 멈추면 같은 노드에서 rh56f1/aglt/left_rcg04
      로 넘김 → 첫 목표(컵 + 10 cm) 성공 또는 7 cm 위 2 s 쥠 유지에 끝남 · 접근 15 s 안에 못 오면 멈춤 · 접근 중 손바닥-컵 35 cm 넘으면 바로 멈춤 · 컵 = FP++ live · 쥐면 손바닥 FK 로 손에 붙임'
    argv:
    - '{repo}/.venv/bin/python'
    - '{repo}/deploy/policy_control/policy_control/rh_aglt_node.py'
    - --ros-args
    - -r
    - __node:=rh_aglt_node_left
    - -p
    - ns:=left
    - -p
    - contract:={repo}/deploy/policies/rh56f1/aglt/left_approach_ap05/rh_aglt_contract.json
    - -p
    - robot:={artifact:robot_left}
    - -p
    - device:=cpu
    - -p
    - approach_grasp:=handoff=1
    - -p
    - handoff_contract:={repo}/deploy/policies/rh56f1/aglt/left_rcg04/rh_aglt_contract.json
    - -p
    - goal_max:=1
    - -p
    - freeze_rule:=lift_hold
    - -p
    - freeze_lift_m:=0.07
    - -p
    - freeze_hold_steps:=120
    - -p
    - cup_topic:=/objects/source240_pink/live_pose
    - -p
    - cup_static:=false
    - -p
    - cup_latch:=false
    - -p
    - cup_hold_last:=true
    - -p
    - attach_fallback_s:=0.7
    - -p
    - attach_guard_m:=0.04
    - -p
    - attach_guard_frames:=3
    - -p
    - fpp_gate_jump_m:=0.02
    - -p
    - fpp_gate_dz_m:=0.02
    - -p
    - fpp_gate_radius_m:=0.2
    - -p
    - fpp_gate_max_hold_s:=2.5
    - -p
    - fpp_gate_anchor_m:=0.03
    - -p
    - cup_dropout_stop_s:=1.0
    - -p
    - cup_dropout_near_m:=0.2
    - -p
    - cup_dropout_near_max_s:=2.5
    - -p
    - hand_unfreeze_on_grasp:=true
    - -p
    - thumb_support_g:=80.0
    - -p
    - lift_grasp_palm_m:=0.08
    - -p
    - thumb_open_floor_rad:=0.06
    - -p
    - cup_obs_offset_base_m:=[0.0028,0.0283,0.0046]
    - -p
    - max_episode_s:=33.0
    background: true
  - note: 기록 시작 — 팔 · 손 bag(rh56f1_record.sh) + 정책 · 실행기 상태 · 컵 · 홀더
    argv:
    - bash
    - -lc
    - HAND_SIDES='left' EXTRA='/policy_control/joint_target /policy_control/status/pd_left /policy_control/status/rh_aglt_node_left /policy_control/status/rh_place_node_left
      /policy_control/status/episode_runner_left /policy_control/left/episode /episode/left/objects/CUP/pose /objects/source240_pink/pose /objects/source240_pink/live_pose
      /policy_control/pd_left/applied /policy_control/left/obs /policy_control/left/action' bash {repo}/deploy/policy_control/tools/rh56f1_record.sh
      start episode_grasp_f_source240_pink_left
  - note: CPU 기록 — 프로세스별 코어 1 Hz → logs/runs/<날짜>/cpu(끝날 때 요약)
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/proc_cpu_record.py'
    - --out
    - '{runs}/cpu/episode_grasp_f_source240_pink_left.csv'
    background: true
  - note: 에피소드 실행기 episode_runner_left — grasp_f_source240_pink_left · 승인은 상황판(노드마다 이름 · 연속 실행은 episode:grasp_f_source240_pink_left)
    argv:
    - '{repo}/.venv/bin/python'
