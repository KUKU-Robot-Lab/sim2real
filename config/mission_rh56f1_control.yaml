  - note: arm4090-lan 랜 ssh 가 되고 저 PC 의 sim2real 이 이 PC 와 같은 커밋인가(별칭 → 192.168.0.40 · 키 ~/.ssh/s2r_lan). 거부되면 4090 ~/.ssh/authorized_keys 에 5090
      의 ~/.ssh/s2r_lan.pub 을 넣는다(사용자) · 커밋이 다르면 저 PC 에서 git pull --ff-only
    argv:
    - bash
    - -lc
    - R=$(ssh -o BatchMode=yes -o ConnectTimeout=5 arm4090-lan 'cd rl_ws/sim2real && git rev-parse HEAD') && L=$(git -C {repo} rev-parse HEAD)
      && echo "remote $R" && echo "local  $L" && [ "$R" = "$L" ]
  - note: arm4090-lan 에 손 마스터가 없는가 — 한 손에 마스터는 한 PC(이 PC). 저 PC 의 rh56f1 드라이버 · motion_acq 손 노드가 떠 있으면 멈춘다
    argv:
    - ssh
    - -o
    - BatchMode=yes
    - -o
    - ConnectTimeout=5
    - arm4090-lan
    - if pgrep -af 'rh56f1_[e]cat_node|rh56f1_[d]river|fake_rh56f1_[n]ode|motion_acq_hand.*[h]and_node'; then echo '손 마스터 후보가 돌고 있다 — 끄고 다시';
      exit 1; fi; echo '손 마스터 없음'
  - note: CPU — 실시간 한도(EtherCAT 마스터 FIFO 80 · controller_manager 50) · 코어 배치(이 PC 의 코어를 읽어 노드가 스스로 정한다). 한도가 안 열렸으면 MISS — 운영자가 sudo bash scripts/setup/rt_setup.sh
      한 번 → 재부팅(10.03)
