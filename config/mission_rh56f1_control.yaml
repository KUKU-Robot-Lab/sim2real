# RH56F1 로봇(5090_arm4090, 인지 arm4090-lan) 실기 미션 — scripts/ops/make_rh56f1_missions.py 가 만든다. 손으로 고치지 말 것(--check 가 잡는다).
name: RH56F1 양팔 실기 손 연결 · pd 점검
artifacts:
  contract: logs/policy/asset_openarm_rh56f1_bi_rl/deploy_contract.json
