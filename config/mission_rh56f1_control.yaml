  - note: '★[에피소드 grasp_f_shaker_c_orange_right] 물체(CUP)가 학습 배치에 서 있고 FP++ 가 잡고 있는가 · 컵 자세(설정 탭 물체 좌표): 테이블 위 컵 원점 z ≈ 0.290(상판 0.205 + 원점 0.085,
      ±8 mm) · 기울기 < 3° · x 0.1~0.4 · |y| 0.1~0.3 · 오른팔 source240_blue(y < 0) · 왼팔 shaker_c_orange(y > 0) 인가(카메라를 건드렸으면 scripts/calib/table_cad_extrinsics.py
      --init config/global_camera_extrinsics_arm4090_r20u5.yaml --write --head-config config/head_camset_rh56f1.yaml). 노드를 띄운 뒤에는 상황판 에피소드 패널에서
      진행한다'
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] rh_aglt_r 노드(rh56f1/aglt/right_approach_ap05) — 경로 F: 접근 정책 → 사전 파지 자리(2.5 cm)에서 0.5 s 평균 0.03 m/s 이하로 멈추면 같은 노드에서 rh56f1/aglt/right_rcg04
      로 넘김 → 첫 목표(컵 + 10 cm) 성공 또는 7 cm 위 2 s 쥠 유지에 끝남 · 접근 15 s 안에 못 오면 멈춤 · 접근 중 손바닥-컵 35 cm 넘으면 바로 멈춤 · 컵 = FP++ live · 쥐면 손바닥 FK 로 손에 붙임'
    argv:
    - '{repo}/.venv/bin/python'
    - '{repo}/deploy/policy_control/policy_control/rh_aglt_node.py'
    - --ros-args
    - -r
    - __node:=rh_aglt_node_right
    - -p
    - ns:=right
    - -p
    - contract:={repo}/deploy/policies/rh56f1/aglt/right_approach_ap05/rh_aglt_contract.json
    - -p
    - robot:={artifact:robot_right}
    - -p
    - device:=cpu
    - -p
    - approach_grasp:=handoff=1
    - -p
    - handoff_contract:={repo}/deploy/policies/rh56f1/aglt/right_rcg04/rh_aglt_contract.json
    - -p
    - goal_max:=1
    - -p
    - freeze_rule:=lift_hold
    - -p
    - freeze_lift_m:=0.07
    - -p
    - freeze_hold_steps:=120
    - -p
    - cup_topic:=/objects/shaker_c_orange/live_pose
    - -p
    - cup_static:=false
    - -p
    - cup_latch:=false
    - -p
    - cup_hold_last:=true
    - -p
    - attach_fallback_s:=0.7
    - -p
    - attach_guard_m:=0.04
    - -p
    - attach_guard_frames:=3
    - -p
    - fpp_gate_jump_m:=0.02
    - -p
    - fpp_gate_dz_m:=0.02
    - -p
    - fpp_gate_radius_m:=0.2
    - -p
    - fpp_gate_max_hold_s:=2.5
    - -p
    - fpp_gate_anchor_m:=0.03
    - -p
    - cup_dropout_stop_s:=1.0
    - -p
    - cup_dropout_near_m:=0.2
    - -p
    - cup_dropout_near_max_s:=2.5
    - -p
    - hand_unfreeze_on_grasp:=true
    - -p
    - thumb_support_g:=80.0
    - -p
    - lift_grasp_palm_m:=0.08
    - -p
    - thumb_open_floor_rad:=0.06
    - -p
    - cup_obs_offset_base_m:=[-0.0116,0.0338,0.0000]
    - -p
    - max_episode_s:=33.0
    background: true
  - note: 기록 시작 — 팔 · 손 bag(rh56f1_record.sh) + 정책 · 실행기 상태 · 컵 · 홀더
    argv:
    - bash
    - -lc
    - HAND_SIDES='right' EXTRA='/policy_control/joint_target /policy_control/status/pd_right /policy_control/status/rh_aglt_node_right /policy_control/status/rh_place_node_right
      /policy_control/status/episode_runner_right /policy_control/right/episode /episode/right/objects/CUP/pose /objects/shaker_c_orange/pose
      /objects/shaker_c_orange/live_pose /policy_control/pd_right/applied /policy_control/right/obs /policy_control/right/action' bash {repo}/deploy/policy_control/tools/rh56f1_record.sh
      start episode_grasp_f_shaker_c_orange_right
  - note: CPU 기록 — 프로세스별 코어 1 Hz → logs/runs/<날짜>/cpu(끝날 때 요약)
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/proc_cpu_record.py'
    - --out
    - '{runs}/cpu/episode_grasp_f_shaker_c_orange_right.csv'
    background: true
  - note: 에피소드 실행기 episode_runner_right — grasp_f_shaker_c_orange_right · 승인은 상황판(노드마다 이름 · 연속 실행은 episode:grasp_f_shaker_c_orange_right)
    argv:
    - '{repo}/.venv/bin/python'
    - '{repo}/deploy/policy_control/policy_control/episode_runner_node.py'
    - --ros-args
    - -r
    - __node:=episode_runner_right
    - -p
    - episode:=config/episodes/grasp_f_shaker_c_orange_right.yaml
    - -p
    - robot:=rh56f1
    background: true
  - note: ★에피소드 진행 — 상황판 에피소드 패널의 [다음](구분 실행) · [연속 실행]. 성공 · 정지로 끝나면 확인 (이상하면 '에피소드 실행기 정지' · 정지 바)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: 에피소드 노드들 정지
    stop:
    - episode_grasp_f_shaker_c_orange_right#8
    - episode_grasp_f_shaker_c_orange_right#7
    - episode_grasp_f_shaker_c_orange_right#5
  - note: 기록 끝 — 이 에피소드의 bag 마무리(SIGINT, 팔 · 손)
    argv:
    - bash
    - '{repo}/deploy/policy_control/tools/rh56f1_record.sh'
    - stop
    - episode_grasp_f_shaker_c_orange_right
