# arm4090(RH56F1 로봇) 머리 D435i 카메라 extrinsics — 이 로봇 전용. 5090 은 global_camera_extrinsics.yaml 을 쓴다.
#
# 형식은 global_camera_extrinsics.yaml 과 같다(cup_pose_relay.load_extrinsics). 쿼터니언은 wxyz.
#   T_base_body = T_base_cam ∘ T_cam_cad(FP++ 출력) ∘ T_cad_body
#
# ── T_base_cam: robot base ← camera_color_optical_frame ────────────────────
# ★2026-10-01 테이블 CAD 캘리브(scripts/calib/table_cad_extrinsics.py — 이 로봇의 기본 캘리브 방법).
#   10.01 사용자: "sim 환경의 부분하고, 실제 환경 사진을 픽셀로 분석" · "앞으로 이게 디폴트 칼리브레이션 방법임".
#   env_v1 상판 구멍 20 개(은색 와셔 12 · 빈 구멍 8, CAD 원 맞춤 중심) PnP + depth 상판 법선 제약.
#   테이블이 빈 두 장(머리 head_home_rh56f1 — pan −1.45° · tilt +71.96° 에서 멈춘 자세)의 평균, 두 장 차 2 mm.
#   재투영 평균 2.3 px. 5090 값으로는 상판 외곽 · 구멍이 사진에서 40~60 px 어긋났다(컵 xy ≈ 3 cm).
# ★2026-10-04 다시 캘리브(같은 도구 · 라이브 1장, 사용자 "카메라를 몇 번 움직여서 안 맞을 수 있다"): 10.01 값은 구멍 재투영
#   평균 6.0 px(상판 위 약 4 mm) · 오른쪽(y −0.3) 구멍에서 8~12 px 로 어긋났다 → 새 값 2.36 px(최대 4.7 px).
#   머리 pan −1.27° · tilt +71.87°(읽기만 확인), 상판에 컵 · 홀더가 있어 구멍 20 개 중 16 개 사용. 10.01 값과 차이 위치
#   (7.8, −8.8, −1.0) mm · 회전 1.28° — 컵 자리에서 xy 1~2 mm, 오른팔 자리 z 약 8 mm.
# ★머리 자세 하나에서만 맞는 정적 스냅샷이다 — 그 자세를 아래 head_pose 에 적고, 미션 head_home · cups · cup_holders 단계가
#   FP++ 전에 scripts/head_pose_check.py 로 비교해 맞춘다(pan 은 목표보다 18 틱 앞에서 멈춰 목표 = 캘리브 자세가 아니다).
#   카메라를 건드렸으면 이 자세에서 다시 캘리브한다(라이브 1장, 로봇은 움직이지 않는다 · head_pose 도 같이 적는다):
#     python3 scripts/calib/table_cad_extrinsics.py --init config/global_camera_extrinsics_arm4090.yaml \
#             --write --head-config config/head_home_rh56f1.yaml
camera:
  frame: camera_color_optical_frame
  position: [0.0583100383, 0.0290947753, 0.819849248]
  orientation_wxyz: [0.12943712, -0.698828034, 0.697777977, -0.0893941029]

# ── 이 외부 파라미터를 잰 머리 자세(틱) — scripts/head_pose_check.py 가 FP++ · 홀더 자세 전에 비교하고 맞춘다 ─────
# 10.04 사용자: "fpp 진행 전에 자동으로 각도 확인하고 세팅을 제대로 맞춘 다음에 진행". 다시 캘리브하면 같이 바뀐다
# (table_cad_extrinsics.py --write --head-config config/head_home_rh56f1.yaml). 10.04 값은 캘리브 사진(18:58) 앞뒤로
# 읽기만 해서 두 번 같았다(18:31 · 19:09). head_home 목표(pan 2015)와 다르다 — 이 머리 pan 은 목표보다 18 틱 앞에서 멈춘다.
head_pose:
  pan_tick: 2033       # −1.27°
  tilt_tick: 2865      # +71.87°
  tol_tick: 4          # ±0.35° — 테이블(약 0.6 m)에서 약 3.5 mm

# ── depth 보정: object_pose_node 가 FP++ 자세(카메라 프레임)를 광선 방향으로 늘린다 ───────────────
# D435i depth 가 표면을 가깝게 본다 — 외부 파라미터는 depth 를 쓰지 않는 PnP 라 이 치우침은 FP++(depth 정합) 쪽에만 있다.
# ★10.04 상판 평면(CAD 0.205)을 정답으로 화면 전체(프레임 2 장 · 약 44 만 픽셀)를 맞췄다: 측정 깊이 z(광학축)에서
#   e(z) = offset_m + per_m · z 만큼 짧다(z 0.60 → −6.8 mm · 0.70 → −12.7 mm, 맞춘 범위 0.55~0.75 m, 맞춘 뒤 σ 2.6 mm).
#   홀더 2(z 0.64) FP++ − 마커 정답: 보정 전 13.3 mm · z 만 −8 mm 보정 8.6 mm · 이 광선 보정 3.6 mm.
#   깊이 밖(valid_z_m)에서는 끝값으로 자른다. 도구: logs/cup_holders_1003/*.npz · docs/RH56F1_ECAT_RUNBOOK.md.
depth_bias:
  offset_m: 0.0286
  per_m: -0.0590
  valid_z_m: [0.45, 0.90]
# 10.01 의 z 만 보정(−8 mm, 상판이 0.213 으로 보였다)은 위 광선 보정으로 대신한다 — 둘을 같이 쓰지 않는다.
base_z_bias_m: 0.0

# ── T_cad_body: global_camera_extrinsics.yaml 과 같다(물체별 값은 objects.yaml cad_to_body 가 이긴다) ──
cad_to_body:
  position: [0.0, 0.0, 0.0]
  orientation_wxyz: [0.707107, 0.707107, 0.0, 0.0]

base_frame: base_link
