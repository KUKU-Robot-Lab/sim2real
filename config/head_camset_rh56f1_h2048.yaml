# head(목) camset 자세 — RH56F1 로봇, ★2026-11-15 목 영점 2048 · Homing Offset 0 판(옛 판 head_camset_rh56f1.yaml).
#
# 짝 외부 파라미터 = config/global_camera_extrinsics_arm4090_m1117.yaml(head_pose 1825 · 2833). deg 는 드라이버 규약
#   (head_position_hold_node: tick/4095·360 − 180)으로 그 틱이다(tests/s2r_console/test_rh56f1_mission.py 가 비교).
# 11.15 실측: 목표 pan −19.6° · tilt +68.82°(틱 1825 · 2830)를 쓰면 1825 · 2833 에 선다 → tilt goal_bias_tick −3 으로
#   같은 목표(2830)를 쓴다. pan 은 목표 자리에 선다(옛 판 −19 틱 보정은 없어짐).
# 새 영점에서 처짐 자리(+109.85°)는 위치 모드 범위 안이라 droop_limit_tick 이 없다(head_home.droop_ticks 는 없으면 건너뛴다).
port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763P8T-if00-port0
baud: 1000000

motors:
  pan:
    id: 1
    deg: -19.60          # 틱 1825
    goal_bias_tick: 0
  tilt:
    id: 2
    deg: 69.055          # 틱 2833(멈춘 자리) = 목표 68.82°(2830) + 3
    goal_bias_tick: -3   # 목표 2830 을 쓰면 2833 에 선다(11.15 실측)
position_i_gain: 400
operating_mode: 3
profile_acceleration: 20
profile_velocity: 50
