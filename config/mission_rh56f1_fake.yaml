  artifacts:
  - aglt_right
  - robot_right
  - contract
  title: '[right] rh_aglt 정책(첫 화면에서 고른 것) — 컵에 접근 · 쥐기 · 들기 · 목표(컵 위 14 cm, /policy_control/<팔>/goal 로 바꿀 수 있다)로 이송. 정책 노드 → reset → start → 관찰
    → stop'
- id: policy_aglt_left
  group: policy
  lane: arm_left
  skippable: true
  needs:
  - home_left
  - cups
  - hand_check_left
  needs_why: 정책은 팔이 rh_aglt 시작 자세(= 홈) · 손이 편 채 · 컵이 학습 배치에 선 채로만 출발해 봤다
  artifacts:
  - aglt_left
  - robot_left
  - contract
  title: '[left] rh_aglt 정책(첫 화면에서 고른 것) — 컵에 접근 · 쥐기 · 들기 · 목표(컵 위 14 cm, /policy_control/<팔>/goal 로 바꿀 수 있다)로 이송. 정책 노드 → reset → start → 관찰
    → stop'
