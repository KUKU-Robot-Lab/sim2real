run:
  preflight:
  - note: RH56F1 변환표 · 백엔드 · 상태 노드 · 계약 · 미션 테스트(수 초)
    argv:
    - python3
    - -m
    - pytest
    - -q
    - -m
    - not gpu
    - -p
    - no:cacheprovider
    - '{repo}/tests/policy_control/test_pc_rh56f1.py'
    - '{repo}/tests/s2r_console/test_rh56f1_mission.py'
  - note: 제어 전용 계약 재생성 — 자산 openarm_rh56f1_bi_rl, 홈 = hdgp rh_aglt 시작 자세(양팔 거울, config/homes/rh56f1_aglt.yaml), 손 = 편 손. 홈이 바뀌면 저장 경로의 계약 해시가
      어긋나 home 단계가 멈춘다 — 경로를 다시 계획할 것
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/build_deploy_contract.py'
    - --asset
    - openarm_rh56f1_bi_rl
    - --home
    - arms:config/homes/rh56f1_aglt.yaml
    - --out
    - '{artifact:contract}'
  drivers:
  - note: fake 플랜트 — 양팔 MockArm(rate), 손 없음(손 창이 fake 손을 띄운다)
    argv:
    - ros2
    - launch
    - '{repo}/deploy/policy_control/launch/fake_plant.launch.py'
    - side:=both
    - robot:={artifact:robot_bi}
    - contract:={artifact:contract}
    - hands:=none
    - plant_model:=rate
    - arm_start:=right=0,0,0,0.02,0,0,0;left=0,0,0,0.02,0,0,0
    background: true
  shutdown:
  - note: ★양팔을 받침 위 · 안전 자세에 두었는가. 두 팔 모두 pd 해제를 끝냈는가. 다음 스텝부터 토크가 풀린다
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: 남은 정책 노드 · pd 정지
    stop:
    - policy_pourfj#1
    - policy_aglt_right#1
    - policy_aglt_left#1
    - pd_load_right#0
    - pd_arm_right#1
    - pd_load_left#0
    - pd_arm_left#1
  - note: 손 상태 노드 · 손 드라이버 정지 — 손가락은 마지막 자세에서 멈춘다(벤더 펌웨어가 잡는다)
    stop:
    - hand_right#1
    - hand_right#0
    - hand_left#1
    - hand_left#0
  - note: fake 플랜트 정지
    stop:
    - drivers#0
  cup_holders:
  - note: fake — 카메라 없음
    argv:
    - bash
    - -lc
    - 'true'
  head_home:
  - note: fake — 머리 없음
    argv:
    - bash
    - -lc
    - 'true'
  cups:
  - note: fake 컵(src) — /objects/cup_src/pose
    argv:
    - python3
    - '{repo}/scripts/fakes/fake_cup_pose_pub.py'
    - --x
    - '0.38'
    - --y
    - '-0.16'
    - --z
    - '0.264865'
    - --topic
    - /objects/cup_src/pose
    background: true
  - note: fake 컵(rcv) — /objects/cup_rcv/pose
    argv:
    - python3
    - '{repo}/scripts/fakes/fake_cup_pose_pub.py'
    - --x
    - '0.38'
    - --y
    - '0.16'
    - --z
    - '0.264865'
    - --topic
    - /objects/cup_rcv/pose
    background: true
  policy_pourfj:
  - note: fake — 확인만
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: 양팔 정책 노드(pour_fj_node, LSTM · CPU) — start 전에는 아무것도 보내지 않는다. 처음 30 스텝은 팔을 시작 자세에 둔다(학습 hold)
    argv:
    - '{repo}/.venv/bin/python'
    - '{repo}/deploy/policy_control/policy_control/pour_fj_node.py'
    - --ros-args
    - -p
    - contract:={artifact:pourfj_both}
    - -p
    - robot:={artifact:robot_bi}
    - -p
    - device:=cpu
    - -p
