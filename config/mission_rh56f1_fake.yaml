  skippable: true
  artifacts:
  - contract
  - robot_right
  - pd_exec
  needs_why: 무발행 상태에서 게인 · 입력이 맞는지 본 뒤에만 발행 권한을 준다
  title: '[right] pd 발행 모드 전환 — engage 는 하지 않는다(팔은 JTC 가 잡는다)'
- id: home_right
  group: motion
  lane: arm_right
  needs:
  - pd_arm_right
  skippable: true
  artifacts:
  - contract
  - path_right
  title: '[right] (한 번 승인) engage → 차렷 손(주먹) → 저장 경로로 차렷 → 홈(rh_aglt 시작 자세) → 정착 → 손 초기 자세'
- id: return_right
  group: finish
  lane: arm_right
  needs:
  - home_right
  skippable: true
  artifacts:
  - contract
  - path_right
  undoes:
  - home_right
  title: '[right] 홈 → 차렷 — 홈 정착 → 차렷 손(주먹) → 저장 경로 역재생 → pd 해제(한 번 승인, 홈 근처에서만)'
- id: release_right
  group: finish
  lane: arm_right
  needs:
  - pd_arm_right
  skippable: true
  undoes:
  - pd_arm_right
  - home_right
  title: '[right] pd 해제(역블렌드 → JTC) → 이 팔의 pd 정지'
- id: hand_left
  group: connect
  lane: arm_left
  needs:
  - preflight
  skippable: true
  artifacts:
  - rh56f1_map
  title: '[left] RH56F1 손 드라이버(fake 손) + 상태 노드(0.1° → rad)'
- id: hand_check_left
  group: prepare
  lane: arm_left
  needs:
  - hand_left
  skippable: true
  title: '[left] 손 점검 — 주기 · 슬롯 이름 · 레지스터 → rad · 한계 (읽기 전용)'
- id: probe_left
  group: diagnose
  lane: arm_left
  needs:
  - hand_check_left
  skippable: true
  artifacts:
  - rh56f1_map
  title: '[left] 한 축씩 방향 확인 — 한 손가락만 작게 움직였다 되돌린다(엄지 두 축은 변환표 verified 전)'
- id: pd_load_left
  group: prepare
  lane: arm_left
  needs:
  - drivers
  - hand_check_left
  skippable: true
  artifacts:
  - contract
  - robot_left
  - pd
  needs_why: pd 는 팔(브링업)과 그 팔의 손 상태가 둘 다 있어야 입력이 들어온다
  title: '[left] pd 무발행 기동 (execute:=false) — 게인 · 입력 신선도 확인'
- id: pd_arm_left
  group: prepare
  lane: arm_left
  needs:
  - pd_load_left
  skippable: true
  artifacts:
  - contract
  - robot_left
  - pd_exec
  needs_why: 무발행 상태에서 게인 · 입력이 맞는지 본 뒤에만 발행 권한을 준다
  title: '[left] pd 발행 모드 전환 — engage 는 하지 않는다(팔은 JTC 가 잡는다)'
- id: home_left
