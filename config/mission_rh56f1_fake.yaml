# RH56F1 로봇 fake 미션(도메인 97) — scripts/ops/make_rh56f1_missions.py 가 실기 미션과 같은 정의에서 만든다.
name: RH56F1 양팔 fake 손 연결 · pd 점검
artifacts:
  contract: logs/policy/asset_openarm_rh56f1_bi_rl/deploy_contract.json
  robot_right: deploy/policy_control/config/robots/rh56f1_right_fake.yaml
  robot_left: deploy/policy_control/config/robots/rh56f1_left_fake.yaml
  pd: deploy/policy_control/config/pd_rh56f1_fake.yaml
  pd_exec: deploy/policy_control/config/pd_rh56f1_fake.yaml
  rh56f1_map: deploy/policy_control/config/rh56f1_hand_map.yaml
  pourfj_both: deploy/policies/both_rh_pourfj_f01/pour_fj_contract.json
  robot_bi: deploy/policy_control/config/robots/rh56f1_bi_fake.yaml
checkpoints: {}
groups:
- id: check
  title: 점검
- id: connect
  title: 연결
- id: prepare
  title: 준비
- id: motion
  title: 자세 이동
  motion: true
- id: policy
  title: 정책 동작
  motion: true
- id: finish
  title: 정리
- id: diagnose
  title: 진단 (선택)
  motion: true
  optional: true
lanes:
- id: rig
  title: 드라이버
- id: arm_right
  title: 오른팔 · 오른손
  side: right
- id: arm_left
  title: 왼팔 · 왼손
  side: left
- id: both
  title: 양팔 · 컵 · 정책
  focus: policy_pourfj
stages:
- id: preflight
  group: check
  lane: rig
  title: 테스트 · RH56F1 제어 전용 계약 재생성(양팔 pour_fj 홈 · 편 손) (읽기 전용)
  artifacts:
  - rh56f1_map
- id: cups
  group: connect
  lane: both
  needs:
  - preflight
  skippable: true
  title: fake 컵 두 개 — 학습 배치 중심(0.38, ∓0.16), 테이블 위에 선 채
- id: drivers
  group: connect
  lane: rig
  needs:
  - preflight
  title: fake 플랜트 — 양팔 MockArm(rate) · controller_manager 스텁 (손은 손 창에서 따로)
  needs_why: 점검 전에 띄우면 오배선 상태로 모터가 돈다
- id: hand_right
  group: connect
  lane: arm_right
  needs:
  - preflight
  skippable: true
  artifacts:
  - rh56f1_map
  title: '[right] RH56F1 손 드라이버(fake 손) + 상태 노드(0.1° → rad)'
- id: hand_check_right
  group: prepare
  lane: arm_right
  needs:
  - hand_right
  skippable: true
  title: '[right] 손 점검 — 주기 · 슬롯 이름 · 레지스터 → rad · 한계 (읽기 전용)'
- id: probe_right
  group: diagnose
  lane: arm_right
  needs:
  - hand_check_right
  skippable: true
  artifacts:
  - rh56f1_map
  title: '[right] 한 축씩 방향 확인 — 한 손가락만 작게 움직였다 되돌린다(엄지 두 축은 변환표 verified 전)'
- id: pd_load_right
  group: prepare
  lane: arm_right
  needs:
  - drivers
  - hand_check_right
  skippable: true
  artifacts:
  - contract
  - robot_right
  - pd
  needs_why: pd 는 팔(브링업)과 그 팔의 손 상태가 둘 다 있어야 입력이 들어온다
  title: '[right] pd 무발행 기동 (execute:=false) — 게인 · 입력 신선도 확인'
- id: pd_arm_right
  group: prepare
  lane: arm_right
  needs:
  - pd_load_right
  skippable: true
  artifacts:
  - contract
  - robot_right
  - pd_exec
  needs_why: 무발행 상태에서 게인 · 입력이 맞는지 본 뒤에만 발행 권한을 준다
  title: '[right] pd 발행 모드 전환 — engage 는 하지 않는다(팔은 JTC 가 잡는다)'
- id: home_right
  group: motion
  lane: arm_right
  needs:
  - pd_arm_right
  skippable: true
  artifacts:
  - contract
  title: '[right] engage → pour_fj 시작 자세(홈) — 손은 편 손'
- id: release_right
  group: finish
  lane: arm_right
  needs:
  - pd_arm_right
  skippable: true
  undoes:
  - pd_arm_right
  - home_right
  title: '[right] pd 해제(역블렌드 → JTC) → 이 팔의 pd 정지'
- id: hand_left
  group: connect
  lane: arm_left
  needs:
  - preflight
  skippable: true
  artifacts:
  - rh56f1_map
  title: '[left] RH56F1 손 드라이버(fake 손) + 상태 노드(0.1° → rad)'
- id: hand_check_left
  group: prepare
  lane: arm_left
  needs:
  - hand_left
  skippable: true
  title: '[left] 손 점검 — 주기 · 슬롯 이름 · 레지스터 → rad · 한계 (읽기 전용)'
- id: probe_left
  group: diagnose
  lane: arm_left
  needs:
  - hand_check_left
  skippable: true
  artifacts:
  - rh56f1_map
  title: '[left] 한 축씩 방향 확인 — 한 손가락만 작게 움직였다 되돌린다(엄지 두 축은 변환표 verified 전)'
- id: pd_load_left
  group: prepare
  lane: arm_left
  needs:
  - drivers
  - hand_check_left
  skippable: true
  artifacts:
  - contract
  - robot_left
  - pd
  needs_why: pd 는 팔(브링업)과 그 팔의 손 상태가 둘 다 있어야 입력이 들어온다
  title: '[left] pd 무발행 기동 (execute:=false) — 게인 · 입력 신선도 확인'
- id: pd_arm_left
  group: prepare
  lane: arm_left
  needs:
  - pd_load_left
  skippable: true
  artifacts:
  - contract
  - robot_left
  - pd_exec
  needs_why: 무발행 상태에서 게인 · 입력이 맞는지 본 뒤에만 발행 권한을 준다
  title: '[left] pd 발행 모드 전환 — engage 는 하지 않는다(팔은 JTC 가 잡는다)'
- id: home_left
  group: motion
  lane: arm_left
  needs:
  - pd_arm_left
  skippable: true
  artifacts:
  - contract
  title: '[left] engage → pour_fj 시작 자세(홈) — 손은 편 손'
- id: release_left
  group: finish
  lane: arm_left
  needs:
  - pd_arm_left
  skippable: true
  undoes:
  - pd_arm_left
  - home_left
  title: '[left] pd 해제(역블렌드 → JTC) → 이 팔의 pd 정지'
- id: policy_pourfj
  group: policy
  lane: both
  skippable: true
  needs:
  - home_right
  - home_left
  - cups
  - hand_check_right
  - hand_check_left
  needs_why: 정책은 양팔이 pour_fj 시작 자세 · 손이 편 채 · 두 컵이 선 채로만 출발해 봤다
  artifacts:
  - pourfj_both
  - robot_bi
  - contract
  title: '[양팔] pour_fj 정책(첫 화면에서 고른 것) — 정책 노드 → reset → start → 관찰 → stop (시간이 되면 스스로 끝난다)'
- id: shutdown
  group: finish
  lane: rig
  needs:
  - drivers
  title: 안전 종료 — 팔 받침 확인 → 남은 pd → 손 상태 · 드라이버 → 팔 브링업 (★팔 토크가 풀린다)
run:
  preflight:
  - note: RH56F1 변환표 · 백엔드 · 상태 노드 · 계약 · 미션 테스트(수 초)
    argv:
    - python3
    - -m
    - pytest
    - -q
    - -m
    - not gpu
    - -p
    - no:cacheprovider
    - '{repo}/tests/policy_control/test_pc_rh56f1.py'
    - '{repo}/tests/s2r_console/test_rh56f1_mission.py'
  - note: 제어 전용 계약 재생성 — 자산 openarm_rh56f1_bi_rl, 홈 = hdgp pour_fj 리셋 홈(양팔, config/homes), 손 = 편 손
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/build_deploy_contract.py'
    - --asset
    - openarm_rh56f1_bi_rl
    - --home
    - arms:config/homes/rh56f1_pour_fj.yaml
    - --out
    - '{artifact:contract}'
  drivers:
  - note: fake 플랜트 — 양팔 MockArm(rate), 손 없음(손 창이 fake 손을 띄운다)
    argv:
    - ros2
    - launch
    - '{repo}/deploy/policy_control/launch/fake_plant.launch.py'
    - side:=both
    - robot:={artifact:robot_bi}
    - contract:={artifact:contract}
    - hands:=none
    - plant_model:=rate
    - arm_start:=right=0,0,0,0.1,0,0,0;left=0,0,0,0.1,0,0,0
    background: true
  shutdown:
  - note: ★양팔을 받침 위 · 안전 자세에 두었는가. 두 팔 모두 pd 해제를 끝냈는가. 다음 스텝부터 토크가 풀린다
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: 남은 정책 노드 · pd 정지
    stop:
    - policy_pourfj#1
    - pd_load_right#0
    - pd_arm_right#1
    - pd_load_left#0
    - pd_arm_left#1
  - note: 손 상태 노드 · 손 드라이버 정지 — 손가락은 마지막 자세에서 멈춘다(벤더 펌웨어가 잡는다)
    stop:
    - hand_right#1
    - hand_right#0
    - hand_left#1
    - hand_left#0
  - note: fake 플랜트 정지
    stop:
    - drivers#0
  cups:
  - note: fake 컵(src) — /objects/cup_src/pose
    argv:
    - python3
    - '{repo}/scripts/fakes/fake_cup_pose_pub.py'
    - --x
    - '0.38'
    - --y
    - '-0.16'
    - --z
    - '0.264865'
    - --topic
    - /objects/cup_src/pose
    background: true
  - note: fake 컵(rcv) — /objects/cup_rcv/pose
    argv:
    - python3
    - '{repo}/scripts/fakes/fake_cup_pose_pub.py'
    - --x
    - '0.38'
    - --y
    - '0.16'
    - --z
    - '0.264865'
    - --topic
    - /objects/cup_rcv/pose
    background: true
  policy_pourfj:
  - note: fake — 확인만
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: 양팔 정책 노드(pour_fj_node, LSTM · CPU) — start 전에는 아무것도 보내지 않는다. 처음 30 스텝은 팔을 시작 자세에 둔다(학습 hold)
    argv:
    - '{repo}/.venv/bin/python'
    - '{repo}/deploy/policy_control/policy_control/pour_fj_node.py'
    - --ros-args
    - -p
    - contract:={artifact:pourfj_both}
    - -p
    - robot:={artifact:robot_bi}
    - -p
    - device:=cpu
    - -p
    - max_episode_s:={policy:pourfj_both.max_episode_s}
    background: true
  - note: episode reset — 두 컵 · 양팔 측정이 모두 있어야 받는다
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/trigger.py'
    - episode/reset
    execute_args:
    - --execute
  - note: ★episode start — 양팔이 시작 자세 0.15 rad 안 · 두 컵이 서 있어야 받는다
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/trigger.py'
    - episode/start
    execute_args:
    - --execute
  - note: ★관찰 — 이상하면 정지 바의 '에피소드 정지'
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: episode stop — pd 가 그 자세 · 손 쥠을 붙잡는다
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/trigger.py'
    - episode/stop
    execute_args:
    - --execute
  - note: 정책 노드 정지
    stop:
    - policy_pourfj#1
  hand_right:
  - note: '[right] fake RH56F1 손 — 벤더 드라이버와 같은 토픽 · 단위(편 손에서 시작)'
    argv:
    - python3
    - '{repo}/scripts/fakes/fake_rh56f1_hand.py'
    - --side
    - right
    background: true
  - note: '[right] 상태 노드 — /hand_right/angle_actual(0.1°) → /hand_right/joint_states(rad) · 촉각 → tip_forces'
    argv:
    - python3
    - '{repo}/deploy/policy_control/policy_control/rh56f1_state_node.py'
    - --side
    - right
    - --map
    - '{artifact:rh56f1_map}'
    background: true
  hand_check_right:
  - note: '[right] 손 점검(읽기만) — 드라이버 주기 ≥ 20 Hz · 슬롯 이름 · 변환 · 한계'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_hand_check.py'
    - --side
    - right
    - --map
    - '{artifact:rh56f1_map}'
  probe_right:
  - note: ★[right] 손 주변이 비어 있는가 — 한 손가락씩 작게(최대 0.5 rad) 움직였다 되돌린다. 어느 손가락이 어느 쪽으로 움직이는지 눈으로 본다
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] index_1 0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - index_1
    - --by
    - '0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] index_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] middle_1 0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - middle_1
    - --by
    - '0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] middle_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] ring_1 0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - ring_1
    - --by
    - '0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] ring_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] pinky_1 0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - pinky_1
    - --by
    - '0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] pinky_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] thumb_2 0.15 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - thumb_2
    - --by
    - '0.15'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] thumb_2 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  - note: '[right] thumb_1 -0.3 rad → 되돌림'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/rh56f1_axis_probe.py'
    - --side
    - right
    - --axis
    - thumb_1
    - --by
    - '-0.3'
    - --back
    - --map
    - '{artifact:rh56f1_map}'
    execute_args:
    - --execute
  - note: ★[right] thumb_1 가 맞는 손가락이 맞는 쪽으로 움직였는가(엄지면 변환표 verified 를 여기서 판단)
    argv:
    - bash
    - -lc
    - 'true'
    manual: true
  pd_load_right:
  - note: '[right] pd 무발행 기동 — status 의 입력 신선도를 본다'
    argv:
    - ros2
    - launch
    - '{repo}/deploy/policy_control/launch/pd_controller.launch.py'
    - contract:={artifact:contract}
    - robot:={artifact:robot_right}
    - pd_config:={artifact:pd}
    - sides:=right
    - execute:=false
    - fake:=true
    background: true
  pd_arm_right:
  - note: '[right] 무발행 pd 정지'
    stop:
    - pd_load_right#0
  - note: '[right] pd 발행 모드 기동 (execute:=true · stage:=full) — IDLE 로 뜬다. engage 전까지 팔은 JTC 가 잡는다'
    argv:
    - ros2
    - launch
    - '{repo}/deploy/policy_control/launch/pd_controller.launch.py'
    - contract:={artifact:contract}
    - robot:={artifact:robot_right}
    - pd_config:={artifact:pd_exec}
    - sides:=right
    - execute:=true
    - stage:=full
    - fake:=true
    background: true
  home_right:
  - note: '[right] pd engage'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/episode_ctl.py'
    - --side
    - right
    - --only
    - pd_engage
    execute_args:
    - --execute
    - --approve
    - pd_engage
  - note: '[right] pd goto_home — pour_fj 시작 자세(fake 에서만 직선)'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/episode_ctl.py'
    - --side
    - right
    - --only
    - pd_goto_home
    - --service-timeout
    - '45'
    execute_args:
    - --execute
    - --approve
    - pd_goto_home
  release_right:
  - note: '[right] pd release — 역블렌드 → 0 송출 → JTC 복귀'
    argv:
    - python3
    - '{repo}/deploy/policy_control/tools/episode_ctl.py'
    - --side
    - right
    - --only
    - pd_release
    execute_args:
    - --execute
  - note: '[right] 이 팔의 pd 정지 — IDLE 이라 토크는 JTC 가 잡는다'
    stop:
    - pd_arm_right#1
  hand_left:
  - note: '[left] fake RH56F1 손 — 벤더 드라이버와 같은 토픽 · 단위(편 손에서 시작)'
    argv:
    - python3
    - '{repo}/scripts/fakes/fake_rh56f1_hand.py'
    - --side
    - left
    background: true
  - note: '[left] 상태 노드 — /hand_left/angle_actual(0.1°) → /hand_left/joint_states(rad) · 촉각 → tip_forces'
    argv:
    - python3
    - '{repo}/deploy/policy_control/policy_control/rh56f1_state_node.py'
    - --side
    - left
    - --map
    - '{artifact:rh56f1_map}'
    background: true
  hand_check_left:
