# RH56F1 로봇 fake 미션(도메인 97) — scripts/ops/make_rh56f1_missions.py 가 실기 미션과 같은 정의에서 만든다.
name: RH56F1 양팔 fake 손 연결 · pd 점검
artifacts:
  contract: logs/policy/asset_openarm_rh56f1_bi_rl/deploy_contract.json
  robot_right: deploy/policy_control/config/robots/rh56f1_right_fake.yaml
  robot_left: deploy/policy_control/config/robots/rh56f1_left_fake.yaml
  pd: deploy/policy_control/config/pd_rh56f1_fake.yaml
  pd_exec: deploy/policy_control/config/pd_rh56f1_fake.yaml
  rh56f1_map: deploy/policy_control/config/rh56f1_hand_map.yaml
  path_right: deploy/policy_control/paths/home_rh56f1_right.npz
  path_left: deploy/policy_control/paths/home_rh56f1_left.npz
  pourfj_both: deploy/policies/rh56f1/pour_fj/both_f01/pour_fj_contract.json
  robot_bi: deploy/policy_control/config/robots/rh56f1_bi_fake.yaml
  aglt_right: deploy/policies/rh56f1/aglt/right_src21c/rh_aglt_contract.json
  aglt_left: deploy/policies/rh56f1/aglt/left_g5362/rh_aglt_contract.json
  place_right: deploy/policies/rh56f1/place/right_i09/rh_place_contract.json
  place_left: deploy/policies/rh56f1/place/left_i01/rh_place_contract.json
checkpoints: {}
groups:
- id: check
  title: 점검
- id: connect
  title: 연결
- id: prepare
  title: 준비
- id: motion
  title: 자세 이동
  motion: true
- id: policy
  title: 정책 동작
  motion: true
- id: finish
  title: 정리
- id: diagnose
  title: 진단 (선택)
  motion: true
  optional: true
lanes:
- id: rig
  title: 드라이버
- id: arm_right
  title: 오른팔 · 오른손
  side: right
  focus: policy_aglt_right
- id: arm_left
  title: 왼팔 · 왼손
  side: left
  focus: policy_aglt_left
- id: both
  title: 양팔 · 컵 · 정책
  focus: policy_pourfj
stages:
- id: preflight
  group: check
  lane: rig
  title: 테스트 · RH56F1 제어 전용 계약 재생성(양팔 pour_fj 홈 · 편 손) (읽기 전용)
  artifacts:
  - rh56f1_map
- id: head_home
  group: motion
  lane: rig
  needs:
  - preflight
  skippable: true
  title: fake — 머리 없음(실기 순서를 맞추려고 둔 자리)
- id: cups
  group: connect
  lane: both
  needs:
  - head_home
  skippable: true
  title: fake 컵 두 개 — 학습 배치 중심(0.38, ∓0.16), 테이블 위에 선 채
- id: cup_holders
  group: connect
  lane: both
  needs:
  - head_home
  skippable: true
  title: fake — 카메라 없음(실기 순서를 맞추려고 둔 자리)
- id: drivers
  group: connect
  lane: rig
  needs:
  - preflight
  title: fake 플랜트 — 양팔 MockArm(rate) · controller_manager 스텁 (손은 손 창에서 따로)
  needs_why: 점검 전에 띄우면 오배선 상태로 모터가 돈다
- id: hand_right
  group: connect
  lane: arm_right
  needs:
  - preflight
  skippable: true
  artifacts:
  - rh56f1_map
  title: '[right] RH56F1 손 드라이버(fake 손) + 상태 노드(0.1° → rad)'
- id: hand_check_right
  group: prepare
  lane: arm_right
  needs:
  - hand_right
  skippable: true
  title: '[right] 손 점검 — 주기 · 슬롯 이름 · 레지스터 → rad · 한계 (읽기 전용)'
- id: probe_right
  group: diagnose
  lane: arm_right
  needs:
  - hand_check_right
  skippable: true
  artifacts:
  - rh56f1_map
  title: '[right] 한 축씩 방향 확인 — 한 손가락만 작게 움직였다 되돌린다(엄지 두 축은 변환표 verified 전)'
- id: pd_load_right
  group: prepare
  lane: arm_right
  needs:
  - drivers
  - hand_check_right
  skippable: true
  artifacts:
  - contract
  - robot_right
  - pd
  needs_why: pd 는 팔(브링업)과 그 팔의 손 상태가 둘 다 있어야 입력이 들어온다
  title: '[right] pd 무발행 기동 (execute:=false) — 게인 · 입력 신선도 확인'
- id: pd_arm_right
  group: prepare
  lane: arm_right
  needs:
