# head(목) 기준 자세 — arm4090 RH56F1 로봇 (2026-09-30, 5090 홈 화면과 같게 맞춤)
#
# 맞춘 방법: scripts/calib/head_view_autoalign.py(tilt: 테이블 평면 숙임) + 볼트 무리 위치로 pan 손 조정.
#   기준 config/head_view_ref_5090.npz(5090 홈 pan 2049 · tilt 1820 틱) 대비: 숙임 18.93°(기준 18.9) · 테이블 거리 0.61 m(0.614) ·
#   왼쪽 · 가운데 볼트 무리 5~10 px · 회전 약 0.7°.
# ★이 머리는 5090 과 같은 숫자로 못 맞춘다: tilt 혼이 약 184° 돌아 조립돼 있고 Homing Offset 은 ±1024 틱(±90°)만 먹는다
#   (그 밖의 값은 레지스터에 써져도 무시 — 09.30 실측). 그래서 모터 EEPROM 에 offset pan +1024 · tilt −1024 를 넣어 쓰는 범위를
#   0/4095 경계에서 떼어 놓고, 이 파일에 그 상태의 홈 각을 따로 둔다. 5090 은 config/head_home.yaml 을 그대로 쓴다.
#   offset 을 바꾸면 아래 deg 도 다시 맞춰야 한다.
# 카메라 외부 파라미터(head_extrinsics.yaml)의 영점도 이 로봇은 다르다 — 같은 화면일 때
#   tilt: 5090 −20.04° ↔ 이 로봇 +71.81°,  pan: 5090 +0.09° ↔ 이 로봇 −2.90° (FP++ 를 arm4090 에 올릴 때 반영).
# ★10.04 실측: head_home.py 로 직접 쓰면(보정 없음) pan 이 목표보다 18 틱(1.6°) 앞에서 멈췄다(목표 2015 → 2033, 그 전 1997 → 2015).
#   카메라 외부 파라미터는 그때 멈춘 자리에서 쟀다(config/global_camera_extrinsics_arm4090.yaml head_pose, 10.27 다시 잼: pan 2033 · tilt 2864 틱).
# ★10.27 pan 목표를 2015 → 2033(캘리브 자세)으로 바꿨다. 미션 head_home · cup_holders 는 head_move.py 로 드라이버(head_joint_publisher)에
#   기준 자세를 요청한다. 드라이버는 목표 ±0.3° 안이면 성공, 1.0° 안이면 목표 쪽으로 다시 맞추고, 더 멀면 실패로 끝낸다(head_motion).
#   목표 2015 는 캘리브 자세와 1.6° 차라 보정 범위 밖이다. 외부 파라미터를 다시 재서 head_pose 가 바뀌면 이 값도 같이 맞춘다.
# ★10.28 그런데 목표 2033 을 그대로 쓰면 2051 에 선다 — 이 머리는 목표 레지스터보다 일정 틱 큰 자리에 선다(펌웨어 궤적 끝부터,
#   camset 실측 pan +19 · tilt +3). 그래서 deg 는 캘리브 자세로 두고 쓸 때만 pan goal_bias_tick −18 을 더한다(10.04 실측 목표
#   2015 → 2033). tilt 는 home 에서 재지 않았다(0 — +3 이어도 판정 ±0.3° 안). 미션은 10.28 부터 head_camset_rh56f1.yaml 을 쓴다.
port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763P8T-if00-port0
baud: 1000000

motors:
  pan:
    id: 1
    deg: -1.27         # 틱 2033(offset +1024 적용 후) = 외부 파라미터 head_pose pan (10.27, 전에는 -2.9 = 틱 2015)
    goal_bias_tick: -18  # 목표 2015 를 쓰면 2033 에 선다(10.04 실측)
  tilt:
    id: 2
    deg: 71.8          # 틱 2864(offset −1024 적용 후) = 외부 파라미터 head_pose tilt

position_i_gain: 400

# 순서 규약은 config/head_home.yaml 과 같다: 토크off → 모드 → 게인 → 프로파일 → 토크on → 목표
operating_mode: 3
profile_acceleration: 20
profile_velocity: 50
