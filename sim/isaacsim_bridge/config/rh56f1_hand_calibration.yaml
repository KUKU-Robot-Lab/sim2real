# RH56F1 손 캘리브레이션 (sim 라디안 ↔ 드라이버 레지스터 정수).
#
# 각 손의 joints는 "명령 배열 순서"(SIM_DRIVE_SUFFIXES)를 따른다:
#   thumb_1, thumb_2, index_1, middle_1, ring_1, pinky_1
# driver_index = SetAngle1.joint_values 안의 0-based 슬롯 (액추에이터 ID - 1).
# rad_lo/rad_hi = URDF 관절 limit. reg_lo/reg_hi = RH56F1 매뉴얼 레지스터 범위.
#
# TODO(hardware): 실물에서 아래를 반드시 확인/보정할 것.
#   1) 손가락↔액추에이터 ID 순서: 한 손가락씩 굽혀 어느 driver_index가 반응하는지.
#   2) 레지스터 증가 방향: 굽힘에 reg가 증가하면 그대로, 감소하면 reg_lo/reg_hi 스왑.
#   3) 엄지 thumb_1(회전/벌림)/thumb_2(굽힘)의 sim↔실물 대응.
# 코드는 건드리지 말고 이 값만 조정하면 된다.

right:
  hand_id: 2
  joints:
    - {suffix: thumb_1,  driver_index: 5, rad_lo: 0.0, rad_hi: 2.0943951, reg_lo: 600,  reg_hi: 1800}
    - {suffix: thumb_2,  driver_index: 4, rad_lo: 0.0, rad_hi: 0.4745550, reg_lo: 1100, reg_hi: 1350}
    - {suffix: index_1,  driver_index: 3, rad_lo: 0.0, rad_hi: 1.5285594, reg_lo: 900,  reg_hi: 1740}
    - {suffix: middle_1, driver_index: 2, rad_lo: 0.0, rad_hi: 1.5285594, reg_lo: 900,  reg_hi: 1740}
    - {suffix: ring_1,   driver_index: 1, rad_lo: 0.0, rad_hi: 1.5285594, reg_lo: 900,  reg_hi: 1740}
    - {suffix: pinky_1,  driver_index: 0, rad_lo: 0.0, rad_hi: 1.5285594, reg_lo: 900,  reg_hi: 1740}

left:
  hand_id: 1
  joints:
    - {suffix: thumb_1,  driver_index: 5, rad_lo: 0.0, rad_hi: 2.0943951, reg_lo: 600,  reg_hi: 1800}
    - {suffix: thumb_2,  driver_index: 4, rad_lo: 0.0, rad_hi: 0.4745550, reg_lo: 1100, reg_hi: 1350}
    - {suffix: index_1,  driver_index: 3, rad_lo: 0.0, rad_hi: 1.5285594, reg_lo: 900,  reg_hi: 1740}
    - {suffix: middle_1, driver_index: 2, rad_lo: 0.0, rad_hi: 1.5285594, reg_lo: 900,  reg_hi: 1740}
    - {suffix: ring_1,   driver_index: 1, rad_lo: 0.0, rad_hi: 1.5285594, reg_lo: 900,  reg_hi: 1740}
    - {suffix: pinky_1,  driver_index: 0, rad_lo: 0.0, rad_hi: 1.5285594, reg_lo: 900,  reg_hi: 1740}
