# VLM 판정 시험대 질문. 경계 사진 한두 장으로 답할 수 있는 예/아니오 질문만 둔다.
# 출처는 config/skill_cards.yaml 의 스킬별 VLM_질문이다. "the intended cup"·"the selected hand" 자리는 노드 인자로 채운다.
#   {hand} = 정책 이름 끝 _r/_l → right/left. 머리 카메라는 로봇 쪽에서 보므로 로봇의 왼손이 사진의 왼쪽이다
#   {obj}  = 노드의 target_object·source_object 를 아래 objects 의 영어 이름으로. to_tilt_start 는 그 손이 쥔 컵
#   홀더(target_holder)는 문구에 넣지 않고 "a holder" 로 묻는다. 참값(놓기 등급)은 목표 홀더 기준이라, 컵이 다른 홀더에
#   서 있으면 no 로 적힌다(vlm_full_1116 에는 그런 놓기가 없다). 홀더 번호는 끝 상태(result.jsonl objects)를 찾는 데 쓴다.
# 참값은 build_set.py 가 러너·sim 기록으로 만든 world 에서 읽는다(truth 칸). VLM 답은 쓰지 않는다.
#   world 의 컵 값: table · left/right(그 손 안) · holder(great) · leaning(partial) · out(놓기 fail, 떨어뜨림) · 모름
# 문구를 바꿔 비교할 때는 text 만 고친다. id 를 바꾸거나 더하면 build_set.truth_of 의 표도 같이 고친다.
# 사진으로 답할 수 있는지는 vlm_full_1116 의 경계 사진 12장(seed0·1·3·4·7·8)을 보고 정했다. 그 12장에서는 컵 셋과
# 홀더 셋이 모두 화면 안에 있었다(손에 들린 컵은 가장자리에 걸칠 때가 있다).

objects:
  SRC_BLUE: blue cup
  SRC_PINK: pink cup
  SHAKER: orange shaker cup

# at = 이 질문이 제 질문인 노드 종류(skill_cards 의 스킬 id). 그 노드가 끝난 경계에서 pos(yes)·neg_fail(no) 이 된다.
# 다른 경계 사진에서 world 상 참값이 분명히 no 면 같은 문구가 쉬운 반례(neg_cross)로 붙는다.
questions:
- id: holders_empty
  at: [scene_snapshot]
  text: Are all of the cup holders empty?
  card: 'scene_snapshot "Are all holders empty?"'
  truth: >-
    yes = 모든 컵이 탁자나 손 안(어떤 place 도 exit 전). no = exit[place].signals.<정책>.scripted_judge.grade 가
    great·partial 인 컵이 있음. fail 로 끝난 놓기 뒤는 못 정함.

- id: cup_in_hand
  at: [grasp, to_tilt_start]
  text: Is the robot's {hand} hand holding the {obj}?
  card: 'grasp "Is the intended cup enclosed by the fingers?" · to_tilt_start "Is the cup still secure in the selected hand?"'
  truth: >-
    yes = exit[grasp].result=COMPLETED 이고 signals.<정책>.dropped=false, 아직 place 전.
    no = 컵이 탁자(grasp 전)나 홀더(place 뒤)에 있음. 제 경계에서는 dropped=true 도 no. 그 밖의 잡기 실패는 못 정함.

- id: cup_lifted
  at: [grasp]
  text: Is the {obj} lifted clear of the table?
  card: 'grasp "Has the cup lifted clear of the table?"'
  truth: >-
    yes = 컵이 손 안(cup_in_hand 와 같은 근거. sim 의 잡기 완료 규칙이 컵을 reset 높이보다 7~8 cm 든 상태다).
    no = 컵이 탁자(grasp exit 전). 놓은 뒤(홀더 안)는 못 정함.

- id: cup_in_holder
  at: [place]
  text: Is the {obj} standing upright inside a holder?
  card: 'place "Is the cup seated upright inside the intended holder?"'
  truth: >-
    exit[place].signals.<정책>.scripted_judge.grade: great(구멍 안, 기울기 10° 미만) → yes, fail(구멍 밖) → no,
    partial(구멍 안, 기울기 10° 이상) → 못 정함. result.jsonl objects 의 끝 grade 와 다르면 못 정함.
    손을 못 뗀 놓기(hand_empty 가 true 가 아님)는 fail 만 no, 나머지는 못 정함.
    place 전(컵이 탁자·손 안)은 no. 러너의 place_failed 코드는 쓰지 않는다(빼기 시간 초과여도 컵은 앉아 있을 수 있다).

- id: all_in_holders
  at: [terminal]
  text: Are all three cups standing upright inside holders?
  card: 'terminal "Are all three cups in their intended holders?"'
  truth: >-
    yes = 세 컵 모두 grade great(끝 상태와 같음). no = 탁자·손 안인 컵이 있음, 제 경계(final 판정)에서는 fail 인 컵도 no.
    partial 인 컵이 있으면 못 정함.

# 뺀 질문과 이유
excluded:
- card: 'go_home "Is the selected hand empty?" · place "Are the fingers open and clear of the cup?" · terminal "Are both robot hands empty?"'
  why: >-
    빈 손은 화면에 없을 때가 많다. home 자세의 왼손은 화면 밖이고 오른손은 손끝만 보인다(seed1·3·7).
    놓고 뺀 오른손도 화면 밖이다(seed7 place_pink). 손이 보이는지의 참값 필드가 없다. 컵을 쥔 손은 cup_in_hand 가 본다.
- card: 'go_home "Is the arm clear of all cups?"'
  why: 팔과 컵 사이 거리를 적은 참값 필드가 없다.
- card: 'scene_snapshot "Are all three cups visible and upright?"'
  why: 사진에 보이는지는 참값 필드가 없다(sim 의 scene 은 카메라가 아니라 참 자세를 읽는다).
- card: 'scene_snapshot "Is the blue cup distinct from the pink cup?"'
  why: 상태를 묻는 질문이 아니라 답이 늘 yes 다. 참값 필드도 없다.
- card: 'grasp "Is the cup still held without slipping?"'
  why: 미끄러짐은 시간 변화라 사진 한두 장에 없다. 떨어뜨림은 cup_in_hand 가 본다.
- card: 'grasp "Is the hand clear of the pink cup?"'
  why: 참값이 grasp_blue 도중의 최소 거리(lift_guard min_clear_mm)뿐이다. 경계 시점 값이 아니다.
- card: 'to_tilt_start "Is the cup upright during transport?"'
  why: 이송 도중 장면이다. 경계 사진은 이송이 끝난 뒤다.
- card: 'to_tilt_start "Are both cups ready for pouring?"'
  why: ready 의 기준이 사진으로 정해지지 않는다. 두 손이 컵을 쥐었는지는 cup_in_hand 가 본다.
- card: 'tilt "Is the source rim above the shaker opening?"'
  why: 붓는 도중 장면이다. 경계 사진은 컵을 되세운 뒤다.
- card: 'tilt "Are the beads entering the shaker?"'
  why: 붓는 도중 장면이다. 경계 사진은 컵을 되세운 뒤다.
- card: 'tilt "Are any beads still visible in the source cup?"'
  why: 구슬 양 질문은 넣지 않는다(구슬이 6~7 px). 병 모양 컵의 안쪽도 사진에 보이지 않는다.
- card: 'tilt "Have both cups returned upright?"'
  why: 되세운 뒤 컵 기울기를 적은 참값 필드가 없다(러너 COMPLETED 는 궤적 재생이 끝났다는 뜻). 기운 채 끝난 반례 사진도 없다.
- card: 'place "Is the cup stable without hand support?"'
  why: 멈춰 있는지는 시간 변화라 사진 한두 장에 없다.
- card: 'human "Are human hands outside the workspace?" · "Is the scene ready to be observed again?"'
  why: 이 기록에는 human 노드 경계가 없고 sim 에 사람 손이 없다.
- card: 'stop "Has all arm motion stopped?" · "Are the held objects still secure?"'
  why: 이 기록에는 stop 노드 경계가 없다. 움직임은 사진 한 장에 없다.
