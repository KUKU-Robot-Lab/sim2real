    ok: 'yes'
  - slot: cup_in_hand:left:SHAKER
    ok: 'yes'
  place_shaker:
  - slot: cup_in_holder_b:SHAKER
    ok: 'yes'
  home_l_after_shaker:
  - slot: cup_in_holder_b:SHAKER
    ok: 'yes'
