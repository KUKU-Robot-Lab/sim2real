    ok: 'yes'
  to_tilt_start_l:
  - slot: cup_in_hand:left:SHAKER
    ok: 'yes'
  tilt_blue:
  - slot: cup_in_hand:right:SRC_BLUE
    ok: 'yes'
  - slot: cup_in_hand:left:SHAKER
    ok: 'yes'
  place_blue:
  - slot: cup_in_holder_b:SRC_BLUE
    ok: 'yes'
  home_r_after_blue:
  - slot: cup_in_holder_b:SRC_BLUE
    ok: 'yes'
  - slot: cup_in_hand:left:SHAKER
    ok: 'yes'
  grasp_pink:
