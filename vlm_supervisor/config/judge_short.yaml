    ok: 'yes'
  - slot: cup_lifted:SRC_PINK
    ok: 'yes'
  to_tilt_start_r2:
  - slot: cup_in_hand:right:SRC_PINK
    ok: 'yes'
  tilt_pink:
  - slot: cup_in_hand:right:SRC_PINK
    ok: 'yes'
  - slot: cup_in_hand:left:SHAKER
    ok: 'yes'
  place_pink: []
  home_r_after_pink:
