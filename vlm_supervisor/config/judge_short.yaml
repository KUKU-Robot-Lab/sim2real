about: 짧은 예/아니오 판정 설정 — vlm_supervisor.bench.calibrate 가 만든다. 손으로 고치지 말고 다시 만든다.
source:
  results: _work/vlm_plan_1118/res/all/all_8b_720/results.jsonl
  items: _work/vlm_plan_1118/res/all/set_all_720/items.jsonl
  items_sha256: 75548fa8a5b330cbb7568dcb8a0d0e5bec789df404eb8e91d91ac793909d19b4
  variant: short2
  split: loeo
prompt: 'These two photographs show a two-arm robot at a table with a blue cup and a pink cup (both bottle-shaped), an orange shaker cup and three white cup holders. The first was taken before the last
  robot action and the second after it. Answer the question about the second photograph with yes or no.

  Question: {question}'
choices:
- 'yes'
- 'no'
min_mass: 0.5
thresholds:
  all_in_holders: 0.71
  cup_in_hand: 0.98
  cup_in_holder_b: 0.4
  cup_lifted: 0.5
  holders_any_cup: 0.16
questions:
  all_in_holders: Are all three cups standing upright inside holders?
  cup_in_hand:left:SHAKER: Is the robot's left hand holding the orange shaker cup?
  cup_in_hand:right:SRC_BLUE: Is the robot's right hand holding the blue cup?
  cup_in_hand:right:SRC_PINK: Is the robot's right hand holding the pink cup?
  cup_in_holder_b:SHAKER: Is the orange shaker cup inside one of the white cup holders, not on the table and not held by a robot hand?
  cup_in_holder_b:SRC_BLUE: Is the blue cup inside one of the white cup holders, not on the table and not held by a robot hand?
  cup_in_holder_b:SRC_PINK: Is the pink cup inside one of the white cup holders, not on the table and not held by a robot hand?
  cup_lifted:SHAKER: Is the orange shaker cup lifted clear of the table?
  cup_lifted:SRC_BLUE: Is the blue cup lifted clear of the table?
  cup_lifted:SRC_PINK: Is the pink cup lifted clear of the table?
  holders_any_cup: Is there a cup standing inside any of the white cup holders?
node_checks:
  scene:
  - slot: holders_any_cup
    ok: 'no'
  grasp_blue:
