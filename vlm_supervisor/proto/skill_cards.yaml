문서: VLM 에피소드 드라이버 스킬 카드
기준일: '2026-11-10'
근거_루트: /home/yoon/rl_ws/sim2real
근거_읽기: 상대 파일:줄은 근거_루트 기준. 절대 메모 경로는 당시 관찰이며 현행 코드보다 우선하지 않음. 원문_YAML은 원본을 파싱한 동일 의미 YAML(주석/공백 제외).
대상: Cosmos-Reason2-2B; 사진+텍스트→JSON. 사진 질문은 관찰 보조이며 수치 상태/이벤트를 함께 입력해야 함.
사용자_요청: 블루컵과 핑크컵에 있는 비드를 오렌지 쉐이커 컵에 옮겨줘.
객체_사전:
- 사용자_말:
  - 블루컵
  - 파란컵
  - 파랑컵
  시스템_이름: SRC_BLUE
  색: 파랑
  실물: source240_blue
  policy_object: source240_real
  손: right
  홀더: HOLDER_1
  홀더_번호: 1
  근거:
  - config/episodes/cocktail_1c_e4000.yaml:12
  - config/episodes/cocktail_1c_e4000.yaml:56
- 사용자_말:
  - 핑크컵
  - 분홍컵
  시스템_이름: SRC_PINK
  색: 분홍
  실물: source240_pink
  policy_object: source240_real
  손: right
  홀더: HOLDER_2
  홀더_번호: 2
  근거:
  - config/episodes/cocktail_1c_e4000.yaml:14
  - config/episodes/cocktail_1c_e4000.yaml:65
- 사용자_말:
  - 오렌지 쉐이커
  - 오렌지 쉐이커 컵
  - 주황 쉐이커
  시스템_이름: SHAKER
  색: 주황
  실물: shaker_c_orange
  policy_object: shaker_c_real
  손: left
  홀더: HOLDER_0
  홀더_번호: 0
  근거:
  - config/episodes/cocktail_1c_e4000.yaml:15
  - config/episodes/cocktail_1c_e4000.yaml:67
홀더_사전:
  HOLDER_0: '0: 왼쪽'
  HOLDER_1: '1: 가운데'
  HOLDER_2: '2: 오른쪽 바깥'
  자세_파일: config/cup_holder_poses_5090_v1.yaml
  근거: config/episodes/cocktail_1.yaml:29
공통_실행_계약:
- 규칙: '지원 type: snapshot, trajectory, policy, parallel_policy, confirm, hand, terminal, lanes. human/stop/grasp 등 카드
    id와 YAML type을 혼동하지 않는다.'
  근거: deploy/policy_control/policy_control/episode_spec.py:57
- 규칙: expect는 실제 센서 검사식이 아니라 성공 후 World에 적용하는 선언. VLM 관찰과 NodeResult.status/reason/signals를 분리한다.
  근거: deploy/policy_control/policy_control/episode_runner.py:454
- 규칙: failure_policy.default=0. 현재 baseline은 자동 retry/rollback 없음. 단 place continue_on_fail 예외 및 reset stale/T_in 내부
    재시도는 별도.
  근거: config/episodes/cocktail_1c_e4000.yaml:31
- 규칙: 'hold의 의미 구별: 초기 정책 hold_steps, 성공 freeze_hold_steps, 가드 정지 후 GUARD_HOLD_S, 팔 정지 창, place release/withdraw 틱. VLM
    1~2 Hz 사진으로 이 틱을 세지 않는다.'
  근거: deploy/policy_control/policy_control/rh_aglt_goals.py:38
실행기_인터페이스:
  정책_서비스: /policy_control/<side>/episode/{reset,start,stop}; place 서비스 ns는 <side>_place. 이벤트는 /policy_control/<side>/episode에서
    node 이름과 episode로 구분.
  실행_순서: job_params 설정→reset→aglt goal 설정→start→해당 episode stop/abort 이벤트→신호 판정.
  근거:
  - deploy/policy_control/policy_control/episode_ros.py:3
  - deploy/policy_control/policy_control/episode_ros.py:173
  - deploy/policy_control/policy_control/episode_ros.py:657
스킬:
- id: go_home
  하는_일: 지정한 빈손 팔을 충돌 검사한 경로로 홈에 돌려놓는다.
  실행_방법:
    노드_예시:
    - id: go_home_start
      type: trajectory
      name: go_home
      expect:
        pose: HOME
      checkpoint: HOME_START
    - id: home_r_after_blue
      type: trajectory
      name: go_home_r
      auto: true
      expect:
        right_hand: EMPTY
        left_hand: SHAKER
    - id: go_home_end
      type: trajectory
      name: go_home
      auto: true
      expect:
        pose: HOME
    원문_YAML: "id: go_home_start\ntype: trajectory\nname: go_home\nexpect:\n  pose: HOME\ncheckpoint: HOME_START\nid:\
      \ home_r_after_blue\ntype: trajectory\nname: go_home_r\nauto: true\nexpect:\n  right_hand: EMPTY\n  left_hand:\
      \ SHAKER\nid: go_home_end\ntype: trajectory\nname: go_home\nauto: true\nexpect:\n  pose: HOME"
    근거: config/episodes/cocktail_1c_e4000.yaml
    정의:
      go_home:
        kind: rehome
        sides:
        - right
        - left
      go_home_r:
        kind: rehome
        sides:
        - right
  인자:
    hand:
    - both
    - right
    name:
    - go_home
    - go_home_r
  시작_조건:
  - 움직일 팔의 손은 EMPTY. 왼손이 SHAKER이면 go_home_r만 사용한다.
  - pd phase TRACKING, estop 해제.
  성공_모습:
    사진: 지정 팔이 홈에 있고 컵을 건드리지 않는다.
    숫자:
    - 규칙: 이미 홈이면 HOME_SKIP_RAD=0.03 rad 안이고 정지한 경우 계획·재생 생략. 그렇지 않으면 plan_rehome → check_path_start → replay_to_pd →
        pd_goto_home 모두 성공.
      근거: deploy/policy_control/policy_control/episode_ros.py:910
    - 규칙: 실행 완료 뒤 expect.pose=HOME 기록(오른팔만 복귀는 두 손 expect 유지).
      근거: config/episodes/cocktail_1c_e4000.yaml:34
  끊어야_할_신호:
  - 규칙: pd TRACKING 아님, 손에 물체 있음, 계획/시작점 검사 rc!=0이면 실행 거부. 재생/홈 서비스 실패는 error.
    근거: deploy/policy_control/policy_control/episode_ros.py:917
  - 규칙: 도구 상한 plan_rehome.py 120.0 s, check_path_start.py 60.0 s, replay_to_pd.py 600.0 s; 초과는 tool timeout → controller_error.
    근거: deploy/policy_control/policy_control/episode_ros.py:137
  다음으로_연결:
  - 시작 홈→scene_snapshot; 파랑 놓기 뒤 오른팔 홈→분홍 grasp; 끝 홈→terminal.
  흔한_실패:
  - 규칙: 컵을 쥔 채 rehome은 거부된다. 먼저 stop/human으로 현재 상태를 확인하고 빈손을 확정한 뒤 복귀한다.
    근거: deploy/policy_control/policy_control/episode_ros.py:922
  VLM_질문:
  - Is the selected hand empty?
  - Is the arm clear of all cups?
- id: scene_snapshot
  하는_일: 세 컵의 현재 정지 자세를 읽고 분홍 컵의 허용 영역을 검사한다.
  실행_방법:
    노드_예시:
    - id: scene
      type: snapshot
    원문_YAML: 'id: scene

      type: snapshot'
    근거: config/episodes/cocktail_1c_e4000.yaml
  인자:
    object:
    - SRC_BLUE
    - SRC_PINK
    - SHAKER
    objects: 생략하면 시작 물체 전체. 부분 재촬영은 snapshot objects 목록(이 정답 계획에는 없음).
  시작_조건:
  - 컵이 탁자에 서 있고 사람 손이 시야에서 빠져 있다.
  - 세 홀더가 고정 자세 파일과 일치하고 비어 있는지 사진으로 확인(권장 전제).
  성공_모습:
    사진: 파랑·분홍·주황 컵을 구별할 수 있고 움직임이 없다.
    숫자:
    - 규칙: SNAPSHOT_WINDOW_S=1.5, SNAPSHOT_MIN_FRAMES=5, 위치 중앙값에서 최대 거리 <= SNAPSHOT_STILL_M=0.005 m.
      근거: deploy/policy_control/policy_control/episode_ros.py:59
    - 규칙: live 정지 자세 우선; rescan 직후에는 pose 우선. live가 충분하지만 움직이면 옛 static 자세로 대체하지 않는다.
      근거: deploy/policy_control/policy_control/episode_ros.py:273
    - 규칙: SRC_PINK region x=[0.26,0.305], y=[-0.365,-0.330] m(base).
      근거: config/episodes/cocktail_1c_e4000.yaml:14
  끊어야_할_신호:
  - 규칙: 필요 물체 없음/움직임은 cup pose missing, 영역 밖은 cup outside region → target_not_found. 기본 재시도 0이므로 정지.
    근거: deploy/policy_control/policy_control/episode_runner.py:427
  - 규칙: snapshot 대기 상한=1.5+3.0 s. 부분 objects 재촬영의 fpp_rescan --wait=60은 별도.
    근거: deploy/policy_control/policy_control/episode_ros.py:598
  다음으로_연결:
  - 성공한 snapshot으로 두 grasp lane에 물체 이름과 가드용 SRC_PINK 좌표를 전달한다.
  흔한_실패:
  - 규칙: 분홍이 영역 밖이면 손으로 바로 놓게 한 뒤 human 확인·새 snapshot을 권장한다. 현재 baseline은 자동 재배치하지 않는다.
    근거: config/episodes/cocktail_1c_e4000.yaml:31
  - 규칙: '색 컵 혼동·가림: 부분 재촬영 또는 사람 확인. cocktail_1의 confirm_pink_placed/scene_pink를 쓸 때는 해당 순서 전체로 전환해야 한다.'
    근거: config/episodes/cocktail_1.yaml:65
  VLM_질문:
  - Are all three cups visible and upright?
  - Is the blue cup distinct from the pink cup?
  - Are all holders empty?
- id: grasp
  하는_일: 빈손으로 컵에 접근(ap05)한 뒤 같은 노드의 rcg04로 넘겨 잡아 든다.
  실행_방법:
    노드_예시:
    - id: grasp_blue
      type: policy
      name: rh_aglt_r
      target_object: SRC_BLUE
      policy_object: source240_real
      lift_guard:
        object: SRC_PINK
        guard_mm: 40
        hstop_m: 0.08
      expect:
        right_hand: SRC_BLUE
    - id: grasp_shaker
      type: policy
      name: rh_aglt_l
      target_object: SHAKER
      policy_object: shaker_c_real
      expect:
        left_hand: SHAKER
    - id: grasp_pink
      type: policy
      name: rh_aglt_r
      target_object: SRC_PINK
      policy_object: source240_real
      expect:
        right_hand: SRC_PINK
        left_hand: SHAKER
    원문_YAML: "id: grasp_blue\ntype: policy\nname: rh_aglt_r\ntarget_object: SRC_BLUE\npolicy_object: source240_real\n\
      lift_guard:\n  object: SRC_PINK\n  guard_mm: 40\n  hstop_m: 0.08\nexpect:\n  right_hand: SRC_BLUE\nid: grasp_shaker\n\
      type: policy\nname: rh_aglt_l\ntarget_object: SHAKER\npolicy_object: shaker_c_real\nexpect:\n  left_hand: SHAKER\n\
      id: grasp_pink\ntype: policy\nname: rh_aglt_r\ntarget_object: SRC_PINK\npolicy_object: source240_real\nexpect:\n\
      \  right_hand: SRC_PINK\n  left_hand: SHAKER"
    근거: config/episodes/cocktail_1c_e4000.yaml
    정의:
      rh_aglt_r:
        policy: rh56f1/aglt/right_approach_ap05
        kind: aglt
        side: right
        approach_grasp:
          handoff: 1
        handoff: rh56f1/aglt/right_rcg04
        cup_obs_offset_base_m:
        - -0.0116
        - 0.0338
        - 0.0
      rh_aglt_l:
        policy: rh56f1/aglt/left_approach_ap05
        kind: aglt
        side: left
        approach_grasp:
          handoff: 1
        handoff: rh56f1/aglt/left_rcg04
        cup_obs_offset_base_m:
        - 0.0028
        - 0.0283
        - 0.0046
  인자:
    hand:
    - right
    - left
    object:
      right:
      - SRC_BLUE
      - SRC_PINK
      left:
      - SHAKER
    policy_object:
      SRC_BLUE: source240_real
      SRC_PINK: source240_real
      SHAKER: shaker_c_real
    lift_guard: 'SRC_BLUE/right만 {object: SRC_PINK, guard_mm: 40, hstop_m: 0.08}; 분홍·왼손은 사용하지 않음'
  시작_조건:
  - 선택한 손 EMPTY, 대상 컵은 snapshot으로 확인된 탁자 물체.
  - 반대 손 상태를 유지한다(분홍 잡을 때 left_hand=SHAKER).
  성공_모습:
    사진: 손가락이 대상 컵을 감싸고 컵이 탁자에서 들려 함께 움직인다.
    숫자:
    - 규칙: '미션 실제 설정: goal_max=1 또는 freeze_rule=lift_hold, freeze_lift_m=0.07, freeze_hold_steps=120. 기본 클래스의 30틱과 구별한다.'
      근거: config/mission_rh56f1_control_cam5090.yaml:7969
    - 규칙: goal_max 성공이 먼저면 종료. lift_hold는 lift_dz>0.07 m AND held가 120틱 연속(60 Hz에서 2 s). fresh=False이면 카운터 갱신을 보류한다.
      근거: deploy/policy_control/policy_control/rh_aglt_goals.py:144
    - 규칙: dropped=False; attached=False는 lift_hold/guard_hold_ok가 없으면 grasp_failed. attached인 경우 live_off_m>0.04면 grasp_failed.
        setting_err_m>0.04는 lifted 예외가 없을 때 pose_mismatch.
      근거: deploy/policy_control/policy_control/episode_failure.py:133
  끊어야_할_신호:
  - 규칙: ap05 손바닥-컵 거리 > far_abort_m=0.35 m이면 접근 abort; approach_max_s=15.0 안에 준비 자세 정지를 못해도 abort.
    근거: deploy/policy_control/policy_control/approach_grasp.py:123
  - 규칙: lift_hold/goal 완료 즉시 정책 종료 후 목표 유지. stop event/abort event를 실제 episode 번호와 함께 읽는다.
    근거: deploy/policy_control/policy_control/episode_ros.py:713
  - 규칙: '파랑 가드: 측정/명령 관절에서 계산한 최소 clearance<40 mm 또는 비유한 값이면 guard: 정지; 신선한 컵 상승>0.08 m AND held가 LG_HSTOP_TICKS=5 연속이면
      hstop: 정지. 해당 틱 새 목표는 발행하지 않는다.'
    근거: deploy/policy_control/policy_control/pour_fj_node.py:942
  - 규칙: 'guard:/hstop: 정지 후 live 상승 >=0.05 m를 1.0 s 유지, 갱신 간격<=0.5 s, 최대 6.0 s 대기, 상승<=0.20 m, live 컵–palm<=0.12 m(palm
      age<=0.5 s). guard_hold_ok=True일 때만 carry 허용.'
    근거: deploy/policy_control/policy_control/episode_ros.py:64
  - 규칙: 가드 켜짐 확인 실패/고정 판정 실패는 lift_guard_failed로 safe_stop. dropped가 있으면 가드 판정으로 덮지 않는다.
    근거: deploy/policy_control/policy_control/episode_ros.py:686
  - 규칙: max_episode_s=33.0; 실행기 stop event 대기=33+POLICY_MARGIN_S(10.0). 이벤트 미수신이면 stop→timeout.
    근거: config/mission_rh56f1_control_cam5090.yaml:8017
  다음으로_연결:
  - 규칙: 'ap05→rcg04: hypot(off_r_m,off_h_m)<=ready_tol_m=0.025 m 상태가 still_s=0.5 s 이어지고 창 평균 손바닥 속도<=still_mps=0.03 m/s.
      chain.handover로 같은 노드에서 교체하며 phase=policy가 된다.'
    근거: deploy/policy_control/policy_control/approach_grasp.py:284
  - 규칙: hold_steps=10은 각 계약의 정책 초기 hold이고 성공 유지 시간과 다르다. ap05→rcg04 종료로 grasp 완료를 선언하지 않는다. rcg04의 goal/lift/가드 판정 뒤
      carry.
    근거: deploy/policies/rh56f1/aglt/right_rcg04/rh_aglt_contract.json:18
  - 규칙: 먼저 끝난 팔은 자기 carry를 시작한다. 양 lane 완료 후에만 tilt. 한 lane 실패면 다른 lane도 safe_stop.
    근거: deploy/policy_control/policy_control/episode_runner.py:288
  - 규칙: handover는 접근 정책의 마지막 arm_target을 복사해 새 decoder 시작값으로 보존한다. 새 계약/정책, ready_hold_action(직전 행동), step_i=0, 넘김 순간
      컵 기준 GoalBook을 설정하고 policy.reset()으로 LSTM을 초기화한다. rcg04 hold_steps=10 동안 예열한다.
    근거: deploy/policy_control/policy_control/pour_fj_node.py:307
  흔한_실패:
  - 규칙: 'attached 끊김/컵 미끄러짐: object_dropped_left/right이면 정지, 자동 손 펴기 금지. grasp_failed_left/right라도 baseline 재시도 0이므로
      사람 확인.'
    근거: deploy/policy_control/policy_control/episode_failure.py:133
  - 규칙: 'FP++ live 끊김: reset의 특정 stale 거부만 6.0 s 안에서 0.2 s 간격 재호출. 실행 중 stale/오류를 VLM 사진 성공으로 덮지 않는다.'
    근거: deploy/policy_control/policy_control/episode_ros.py:87
  VLM_질문:
  - Is the intended cup enclosed by the fingers?
  - Has the cup lifted clear of the table?
  - Is the cup still held without slipping?
  - Is the hand clear of the pink cup?
- id: to_tilt_start
  하는_일: 쥔 컵과 손 목표를 유지하며 지정 팔을 붓기 시작 자세로 이송한다.
  실행_방법:
    노드_예시:
    - id: to_tilt_start_r1
      type: trajectory
      name: to_tilt_start_r
