  성공_모습:
    사진: 팔·손이 동작을 멈추고 쥔 물체를 유지한다.
    숫자:
    - 규칙: cancel 설정→모든 실행기 subprocess kill→대상 팔 정책 episode/stop. 손을 자동으로 펴거나 rehome하지 않는다.
      근거: deploy/policy_control/policy_control/episode_ros.py:1386
  끊어야_할_신호:
  - 규칙: pd_fault, estop, thermal, controller, watchdog, stale/missing 관측, UNKNOWN, lift_guard_failed는 safe_stop 대상. VLM이
      안전 규칙을 대체하지 않는다.
    근거: deploy/policy_control/policy_control/episode_failure.py:69
  다음으로_연결:
  - 정지 후 human; 새 에피소드/확인 전 자동 다음 스킬 연결 금지.
  흔한_실패:
  - 정책만 user stop 하면 실행기도 aborted로 받아 복구하지 않는다. 전체 에피소드 stop을 사용해 다른 lane/재생도 함께 끊는다.
  VLM_질문:
  - Has all arm motion stopped?
  - Are the held objects still secure?
- id: terminal
  하는_일: 에피소드 실행 결과를 종료하되 실제 비드 이동 성공은 별도로 보고한다.
  실행_방법:
    노드_예시:
    - id: done
      type: terminal
      result: SUCCESS
    원문_YAML: 'id: done

      type: terminal

      result: SUCCESS'
    근거: config/episodes/cocktail_1c_e4000.yaml
  인자:
    result:
    - SUCCESS
  시작_조건:
  - 계획의 마지막 go_home이 끝남.
  성공_모습:
    사진: 두 손이 비고 세 컵이 지정 홀더에 있으며 비드가 쉐이커에 모여 있음(내부가 안 보이면 미확인).
    숫자:
    - terminal result=SUCCESS는 baseline 실행 상태. place_failed_continued 및 실제 비드 이동 판정을 별도 확인한다.
  끊어야_할_신호:
  - 진행 중 스킬을 끊는 stop 용도가 아니다.
  다음으로_연결:
  - 종료; 미확인 항목은 human에 보고.
  흔한_실패:
  - 규칙: 실패를 계속 진행한 이력은 terminal 로그에도 남지만 SUCCESS와 공존할 수 있다.
