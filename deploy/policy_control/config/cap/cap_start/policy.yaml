# RH56F1 cap 학생 시작 자세로 옮기는 이송 자산 — 11.18. tools/cap_now.py(= tilt_now 의 계획 · 검사 · 재생을 이 자산으로) 가 쓴다.
# tilt/base_arc6 과 다른 것은 start_pose 하나다. 이송 계획(plan_carry · hdgp ready_carry Mover)과 손 안 가상 컵 자리
#   (ref/single734_t120.npz 행 0 — 왼손 shaker)는 base_arc6 그대로 쓴다: ref/ 는 ../../tilt/base_arc6/ref 심볼릭 링크,
#   hdgp 핀도 base_arc6 과 같아야 plan_carry 가 같은 Mover 로 계획한다(핀을 고칠 때는 두 파일 같이).
# 오른손은 빈손(cap 편 손) → cap_now 가 plan_carry --empty right 로 오른손 가상 컵을 뗀다.
#   왼손 쉐이커 자리는 tilt 기준 쥔 자리라 경로 f 의 실제 쥔 자리와 다르면 그만큼 탁자 · 두 팔 사이 검사가 어긋난다.
name: cap/cap_start
kind: cap_setting
objects: {right: null, left: shaker_c_real}
start_pose: deploy/policy_control/config/homes/rh56f1_cap_start.yaml
start_gap_rad: 0.05          # 계획한 자세 ↔ 재생 직전 실측 최대 간극
table:
  from: config/head_extrinsics.yaml   # table_top_z(hand-eye CAD 사슬, 줄자 0.205)
  margin_m: 0.01                      # 컵 최저점 − 탁자 윗면. 받는 컵은 붓는 동안 sim 탁자(0.20) 위 약 2 cm
