# RH56F1 양팔 tilt 1차 — traj_v10 의 200 컵 궤적에서 붓는 컵 입구 중심을 shaker 입구 중심 위로 옮긴 판(11.07 사용자
# "src240의 정중앙 입구가 shaker 입구 중앙이 올 수 있도록 트레젝토리 재추출 필요. src200도 미리 따로 준비해줘").
# 바뀐 것: ref/params_200.json 의 ox · dox 만(ox = 0.012·cos θ0, dox = 0.012·cos θmax − ox). setup_200.npz · asset_meta.json ·
#   hdgp 핀 · 시작 자세 · 홀더 · 탁자는 traj_v10 그대로. v10 의 sim 성공률 근거(240 0.815 · 200 0.805)는 이 판에 그대로 옮겨지지 않는다(sim 재평가 전).
# 11.07 laptop 계획 확인(11.06 15:14 실기 시작 자세, 기본 T_in): 최대 기울기에서 입구 중심 수평 거리 v10 31.0 mm → 1.0 mm(90°~최대 0.6~1.0) · FP++ 실측 T_in 1.7~2.0 mm.
#   IK · 홀더 여유 · 탁자 · 속도 · 관절 여유 검사 통과(plan_tilt_traj checks). 입구 높이 차(붓는 쪽 위 11~13 mm)는 v10 과 같다.
name: tilt/traj_v11_200
kind: tilt_traj
objects: {right: source200_real, left: shaker_c_real}
start_pose: deploy/policy_control/config/homes/rh56f1_pour_start.yaml   # md5 99bdbe88… = sim inputs 와 같음
pre_s: 0.5                   # 실측 → 궤적 첫 knot 관절 min-jerk(sim --start capture --pre_s 0.5)
rate_scale: 1.0              # sim 과 같은 빠르기(knot 1/30 s → 60 Hz 선형 보간)
start_gap_rad: 0.05          # 계획한 실측 ↔ 재생 직전 실측 최대 간극(replay_to_pd --max-start-gap)
table:
  from: config/head_extrinsics.yaml   # table_top_z 0.2037(sim 0.205)
holders:
  default: config/cup_holder_poses_5090_v1.yaml   # sim 과 같은 옛 배치(86d3f8c9…). 10.27 새 배치 재스캔 뒤 --holders 로 새 파일
