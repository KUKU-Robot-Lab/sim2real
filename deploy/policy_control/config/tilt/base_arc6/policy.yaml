# RH56F1 양팔 tilt(붓기) 기본 궤적(잔차 0) — 10.17 사용자 결정 8 · 9 · 12 (docs/PLAN_GRASP_TILT_EVAL_2026-10-17.md)
#
# 궤적 = D4 rh_ref_s2h4 ep5000 의 기본 궤적(arc6: 양손 동시 원호, 최대 기울기 128.6°, 4.86 s) + 복귀(유지 2 s → 원호 4 s 되짚기
#   → 1 s) + 측정 출발 관절까지 관절 최소 저크(0.5 rad/s, 최소 2 s) + 1 s. 실기 출발마다 hdgp tilt_real_start.py 로 다시 푼다
#   (학습과 같은 traj_retarget_starts 계산). 오른손 = 붓는 병(source240_real), 왼손 = 받는 컵(shaker_c_real).
# 이송 = 잡기(7 cm 들림) 뒤 ready_carry(hdgp Mover, q_goal = 붓기 시작 자세 rh56f1_pour_start.yaml) — 컵을 세운 채 곧게.
# 손 안 컵 자리 = 기준 출발 single734_t120 행 0 의 자리(실측 아님). 실제 쥔 자리가 다르면 컵 경로가 그만큼 어긋난다.
#
# 계획 · 검사 도구: deploy/policy_control/tools/plan_carry.py · plan_tilt.py (움직이지 않는다). 재생: replay_to_pd.py(14 관절).
name: tilt/base_arc6
kind: tilt_base
objects: {right: source240_real, left: shaker_c_real}
start_pose: deploy/policy_control/config/homes/rh56f1_pour_start.yaml
rate_scale: 1.0              # D4 학습과 같은 빠르기. 병 쪽 60 Hz 명령 최대 1.89 rad/s(검사 한계 2.0)
start_gap_rad: 0.05          # 계획한 자세 ↔ 재생 직전 실측 최대 간극
table:
  from: config/head_extrinsics.yaml   # table_top_z(hand-eye CAD 사슬, 줄자 0.205)
  margin_m: 0.01                      # 컵 최저점 − 탁자 윗면. 받는 컵은 붓는 동안 sim 탁자(0.20) 위 약 2 cm
hdgp:
