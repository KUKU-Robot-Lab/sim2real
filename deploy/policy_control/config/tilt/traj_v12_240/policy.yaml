# RH56F1 양팔 tilt 1차 — traj_v11_240 에서 ref/setup_240.npz 의 T_in_r · T_in_l(손바닥 → 컵)만 실기 실측 평균으로 바꾼 판(11.07 사용자
# "잡기 성공한 자세가 거의 동일하더라, 지금 컵을 생각보다 낮게 잡는다", "왼손 손 안 shaker 측정으로 일단 bag 파일들 많으니까").
# 평균 = tilt 직전 정지 구간 FP++ live(신선 값만). 오른손 bag 3개(11.04 131813 · 11.06 113604 · 151437), 왼손은 11.06 두 개만(11.07 팀장:
#   11.04 131817 은 손바닥-shaker 43.5 mm 로 지금 쥐는 방식 31 mm 안팎과 달라 뺌). 잡기 직후 값은 11~20 mm 달라 안 씀.
#   T_in_r (9.9, 27.7, 68.2) mm(기본에서 축 19.9°), T_in_l (-28.9, 36.3, 3.6) mm(기본보다 z -30.8 mm, 축 20.9°). 축 둘레 회전은 기본 것(대칭 병).
#   만든 곳 logs/analysis/tilt_tin_1107/{hold_windows,tin_all,build_v12}.py, 값 out/tin_fixed_1107.json. params · asset_meta · 나머지 npz 키는 v11 그대로.
# 11.07 FK 검사(fk_compare.py): 최대 141.2° 입구 수평 3.2 mm(90°~최대 1.9~3.2) · 에피소드별 양손 T_in 11.06 113608 6.7 · 151440 4.3 mm, 뺀 11.04 131817 21.1 mm · IK 0.82 mm · 홀더 여유 33.1 mm · 통과. sim 재평가 전.
