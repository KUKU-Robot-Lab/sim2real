#
# 흐름: 잡기 → plan_carry(ready_carry, 끝 = rh56f1_pour_start.yaml) → plan_tilt_traj.py(이 자산) → replay_to_pd 14 관절.
# sim 근거(server eval/1026_grasp2tilt): 이송 240 249/250 · 200 248/250 → 궤적 재생 성공(구슬 전부 / ≥90 %)
#   240 0.815/0.992 · 200 0.805/0.988 — 학습 뱅크(v10 0.834/0.995 · v10b 0.778/0.957)와 ±4 %p 안.
# ref/ 는 tools/build_tilt_traj_asset.py 가 server 에서 sim Context 로 만든 것(asset_meta.json 에 출처 md5 · 기준 궤적 정보).
#   setup_<컵>.npz: q0 · mouth_ref(CMA 기준점 = tilt_rl/v9/cma<컵>/grasps 파지 0) · D4 표 · Geo · 여유 설정 · 기본 T_in · 기준 궤적
#   params_<컵>.json: 240 = tilt_rl/v10/cma240/final_params.json(35a58ca5…) · 200 = tilt_rl/v10b/final_params_200.json(97792a52…)
# 2차(잔차 RL tilt_bi_v10b)는 이 궤적 위에 정책을 얹는 구조로 나중에 바꿔 끼운다(이 자산은 잔차 0).
