# RH56F1 왼팔 shaker 섞기(잔 돌리기, swirl) — place_shaker 직전, 오른팔이 홈에 간 뒤(11.18 사용자: 기울여 돌리기 · 실기 시연용 · 비드가 쏟아지지 않게 순하게).
# 궤적 = hdgp scripts/tools/shaker_mix/motion.py 가 만든 왼팔 60 Hz arm_target npz(시작 · 끝 = start_pose left, 손 안 shaker = tin.from T_in_l).
#   IK 뒤 시간축 가우시안(σ 3 프레임)으로 j6 관절 한계 장벽이 켜지는 프레임의 j2 속도 계단을 편다. Newton sim(swirl 19 · 22 · 25°, 0.4 Hz, 3바퀴)
#   컵 밖 비드 0(부드럽게 하기 전 판).
# 검사 · 복사 = deploy/policy_control/tools/plan_mix.py(움직이지 않는다), 재생 = replay_to_pd.py(왼팔 7 열만 — 쥔 손은 그대로).
# ★2단계(11.18): arm5080 에서 swirl 19° npz 를 만들어 ref/ 에 두고 md5 · made_by 를 채웠다.
name: mix/shaker_swirl
kind: mix
objects: {left: shaker_c_real}
side: left
start_pose: deploy/policy_control/config/homes/rh56f1_pour_start.yaml   # npz 첫 · 끝 프레임 = 이 파일 left
rate_scale: 0.6              # 실기 첫 판(손목 약 1 rad/s). 시간만 늘린다(0 < r ≤ 1, plan_mix 가 검사 · 가속도는 r² 배로 잰다)
start_gap_rad: 0.05          # 왼팔 실측 ↔ npz 첫 프레임 · npz 끝 ↔ start_pose left 최대 간극(plan_mix 검사 · replay_to_pd --max-start-gap). 실기 tilt 끝 ↔ q0 대리 지표 0.022~0.024
ref_npz: mix_swirl_19deg_0.4hz_x2.npz     # ref/ 안 파일 이름(motion.py 이름 규칙 mix_<kind>_<amp>_<freq>hz_x<cycles>.npz)
tin:                         # 손바닥 → shaker(arms_clear 의 컵 점). motion.py 와 같은 파일 · 같은 z_off
  from: deploy/policy_control/config/tilt/traj_v12_240/ref/tin_fixed_1107.json
  md5: 093851c01ba8cd569a3c3fa9a031594b
  z_off_m: 0.02              # tin_live.Z_OFF["left"] — T_in_l 은 shaker 원점 + 0.02·z 를 가리킨다
hdgp:                        # plan_mix 가 쓰는 hdgp = ready_carry(FK · 컵 점) + URDF. base_arc6 와 같은 핀(snapshot 225abc056 사본 md5 같음 확인 11.18)
  commit: 225abc056
  md5:
    source/openarm/openarm/agnostic/modules/ready_carry/__init__.py: 6a921e20ba3ea5fa3c943e175a39bf3d
    source/openarm/openarm/agnostic/modules/ready_carry/chain.py: e93981f98a8e74bada451eb3b0a59568
    source/openarm/openarm/agnostic/modules/ready_carry/posture.py: 84539be194cf9f27f245d82e0473f762
    source/openarm/openarm/agnostic/modules/ready_carry/mover.py: 5c8f015fda6cdb3e7ae590abf5ba6e25
    assets/robot/openarm_rh56f1_bi_rl/openarm_rh56f1_bi_rl.urdf: f338d043ce3481f72e37ec4c79e20d43
ref:
  mix_swirl_19deg_0.4hz_x2.npz: ce4c76c2e5aeb8083a00c02ae0cd7e1b   # ★11.18 사용자: 19° 로 진행(22° 보다 비드 이동 적음)
made_by:                     # 2단계에서 채운다
  command: CUDA_VISIBLE_DEVICES= PYTHONPATH=source/openarm ~/rl_ws/IsaacLab3/.venv/bin/python scripts/tools/shaker_mix/motion.py --motion swirl --amp 19 --freq 0.4 --cycles 2 --out logs/shaker_mix/1118_ref_swirl19
  host: arm5080
  hdgp_commit: ac9aa93d
  motion: {kind: swirl, amp_deg: 19.0, freq_hz: 0.4, cycles: 2, ramp_s: 0.5, smooth_sigma_frames: 3.0}
  check: {ik_pos_err_mm: 0.4, ik_rot_err_deg: 0.73, vmax_rad_s: 1.395, amax_rad_s2: 3.84, amax_raw_rad_s2: 11.73, limit_margin_rad: 0.268, end_gap_rad: 0.0, ok: true}
tilt_comp: false             # 11.18 판단 보류 — plan_mix 보고 참고, 2단계에서 정한다
