# RH56F1 손 연결 — 손마다 개별 포트. tools/rh56f1_driver.py 가 읽는다.
# 미션 산출물(rh56f1_ports)이라 바꾸면 손 단계 승인을 다시 받는다.
#
# ★10.02 사용자: RS485 는 더 쓰지 않는다 — EtherCAT 으로 손 상태 · 명령(정책 제어 포함).
#   손 하나 = NIC 하나(손 EtherCAT 포트는 하나뿐이라 데이지체인 불가, 일반 스위치는 브로드캐스트 폭주 — 10.01).
#   arm4090 배선: 오른손 = USB-C 랜(enx00e04c6806e1 — 이름이 MAC 이라 꽂는 순서와 무관) · 왼손 = 내장 랜 enp6s0.
#   transport: ethercat → policy_control/rh56f1_ecat_node.py(ROS · 벤더와 같은 토픽) + tools/ethercat/rh56f1_ecat_master(1 kHz).
#   마스터는 cap_net_raw 가 필요하다: bash tools/ethercat/build.sh → sudo setcap cap_net_raw,cap_net_admin=ep tools/ethercat/rh56f1_ecat_master
#   10.02 실측(SAFE_OP 1 kHz 3000 회): 잃음 0 · PDO 왕복 오른손 p50 68 us · 왼손 41 us.
right: {transport: ethercat, ifname: enx00e04c6806e1, hand_id: 1}
left:  {transport: ethercat, ifname: enp6s0, hand_id: 1}

ethercat:
  master: tools/ethercat/rh56f1_ecat_master   # sim2real 기준 경로
  # ★10.03 실측: 1000 Hz 에서는 OP 요청을 손 MCU 가 읽지 못한다(AL event 0x0220 bit0 · SM2 가 안 읽힌 채, SAFE_OP 대기 · code 0).
  #   LAN9252(ID 0x9252) SSC 펌웨어가 프로세스 데이터 처리에 밀려 상태기계를 못 도는 것으로 본다. 500 · 250 · 100 Hz 는 바로 OP.
  cycle_hz: 500           # PDO 주기 — 1000 은 OP 가 안 된다
  cycle_hz_op: 0          # >0: OP 에 들어간 뒤 이 주기로(예 1000). 0 = cycle_hz 그대로 — 10.03 실측 전이라 꺼 둔다
  state_hz: 200           # ROS 발행(angle_actual 등) — ★10.03 pd 120 Hz · 정책 60 Hz 보다 빠르게(상태 나이 ≤ 5 ms)
  speed: 2000             # 시작 SPEEDSET(pd 가 hw_speed 로 덮는다) · 매뉴얼 0~4000
  force: 600              # 시작 FORCESET(g, pd 가 hw_force 로 덮는다) · 매뉴얼 0~1000
  enable_value: 1         # 명령 중 ENABLE_SET 값 — 매뉴얼은 'Motion control enable' 뿐이라 첫 OP 시험에서 확인
  hb_timeout_ms: 500      # 노드 소식이 이만큼 없으면 마스터가 제자리 유지(hold)로
  # OP 실험 손잡이(10.02 손이 OP 요청 뒤 SAFE_OP 에 머묾 · code 0) — 기본은 끔, 드라이버 --op-enable · --sync-type 로도 켠다
  op_enable: false        # true: 명령 전(hold)에도 ENABLE_SET = enable_value (목표 = 지금 각도라 손은 제자리)
  sync_type: -1           # 0x1C32/0x1C33:01 에 쓸 값(-1 = 안 씀, 0 free run · 1 SM 동기)
  op_timeout_ms: 3000     # OP 요청 대기 — 넘으면 ESC 레지스터를 찍고 다시 요청

# 옛 RS485(10.02 이전 · 비상용) — `rh56f1_driver.py --side <s> --transport rs485` 가 이 블록을 쓴다(벤더 드라이버 robot_control
# rh56f1_driver). 손 RS485 포트에 USB-RS485(FTDI) 를 다시 꽂아야 한다 — 10.02 밤에는 빠져 있었다.
rs485:
  right: {transport: rs485, port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG0327KL-if00-port0, baud: 115200, hand_id: 1}
  left:  {transport: rs485, port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG033STU-if00-port0, baud: 115200, hand_id: 1}
