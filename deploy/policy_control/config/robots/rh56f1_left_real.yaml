# left 팔 + Inspire RH56F1 (자산 hdgp/assets/robot/openarm_rh56f1_bi_rl) — 실기(arm4090). 09.29 사용자: rh56f1 제어 연결.
# 손: robot_control rh56f1_driver(/hand_left/angle_*, 0.1°) → policy_control rh56f1_state_node → /hand_left/joint_states(rad).
# 손 명령은 pd 가 벤더 각도 레지스터로 직접(/hand_left/angle_set, 변환표 config/rh56f1_hand_map.yaml).
# ★10.03 CPU: 팔 상태는 robot_control 브링업의 pd 전용 사본(pd_state_broadcaster, 250 Hz · 14 관절 · 위치/속도/힘)을 읽는다.
#   /joint_states(750 Hz)는 기록용으로 그대로 — 파이썬 pd · 정책이 750 Hz 를 받으면 rclpy 콜백만으로 프로세스당 약 0.5~1 코어.
#   모터 온도도 pd_temp_broadcaster(10 Hz · 온도만). 브링업이 이 두 broadcaster 를 띄우지 않으면 pd 가 'stale' 로 engage 를 거부한다.
robot: rh56f1_left_real
temperature_topic: /pd_temp_broadcaster/dynamic_joint_states   # 10.03 — 10 Hz · 온도만
joint_profiles:
  - robot_control/src/robot_control/profiles/openarm_rh56f1.yaml
sources:
  arm:
    type: joint_state
    topic: /pd_state_broadcaster/joint_states   # 10.03 — 250 Hz 사본(위 머리 주석)
    joints: [l_aj_1, l_aj_2, l_aj_3, l_aj_4, l_aj_5, l_aj_6, l_aj_7]
    naming: source
    stale_sec: 0.5
  ee:
    type: joint_state
    topic: /hand_left/joint_states          # rh56f1_state_node — 구동 6 + 종속 6, rad
    joints: [l_hj_thumb_1, l_hj_thumb_2, l_hj_index_1, l_hj_middle_1, l_hj_ring_1, l_hj_pinky_1]
    naming: source                            # 프로필 source = canonical(RH56F1 은 이름 변환이 없다)
    stale_sec: 0.5
  tip_force:
    type: float_array
    topic: /hand_left/tip_forces            # 손끝 법선 힘 5(엄지 → 새끼, N — 벤더 단위 실측 전)
    tips: [l_hl_thumb_tip, l_hl_index_tip, l_hl_middle_tip, l_hl_ring_tip, l_hl_pinky_tip]
    axes: 1
    required: false
    stale_sec: 0.5
  object:
    type: pose
    topic: /objects/aglt_cup_s065/pose
    frame: base_link
    mode: live
    required: false
    stale_sec: 0.5
  decoder_target:
    type: joint_state
    topic: /policy_control/joint_target
    joints: [l_hj_thumb_1, l_hj_thumb_2, l_hj_index_1, l_hj_middle_1, l_hj_ring_1, l_hj_pinky_1]
    naming: canonical
    required: false
    stale_sec: 1.0
  head:
    type: joint_state
    topic: /head/joint_states
    joints: [head_j_pan, head_j_tilt]
    naming: canonical
    required: false
    stale_sec: 1.0
groups:
  left_arm:
    backend: arm_forward
    side: left
    jtc: left_joint_trajectory_controller
    forward: [left_forward_position_controller, left_forward_velocity_controller, left_forward_effort_controller]
  left_hand:
    backend: rh56f1_angle
    side: left
    topic: /hand_left/angle_set
    hand_id: 0                                # 0 = 이 포트의 손(드라이버가 손마다 프로세스 하나)
    map: sim2real/deploy/policy_control/config/rh56f1_hand_map.yaml
table:
  top: 0.205
  clearance_min: -0.01
  center_xy: [0.375, -0.165]            # 같은 테이블 — 좌우 로봇 yaml 이 같은 값(dg5f_m_left_real 과 같다)
  size_xy: [0.550, 0.970]
