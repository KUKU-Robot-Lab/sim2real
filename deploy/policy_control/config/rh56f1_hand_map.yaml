# Inspire RH56F1 손 — sim 관절(rad) ↔ 벤더 드라이버 각도 레지스터(0.1°) 변환표. policy_control/rh56f1_map.py 가 읽는다.
#
# 드라이버: robot_control ros_ws/src/inspire_rh56f1 (rh56f1_driver). 손마다 개별 포트 · 프로세스 하나.
#   /hand_<side>/angle_set (SetAngle1 int32[6], -1 = 그 축은 움직이지 않는다) · /hand_<side>/angle_actual (GetAngleAct1)
#   슬롯 0..5 = 새끼 · 약지 · 중지 · 검지 · 엄지 굽힘 · 엄지 회전 (벤더 매뉴얼 1040..1045 표)
# sim: hdgp 자산 openarm_rh56f1_bi_rl — 구동 6(thumb_1 · thumb_2 · index_1 · middle_1 · ring_1 · pinky_1), 0 rad = 편 손.
#
# ★방향: 매뉴얼 ANGLE_SET 절 — 검지 1720(≈ 1740) 이 완전히 편 상태, 900 으로 두면 손바닥 쪽으로 굽는다.
#   즉 네 손가락은 **레지스터가 클수록 펴진다**. sim 0 rad(편 손) → 1740, 한계(굽힘) → 900.
#   (옛 isaacsim_bridge 의 rh56f1_hand_calibration.yaml 은 0 rad → 900 이라 편 손 명령이 주먹이 된다 — 쓰지 않는다.)
# ★엄지 두 축의 방향 · 대응(슬롯 4 = thumb_2 굽힘, 5 = thumb_1 회전)은 09.30 arm4090 오른손에서 사용자가 눈으로 확인했다
#   (probe: thumb_2 +0.15 rad = 손바닥 쪽 굽힘, thumb_1 −0.3 rad = 손바닥을 가로지르는 대향). 같은 날 왼손도 확인 — true.
#   한 손만 확인된 축은 verified: [right] 처럼 적는다 — 확인 안 된 손 · 축은 pd 가 -1(움직이지 않음)을 보낸다.
#   네 손가락(슬롯 0~3)도 09.30 오른손 probe(+0.3 rad)에서 슬롯 대응 · 굽힘 방향 확인(레지스터 1750 → 1575).
# ★비례: 레지스터 끝값 ↔ URDF 한계를 선형으로 잇는다. 매뉴얼 84° vs URDF 87.58°(네 손가락) — 벤더 xlsx
#   (urdf/vendor/RH56F1/RH56F1_R/参数资料/RH56F1行程与角度对应关系) 로 보면 비선형일 수 있다. 실측 전까지 끝점 선형.
schema: policy_control/rh56f1_hand_map/v1
slot_order: [pinky_1, ring_1, middle_1, index_1, thumb_2, thumb_1]
#: 이 관절 순서가 pd · 정책의 손 6관절 순서(자산 control_joint_order = hdgp 프로필 순)
joint_order: [thumb_1, thumb_2, index_1, middle_1, ring_1, pinky_1]
joints:
  #        rad 끝점 (lo, hi)             그 끝점의 레지스터(0.1°)       방향 확인
  thumb_1:  {rad: [0.0, 2.0943951], reg: [1750, 600],  verified: true}    # 엄지 회전(슬롯 5) — 09.30 양손 확인(레지스터 ↑ = 대향 쪽)
  thumb_2:  {rad: [0.0, 0.4745550], reg: [1350, 1100], verified: true}    # 엄지 굽힘(슬롯 4) — 09.30 양손 확인(레지스터 ↓ = 손바닥 쪽 굽힘)
  index_1:  {rad: [0.0, 1.5285594], reg: [1740, 900],  verified: true}    # 매뉴얼: 클수록 펴짐
  middle_1: {rad: [0.0, 1.5285594], reg: [1740, 900],  verified: true}
  ring_1:   {rad: [0.0, 1.5285594], reg: [1740, 900],  verified: true}
  pinky_1:  {rad: [0.0, 1.5285594], reg: [1740, 900],  verified: true}
#: 손 · 축별 보정 — 09.30 arm4090 레지스터 스윕(한 축씩 단계별 angleSet → posAct 행정 → 벤더 행정-각도 표 → 관절각).
#  q[°] = (reg0 − 레지스터) · deg_per_10reg / 10. 관계는 직선(잔차 네 손가락 ≤ 0.9° · 엄지 ≤ 0.1°), 기울기 ≈ 1.00 °/10reg —
#  위 기본 끝점(1740 ↔ 0 · 900 ↔ 87.58°)은 기울기 1.043 · 영점이 틀려 최대 6.5° 어긋났다. 관절 0 = 벤더 '이론 행정' 시작
#  (네 손가락 · 엄지 굽힘 0.25 mm, 엄지 외전 0.77 mm — URDF 한계가 이 범위와 같다). 명령 레지스터는 기본 끝점 범위로 자른다.
#  원자료 sim2real/logs/rh56f1_probe_0930/sweep_*.csv · 분석 docs/RH56F1_TUNING_0930.md. side 없이 부르면 기본 끝점.
calibration:
  right:
    index_1:  {reg0: 1776.3, deg_per_10reg: 1.0052}
    middle_1: {reg0: 1771.8, deg_per_10reg: 1.0045}
    ring_1:   {reg0: 1787.5, deg_per_10reg: 1.0095}
    pinky_1:  {reg0: 1790.9, deg_per_10reg: 1.0121}
    thumb_2:  {reg0: 1362.0, deg_per_10reg: 0.9923}
    thumb_1:  {reg0: 1754.8, deg_per_10reg: 0.9979}
  left:
    index_1:  {reg0: 1779.0, deg_per_10reg: 1.0065}
    middle_1: {reg0: 1764.3, deg_per_10reg: 1.0013}
    ring_1:   {reg0: 1766.7, deg_per_10reg: 1.0019}
    pinky_1:  {reg0: 1762.6, deg_per_10reg: 1.0010}
    thumb_2:  {reg0: 1376.4, deg_per_10reg: 0.9891}
    thumb_1:  {reg0: 1817.8, deg_per_10reg: 0.9980}
#: PhysX mimic(자산 URDF) — 드라이버는 구동 6 만 준다. 상태 노드가 종속 6 을 계산해 JointState 에 싣는다(FK · 화면용).
mimic:
  thumb_3: {of: thumb_2, k: 1.1425}
  thumb_4: {of: thumb_3, k: 0.7508}
  index_2: {of: index_1, k: 1.1169}
  middle_2: {of: middle_1, k: 1.1169}
  ring_2: {of: ring_1, k: 1.1169}
  pinky_2: {of: pinky_1, k: 1.1169}
#: 촉각 — TouchData1.finger_forces(법선) · finger_tangentials(접선) 는 새끼부터(벤더), sim 은 엄지부터. 단위 0.01 N(추정) — 실측 전.
#  09.30 arm4090 손으로 누름: 양손 손끝 10개 모두 반응, 쉴 때 정확히 0(잡음 0 · 문턱 없음 — 원시 1 부터 나온다), 3000 에서 포화.
#  누를 때 접선이 법선의 0.4~1.0배(중앙) — sim 촉각은 손끝 `*_sensor` 링크 합력의 크기라 combine: magnitude(√(법선² + 접선²)).
#  손바닥 9칸 중 3 · 6 · 9 번째는 쉴 때 65535(없는 칸), 나머지는 누르면 3000 까지. 근접(proximity) 값은 65000 대 — 쓰지 않는다.
touch:
  vendor_order: [pinky, ring, middle, index, thumb]
  sim_order: [thumb, index, middle, ring, pinky]
  unit_n: 0.01
  unit_verified: false
  combine: magnitude
  max_raw: 3000
#: 명령 주기 상한 — 벤더 노드는 쓰기마다 응답을 최대 25 ms 기다리고 그만큼 읽기 주기가 밀린다(robot_control README).
command_max_hz: 30.0
