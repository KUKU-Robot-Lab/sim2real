# 사이트 arm_v1 — tag "5090 only + e2c adapter"(10.28 사용자: 오늘은 이걸로 진행). 손 프로토콜 값은 ../rh56f1_ports.yaml.
# 고르기: export S2R_SITE=arm_v1 또는 echo arm_v1 > ~/.config/s2r/site (policy_control/site_ports.py).
#   로더가 이름을 소문자로 찾는다 — 사용자 표기 ARM_v1 로 골라도 이 파일이다(파일 이름은 소문자여야 찾는다).
# 판 이름(10.28 사용자): v1 = 5090 only + e2c 어댑터(이 파일) · v2 = 5090/4090 + 허브(나중에 다시 세팅 — 그때 arm_v2.yaml 을 만든다).
# arm(10.26~10.27)과 다른 점
#   - 왼손 = e2c 어댑터 안의 USB 10/100 랜(wch.cn 1a86:5394 · cdc_ether · USB 2.0 허브 1a86:809d 1-11 의 5 번 포트).
#     메인보드 랜 eno1 은 비었다(링크 없음).
#   - 머리 카메라 D435i 가 arm4090 이 아니라 5090 에 꽂혀 있다(5090 only).
# 좌우 근거(커널 로그): 10.27 21:58:40 eno1 · enx00e04c6806e1 동시에 끊김(손 전원 끔) → 10.28 09:56:18 둘 다 동시에 연결(손 전원 켬)
#   → 09:56:20 eno1 끊김 → 09:56:26 e2c 어댑터 연결. enx00e04c6806e1 은 그 뒤 끊긴 적 없다 → 오른손 그대로(10.26 전원 끄기로 확인한 NIC),
#   eno1 에 있던 왼손이 e2c 어댑터로 옮겨졌다. 두 손은 EtherCAT 데이터로는 구별되지 않는다 — 배선을 또 바꾸면 손 하나를 끄고 carrier 로 확인.
site: arm_v1
tag: "5090 only + e2c adapter"
rh56f1:
  right: {ifname: enx00e04c6806e1}   # RTL8156 USB 3.0 랜(arm 과 같음)
  left:  {ifname: enxc817f5b9f11e}   # e2c 어댑터 USB 10/100 랜(10.28)
can: {right: can0, left: can1}          # PCAN-USB Pro FD(arm 과 같음), 미션이 FD 1M/5M 로 올린다
head_port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763P8T-if00-port0   # Dynamixel U2D2(목) → /dev/ttyUSB0

# 통신 속도 기록(10.28 10:00~10:35 실측, 무동작 — 로더는 이 블록을 쓰지 않는다). 배선을 바꾸면 다시 재서 고친다.
# 손 · 팔 값은 SCHED_FIFO 80, 두 손(두 팔)을 같은 때 잼. 손 = OP 요청 없음(SAFE_OP 까지), 팔 = 0x7FF 0xCC 상태 읽기만(토크 켜기 없음).
