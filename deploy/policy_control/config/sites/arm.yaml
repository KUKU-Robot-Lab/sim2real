# 사이트 arm — 10.26 새 배선(사용자). 손 프로토콜 값은 ../rh56f1_ports.yaml.
# 고르기: export S2R_SITE=arm 또는 echo arm > ~/.config/s2r/site (policy_control/site_ports.py)
# 손마다 NIC 직결, 스위치 없음: 오른손 USB 3.0 랜 · 왼손 USB 2.0 랜(22:06 임시, 그 전 21:52~22:02 메인보드 랜 eno1).
# 10.26 실측: enx00e04c6806e1(RTL8156 2.5G, 5 Gbps 포트) 에 EtherCAT slave 1 · 잃음 0/500 · p50 40 us.
#   사용자가 오른손을 끄자 21:47:30 이 NIC carrier off → 이 NIC 는 오른손(처음에 왼손으로 넣은 것을 고침).
# 왼손 = 메인보드 랜 eno1(Intel igc) 직결, VLAN 없음. 10.26 21:52 링크 100 Mbps · ecat_rtt slave 1 · 잃음 0/500 · p50 245 us
#   (USB 랜 40 us 보다 느림 — igc 인터럽트 묶기 추정, 500 Hz 주기 2 ms 안). eno1 에 VLAN 연결 rh56f1_r · rh56f1_l 도 함께 올라온다.
site: arm
rh56f1:
  right: {ifname: enx00e04c6806e1}
  left:  {ifname: enx00e04c36034e}   # ★10.26 22:06 임시 — USB 2.0 랜 RTL8152(rh56f1_ports.yaml 10.09 '쓰지 않는다'). USB 3 랜으로 바꾸면 고친다
can: {right: can0, left: can1}          # PCAN-USB Pro FD(10.26 연결 확인), 미션이 FD 1M/5M 로 올린다
head_port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763P8T-if00-port0   # Dynamixel(목) → /dev/ttyUSB0

# 통신 속도 기록(10.26 실측, 읽기 전용 — 로더는 이 블록을 쓰지 않는다). 배선을 바꾸면 다시 재서 고친다.
