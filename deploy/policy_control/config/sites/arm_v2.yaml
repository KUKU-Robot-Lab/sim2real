                 pdo_500hz_20s_us: {n: 10000, lost: 0, rtt_p50: 52.6, rtt_p90: 57.0, rtt_p99: 66.1, rtt_max: 375.7,
                                    cycle_p50: 2000.0, cycle_p99: 2036.8, cycle_max: 2235.0},
                 hand: "slave 1 · 출력 38 B · 입력 152 B · 끝나면 INIT"}
    hand_isolation: "태그 없는 eno1 로 BRD 200 번: 응답 0(손은 VLAN 밖에서 보이지 않는다)"
    hand_under_lan_load_5s:
      "5090 -> 4090 TCP 939 Mbit/s": "두 손 잃음 0 · PDO 왕복 p50 146 / 140 us · max 515 / 390 us"
      "4090 -> 5090 UDP 100 Mbit/s": "두 손 잃음 0 · p99 67 / 76 us · max 267 / 364 us"
