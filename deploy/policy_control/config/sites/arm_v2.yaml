# 사이트 arm_v2: tag "5090/4090 + hub"(10.30 사용자). 손 프로토콜 값은 ../rh56f1_ports.yaml.
# 고르기: export S2R_SITE=arm_v2 또는 echo arm_v2 > ~/.config/s2r/site (policy_control/site_ports.py).
#   로더가 이름을 소문자로 찾는다. 사용자 표기 ARM_v2 로 골라도 이 파일이다(파일 이름은 소문자여야 찾는다).
# 판 이름(10.28 사용자): v1 = 5090 only + e2c 어댑터(arm_v1.yaml), v2 = 5090/4090 + 허브(이 파일).
# 역할(10.30 사용자): 5090 = 로봇 제어(팔 CAN, 손 EtherCAT)와 정책 실행, 4090 = 카메라 D435i, 목 다이나믹셀, FP++.
#   rh56f1 · can 은 5090 값이다. 목과 카메라는 4090 에 있어 hosts.vision 에 적고 head_port 는 비운다
#   (5090 에서 check_host 가 목 U2D2 를 찾지 않는다).
# 허브: 관리형 스위치(관리 주소 192.168.0.239, 웹 로그인). VLAN 10 · 20 은 손, 태그 없는 랜은 5090 · 4090 사이.
#   5090 eno1 은 트렁크(eno1.10 · eno1.20 + 태그 없음 192.168.0.50). 4090 enp6s0 도 트렁크라 손 VLAN 프레임을 받는다
#   (enp6s0.10 · .20, NM rh56f1_r · rh56f1_l). 4090 에서 손 드라이버를 띄우면 5090 마스터와 겹치니 띄우지 않는다.
#   4090 의 로컬 사이트 파일 arm4090.yaml(git 밖, ~/.config/s2r/site=arm4090)은 손을 enp6s0.10 · .20 로 잡는다.
# 좌우: VLAN 10 = 오른손, 20 = 왼손은 NM 연결 이름(rh56f1_r = eno1.10 · rh56f1_l = eno1.20)과 kitech 스위치 배치
#   (GE3 오른손 VLAN 10 · GE5 왼손 VLAN 20)를 따랐다. 두 손은 EtherCAT 데이터로 구별되지 않는다.
#   손 하나를 끄고 어느 VLAN 에서 slave 가 사라지는지로 확인한다(10.30 확인 대기).
# 받는 쪽 포화 주의: 4090 -> 5090 을 TCP 로 꽉 채우면(939 Mbit/s) 두 손 SAFE_OP 설정이 실패했다(아래 기록).
#   실기 중에는 4090 -> 5090 큰 복사(scp · rsync · 영상 원본 스트림)를 하지 않는다. tailscale 도 이 랜으로 간다.
site: arm_v2
tag: "5090/4090 + hub"
rh56f1:
  right: {ifname: eno1.10}   # 5090 메인보드 랜(Intel igc) VLAN 10
  left:  {ifname: eno1.20}   # VLAN 20
can: {right: can0, left: can1}          # PCAN-USB Pro FD(5090, arm_v1 과 같음), 미션이 FD 1M/5M 로 올린다
head_port: null                         # 목 U2D2 는 4090 에 있다(hosts.vision.head_port)
hosts:
  control: {name: "5090", ifname: eno1, ip: 192.168.0.50, tailscale: 100.103.21.126,
            role: "로봇 제어(팔 CAN · 손 EtherCAT) · 정책 실행"}
  vision:  {name: arm4090, ifname: enp6s0, ip: 192.168.0.40, tailscale: 100.104.123.85,
            role: "카메라 D435i · 목 다이나믹셀 · FP++",
            head_port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763P8T-if00-port0,
            camera_rs_serial: "348122071637"}
hub: {mgmt_ip: 192.168.0.239, vlan: {right_hand: 10, left_hand: 20}}

# 통신 속도 기록(10.30 09:20~09:50 실측, 무동작. 로더는 이 블록을 쓰지 않는다). 배선을 바꾸면 다시 재서 고친다.
# 손 = SAFE_OP 까지(OP 요청 없음), 두 손 동시, SCHED_FIFO 80. 20 s 판은 cpu_plan 과 같은 코어(오른손 23 · 왼손 22).
