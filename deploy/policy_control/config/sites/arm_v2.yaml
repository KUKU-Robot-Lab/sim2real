    arm_can: {adapter: "PCAN-USB Pro FD (0c72:0011)", bus: "CAN FD 1M / 5M(can_up.py --execute 로 올림, 그대로 UP)",
              result: "두 팔 모두 상태 새로고침(0xCC) 응답 0/8 · ERROR-PASSIVE(ACK 없음). 팔 전원이 꺼진 것으로 추정(10.28 은 7/7)"}
  vision_4090:
    lan: {nic: enp6s0, chip: "Realtek r8169", ethernet: "1000 Mbps full", ip: 192.168.0.40,
          note: "NM '유선 연결 1' 고정 주소. enp6s0.10 · .20 도 올라와 손 VLAN 프레임을 받는다(5090 SAFE_OP 한 번에 VLAN 마다 약 8.5k 패킷)"}
    camera_d435i: {rs_serial: "348122071637", fw: 5.16.0.1, usb: "5000 Mbps (USB 3.2, 4-2)",
