# 사이트 kitech — 10.22~10.26 의 5090 배선(사용자). 손 프로토콜 값은 ../rh56f1_ports.yaml.
# 고르기: export S2R_SITE=kitech 또는 echo kitech > ~/.config/s2r/site (policy_control/site_ports.py)
# 두 손 = CBS220 스위치 VLAN: GE1 = 5090 eno1(트렁크, VLAN 10·20) · GE3 오른손(VLAN 10) · GE5 왼손(VLAN 20)
# · GE2 vision-3090. PC 쪽 NetworkManager 연결 rh56f1_r(eno1.10) · rh56f1_l(eno1.20).
site: kitech
rh56f1:
  right: {ifname: eno1.10}
  left:  {ifname: eno1.20}
can: {right: can0, left: can1}          # PCAN-USB Pro FD, FD 1M/5M
head_port: /dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FT763P8T-if00-port0   # Dynamixel U2D2(목)
