# 1-B reach 의 컵 앞 사전 파지 자세 · 이동 — aglt_new 의 ReadyApproach(hdgp tasks/rh_aglt_{r,l}/ready_approach.py)를 그대로 쓴다.
# 10.20 사용자 "컵 접근은 ready-carry 세팅을 aglt_new 세션에 물어봐". 값은 hdgp cff27786d 의 rh_aglt_{r,l}/rh_aglt_env_cfg.py
# ready_* 기본값을 옮겼다(학습 cfg 는 다른 세션이 계속 고치므로 배포는 여기 고정한다 — 바꿀 때는 diff 를 보고 손으로).
#   손바닥 원점 = 컵 원점(FP++ 원점 = 몸통 가운데) + 2.5 R · e_r + 0 · 위 (10.19 사용자: 손 중심 높이 = 병 원점)
#   방위 φ(e_r) = a + b x + c y [deg] — approach_r 2판 재생 16 자리 회귀 −15°. 왼손은 y 거울.
#   손바닥 법선 · 손가락 방향 = 컵 틀(e_r, e_t, 위) 고정 성분. 경유점 = 사전 파지 + 바깥 4 cm + 위 4 cm(바깥 위에서 들어온다).
#   IK 실패면 방위 ±10 · 20 · 30° 를 작은 것부터 다시 푼다.
# 배포만 다른 점: 방위 흔들기 jitter 0(학습은 ±10°) — 같은 컵 자리면 같은 계획.
