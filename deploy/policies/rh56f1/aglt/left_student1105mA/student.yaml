# 1105m 목표 마스크 학생 A(깊이 + 목표/이웃 마스크, arch v3) left — 학생 전용 배포 묶음(11.07). 경로는 이 폴더 기준.
# 가중치(student/*.pt)는 git 밖: logs/policy/student_mask_A/l/student_it00800.pt · logs/policy/student_mask_A/yolo/seg_s640_A/best.pt 의 하드 링크.
# head_depth_node --policy-dir(깊이, rgb 끔) · head_mask_node --policy-dir(YOLO) · StudentPolicy.from_dir 가 읽고 md5 가 다르면 시작하지 않는다.
kind: student_depth_mask
side: left
task: rh_aglt_l
one_obj: shaker_c_cvx
rgb: false
mask:
  mode: A
  target_class: orange          # 기본 목표. 미션 · 노드 인자 -p target_class:=blue|pink|orange 로 바꾼다
  yolo:
    path: student/yolo_seg_s640_A.pt
    md5: b6ac0cd679bee22c100f9fef105832b8
    conf: 0.25                # 여기부터 다섯 값 = head_mask_node --policy-dir 가 쓰는 값 · /head_mask/config 와 대조(다르면 reset 거부)
    imgsz: 640
    retina_masks: true
    top1_per_class: true      # 클래스마다 conf 최고 인스턴스 하나(탁자 밖 오검출 억제, 11.07 검증)
    cross_class_iou: 0.5      # 다른 클래스 인스턴스와 마스크 IoU 가 이를 넘으면 conf 낮은 쪽을 버린다(0 = 끔)
