  - {label: 머리, value: "XC330 pan ID 1 · tilt ID 2 · 1M · 홈 config/head_home_rh56f1.yaml(5090 과 틱이 다르다 — offset pan +1024 · tilt −1024)"}
  - {label: 홈, value: "hdgp rh_aglt 시작 자세(09.29) — 차렷 → 홈 저장 경로 paths/home_rh56f1_{right,left}.npz (RRT, 여유 2 cm, 약 27 · 33 s)"}
